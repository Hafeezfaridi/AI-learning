<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive Schizophrenia Pathophysiology &amp; Pharmacology Simulator</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--ink:#1b2333;--muted:#5b6578;--line:#d5dbe6;--brand:#2f6fdd;--blue:#2f6fdd;--red:#e5484d;--gray:#8a94a6;--green:#1fa463;--brain:#f3e3dc;--brain2:#e6d2ca;--accent:#eef3fd;--warn:#fff4e0;--shadow:0 2px 10px rgba(20,30,60,.08);--purple:#8b5cf6;--amber:#e8a317;--teal:#14b8a6;--pink:#e879a6;color-scheme:light}
[data-theme=dark]{--bg:#0f1420;--panel:#171e2e;--ink:#e8edf7;--muted:#9aa6bd;--line:#2c3650;--brain:#3a3040;--brain2:#2f2735;--accent:#1c2640;--warn:#3a2f17;--shadow:none;--blue:#5b94ff;--red:#ff6369;--gray:#8d97ab;--green:#3ddc97;--brand:#5b94ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:8px 14px 11px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;flex:1 1 260px;min-width:0}
.brand span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{font-size:22px}
.brand .auth{font-weight:600;color:var(--brand);white-space:nowrap;flex:none}
nav,.tools{display:flex;gap:6px;flex-wrap:wrap}
#topProg{position:absolute;left:0;right:0;bottom:0;height:3px}
#topProg i{display:block;height:100%;width:0;background:var(--green);transition:width .5s}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer;line-height:1.3}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.on{background:var(--accent);border-color:var(--brand);color:var(--brand);font-weight:600}
.btn.ghost{background:transparent}
#menuBtn{display:none}
#wrap{display:grid;grid-template-columns:262px minmax(0,1fr)}
#side{position:sticky;top:var(--hh,56px);align-self:start;height:calc(100vh - var(--hh,56px));overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:12px}
#main{padding:18px 22px 60px;max-width:1280px;width:100%;margin:0 auto}
.sideh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 6px 6px}
.si{display:flex;gap:6px;align-items:center;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:7px 8px;border-radius:8px;font:inherit;font-size:13.5px;cursor:pointer}
.si:hover{background:var(--accent)}
.si.act{background:var(--accent);color:var(--brand);font-weight:600}
.si .st{margin-left:auto;font-size:12px;color:var(--green)}
.pbar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--green);transition:width .4s}
.page h2{margin:.1em 0 .2em;font-size:26px}
.mnum{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);font-weight:700}
.sub{color:var(--muted);max-width:85ch;margin:.2em 0 .6em}
.chip{display:inline-block;background:var(--accent);color:var(--brand);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;margin:0 3px 3px 0}
.objs{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(290px,1fr);gap:14px;margin-top:12px;align-items:start}
.stage,.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.stage{padding:6px}
.stage svg{width:100%;height:auto;display:block}
.panel{padding:12px 14px}
.side>.panel+.panel{margin-top:12px}
.ctls{display:flex;flex-direction:column;gap:9px}
.ctls:empty{display:none}
.ctl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13px;align-items:center}
.ctl input[type=range]{grid-column:1/3;width:100%}
.ctl.tog{display:flex;gap:6px;align-items:center;cursor:pointer}
.ctl select{grid-column:1/3;padding:5px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.info h4{margin:0 0 6px;font-size:16px}
.info p{margin:.4em 0}
.info ul{margin:.3em 0;padding-left:1.2em}
.info li{margin:.2em 0}
.info small,.muted{color:var(--muted)}
.tag{display:inline-block;border-radius:6px;padding:0 7px;font-size:12px;font-weight:600;background:var(--accent);color:var(--brand)}
.tag.r{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.tag.g{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.tag.y{background:color-mix(in srgb,var(--amber) 20%,transparent);color:#a06f00}
[data-theme=dark] .tag.y{color:var(--amber)}
.chain{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.cstep{border:2px solid var(--blue);border-radius:10px;padding:6px 10px;font-weight:600;text-align:center;transition:.3s;background:var(--accent)}
.cstep small{display:block;font-weight:400;color:var(--muted)}
.cstep.red{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--panel))}
.cstep.gray{border-color:var(--gray);background:color-mix(in srgb,var(--gray) 14%,var(--panel))}
.cstep.green{border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,var(--panel))}
.carr{text-align:center;color:var(--muted);line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.sym{border:1.5px dashed var(--line);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--muted);transition:.3s}
.sym.on{border-style:solid;color:var(--ink)}
.sym.on.red{border-color:var(--red);background:color-mix(in srgb,var(--red) 14%,var(--panel))}
.sym.on.gray{border-color:var(--gray);background:color-mix(in srgb,var(--gray) 22%,var(--panel))}
.brow{display:grid;grid-template-columns:140px 1fr 48px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.btrack{height:13px;background:var(--line);border-radius:7px;overflow:hidden}
.btrack i{display:block;height:100%;background:var(--blue);transition:width .3s}
.btrack i.r{background:var(--red)}.btrack i.g{background:var(--green)}.btrack i.x{background:var(--gray)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th,.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.t th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.t tr.sel td{background:var(--accent)}
.t tr.clk{cursor:pointer}
.tscroll{overflow:auto}
.dots i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);margin-right:2px}
.dots i.f{background:var(--blue)}.dots.w i.f{background:var(--amber)}.dots.r i.f{background:var(--red)}
.extra{margin-top:14px}
.extra:empty{display:none}
.take{margin-top:14px;background:var(--accent);border-color:var(--brand)}
.take h4,.fac h4{margin:0 0 4px}
.fac{margin-top:14px;background:var(--warn);border-color:var(--amber)}
.fac p{margin:.3em 0}
.mnav{display:flex;justify-content:space-between;margin-top:16px;gap:10px}
.quiz{margin-top:18px}
.qhead{display:flex;justify-content:space-between;align-items:center}
.qhead h3{margin:0}
.qscore{font-weight:700;color:var(--brand)}
.qcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--panel)}
.qtext{font-weight:600;margin-bottom:8px;white-space:pre-line}
.opt{display:block;width:100%;text-align:left;margin:5px 0;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.opt:hover{border-color:var(--brand)}
.opt.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 16%,var(--panel))}
.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 14%,var(--panel))}
.opt.key::after{content:" \2713 key";color:var(--green);font-weight:700;font-size:12px}
.qfb{display:none;font-size:13.5px;margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--accent)}
.qfb.show{display:block}
.qfb.ok{border-left:4px solid var(--green)}.qfb.no{border-left:4px solid var(--red)}
.qfb.fac{display:block;color:var(--muted)}
.qdone{margin-top:10px;background:var(--accent)}
.hero{background:linear-gradient(135deg,var(--accent),var(--panel));border:1px solid var(--line);border-radius:18px;padding:26px 28px}
.byline{font-size:16px;font-weight:600;color:var(--brand);margin:2px 0 8px}
.hero h1{margin:.1em 0;font-size:30px;line-height:1.2}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.lg{display:flex;align-items:center;gap:6px;font-size:13px}
.lg i{width:14px;height:14px;border-radius:50%;display:inline-block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:12px}
.mc{padding:12px 14px;cursor:pointer;transition:.15s;text-align:left;font:inherit;color:var(--ink)}
.mc:hover{transform:translateY(-2px);border-color:var(--brand)}
.mc b{display:block}
.mc small{color:var(--muted)}
.mc .ok{color:var(--green);font-weight:700}
.cert{border:10px double #b8923a;background:#fffdf5;color:#2b2415;padding:40px 30px;text-align:center;border-radius:6px;max-width:820px;margin:16px auto}
.cert h1{font-family:Georgia,serif;margin:.2em 0;font-size:34px}
.cert .nm{font-family:Georgia,serif;font-size:32px;border-bottom:2px solid #b8923a;display:inline-block;padding:0 24px;margin:12px 0}
.wmdisp{height:96px;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:700;background:var(--accent);border-radius:12px;margin:8px 0;font-variant-numeric:tabular-nums}
.recall{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:22px;letter-spacing:.25em}
input.txt{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.legendline{font-size:12px;color:var(--muted)}
.disc{font-size:12.5px;color:var(--muted);border-left:3px solid var(--amber);padding:4px 10px;margin-top:14px}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:absolute;left:0;top:0;width:100%;margin:0}}
@media(max-width:960px){#wrap{grid-template-columns:1fr}#side{position:fixed;left:0;top:var(--hh,56px);width:272px;z-index:25;transform:translateX(-105%);transition:.25s;box-shadow:0 4px 20px rgba(0,0,0,.25)}#side.open{transform:none}#menuBtn{display:inline-block}.grid{grid-template-columns:1fr}#main{padding:14px 12px 50px}.hero h1{font-size:24px}}
</style>
</head>
<body>
<header id="top">
  <button id="menuBtn" class="btn ghost" aria-label="Toggle module menu">&#9776;</button>
  <div class="brand"><span class="logo">&#129504;</span><span>Schizophrenia Pathophysiology &amp; Pharmacology Simulator</span><span class="auth">— Hafeez Faridi Ph.D.</span></div>
  <nav>
    <button class="btn" data-go="home">Home</button>
    <button class="btn" data-go="progress">Progress</button>
    <button class="btn" data-go="final">Quiz Mode</button>
    <button class="btn" data-go="cert">Certificate</button>
  </nav>
  <div class="tools">
    <button class="btn" id="modeBtn" title="Switch Student / Faculty mode">Student mode</button>
    <button class="btn" id="pauseBtn" title="Pause / resume animations">&#9208;</button>
    <button class="btn" id="darkBtn" title="Dark mode">&#127769;</button>
    <button class="btn" id="fsBtn" title="Full screen">&#9974;</button>
    <button class="btn" id="resetBtn" title="Reset all progress">&#10226; Reset</button>
  </div>
  <div id="topProg"><i></i></div>
</header>
<div id="wrap"><aside id="side"></aside><main id="main"></main></div>
<script>
'use strict';
/* ================= CORE ================= */
const NS='http://www.w3.org/2000/svg';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const KEY='schizSim.v1';
let S={mode:'student',dark:null,paused:false,done:{},best:{},visited:{},attempts:[],name:''};
try{const r=localStorage.getItem(KEY);if(r)Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const C={blue:'var(--blue)',red:'var(--red)',gray:'var(--gray)',green:'var(--green)',ink:'var(--ink)',mut:'var(--muted)',line:'var(--line)',acc:'var(--accent)',panel:'var(--panel)',purple:'var(--purple)',amber:'var(--amber)',teal:'var(--teal)',pink:'var(--pink)'};
const OBJ=['Explain the dopamine hypothesis','Explain the glutamate hypothesis','Differentiate positive and negative symptoms','Explain mesolimbic pathway dysfunction','Explain mesocortical pathway dysfunction','Explain antipsychotic mechanisms','Compare first- and second-generation antipsychotics','Recognize adverse effects','Apply pharmacology to patient cases'];
const MODS=[];
let cur={page:'home',arg:0};
const main=$('#main'),side=$('#side');

function h(tag,props,...kids){const e=document.createElement(tag);if(props)for(const k in props){if(k==='class')e.className=props[k];else if(k==='html')e.innerHTML=props[k];else if(k.startsWith('on'))e[k]=props[k];else e.setAttribute(k,props[k]);}kids.forEach(k=>e.append(k));return e;}
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);if(attrs)for(const k in attrs){const v=attrs[k];if(k==='fill'||k==='stroke')e.style[k]=v;else e.setAttribute(k,v);}if(parent)parent.appendChild(e);return e;}
function txt(parent,x,y,s,o={}){const t=el('text',{x,y,'text-anchor':o.a||'middle','font-size':o.s||13,'font-weight':o.w||500},parent);t.style.fill=o.c||'var(--ink)';if(o.op!=null)t.setAttribute('opacity',o.op);t.textContent=s;return t;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function svgDefs(svg){const d=el('defs',{},svg);d.innerHTML='<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--muted)"/></marker><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>';}
function legend(svg,items,y=448){let x=20;items.forEach(([c,l])=>{el('circle',{cx:x,cy:y-4,r:5,fill:C[c]},svg);const t=txt(svg,x+9,y,l,{a:'start',s:11.5,c:C.mut});x+=22+l.length*6.2;});}

/* animation loop */
let frameFn=null;
function runFrame(fn){frameFn=fn;}
(function(){let last=0;function loop(t){requestAnimationFrame(loop);const now=t/1000;const dt=Math.min(.05,last?now-last:.016);last=now;if(frameFn&&!S.paused){try{frameFn(dt,now);}catch(e){console.error(e);}}}requestAnimationFrame(loop);})();

/* particle helpers */
function flow(layer,path,o){const len=path.getTotalLength()||1;const ps=[];return{o,update(dt){while(ps.length<o.n)ps.push({c:el('circle',{r:o.r||4,opacity:.95},layer),u:Math.random()});while(ps.length>o.n)ps.pop().c.remove();ps.forEach(p=>{p.u=(p.u+dt*o.speed/len)%1;const pt=path.getPointAtLength(p.u*len);p.c.setAttribute('cx',pt.x);p.c.setAttribute('cy',pt.y);p.c.style.fill=o.color;});},clear(){ps.forEach(p=>p.c.remove());ps.length=0;}};}
function cloud(layer,cx,cy,R,o){const ps=[];return{o,update(dt){while(ps.length<o.n){const a=Math.random()*6.283,r=Math.random()*R;ps.push({c:el('circle',{r:o.r||3,opacity:.9},layer),x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r});}while(ps.length>o.n)ps.pop().c.remove();ps.forEach(p=>{p.x+=(Math.random()-.5)*dt*180;p.y+=(Math.random()-.5)*dt*180;const dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy);if(d>R){p.x=cx+dx/d*R*.95;p.y=cy+dy/d*R*.95;}p.c.setAttribute('cx',p.x);p.c.setAttribute('cy',p.y);p.c.style.fill=o.color;});}};}

/* synaptic cleft engine: dopamine particles -> receptors with block / partial states */
function synapse(svg,o){
  const g=el('g',{},svg),N=o.n||6;
  el('path',{d:'M170,18 L630,18 L630,78 Q400,132 170,78 Z',fill:C.acc,stroke:C.line},g);
  el('rect',{x:110,y:338,width:580,height:42,rx:8,fill:'var(--brain2)',stroke:C.line},g);
  txt(g,400,46,o.topLabel||'Presynaptic dopamine terminal',{s:12,c:C.mut});
  txt(g,400,400,o.botLabel||'Postsynaptic membrane \u2014 D2 receptors',{s:12,c:C.mut});
  const rec=[];
  for(let i=0;i<N;i++){
    const x=N===1?400:200+i*(400/(N-1));
    const gl=el('circle',{cx:x,cy:320,r:26,fill:C.blue,opacity:0,filter:'url(#glow)'},g);
    el('path',{d:`M${x-17},296 L${x-17},322 Q${x-17},340 ${x},340 Q${x+17},340 ${x+17},322 L${x+17},296`,fill:'none',stroke:C.mut,'stroke-width':6,'stroke-linecap':'round'},g);
    const cap=el('circle',{cx:x,cy:314,r:11,fill:C.green,stroke:C.ink,opacity:0},g);
    rec.push({x,gl,cap,glow:0,capO:0});
  }
  const da=[],dr=[];let acc=0;
  return{g,rec,update(dt,t){
    acc+=Math.max(0,o.rate())*dt;
    while(acc>=1){acc--;da.push({c:el('circle',{r:5},g),x:230+Math.random()*340,y:92,i:Math.random()*N|0,back:false,life:1,vx:0});}
    for(let k=da.length-1;k>=0;k--){
      const p=da[k],r=rec[p.i];
      if(!p.back){
        const dx=r.x-p.x,dy=308-p.y,d=Math.hypot(dx,dy),sp=125*dt;
        if(d<=sp+1){
          if(o.state(p.i,t)>0){p.back=true;p.vx=(Math.random()-.5)*90;}
          else{r.glow=1;p.c.remove();da.splice(k,1);continue;}
        }else{p.x+=dx/d*sp;p.y+=dy/d*sp;}
      }else{
        p.y-=140*dt;p.x+=p.vx*dt;p.life-=dt*.9;p.c.setAttribute('opacity',Math.max(0,p.life));
        if(p.life<=0||p.y<30){p.c.remove();da.splice(k,1);continue;}
      }
      p.c.setAttribute('cx',p.x);p.c.setAttribute('cy',p.y);p.c.style.fill=o.color();
    }
    rec.forEach((r,i)=>{
      const st=o.state(i,t);
      r.capO+=((st>0?1:0)-r.capO)*Math.min(1,dt*8);
      r.cap.setAttribute('opacity',r.capO);
      r.glow=Math.max(r.glow-dt*2.2,0);
      const base=st===2?(typeof o.ia==='function'?o.ia():(o.ia||.3)):0;
      r.gl.setAttribute('opacity',Math.max(r.glow,base*r.capO)*.9);
      r.gl.style.fill=o.color();
    });
    const nD=o.drugN?o.drugN():0;
    while(dr.length<nD)dr.push({c:el('circle',{r:4,fill:C.green,stroke:C.ink},g),x:150+Math.random()*500,y:140+Math.random()*150});
    while(dr.length>nD)dr.pop().c.remove();
    dr.forEach(p=>{p.x=clamp(p.x+(Math.random()-.5)*dt*170,150,650);p.y=clamp(p.y+(Math.random()-.5)*dt*170,130,290);p.c.setAttribute('cx',p.x);p.c.setAttribute('cy',p.y);});
  }};
}

/* control helpers */
function ctlSlider(ctl,label,min,max,val,fn,fmt){const w=h('label',{class:'ctl'});const s=h('span',{},label),i=h('input',{type:'range',min,max,value:val,step:1}),v=h('b');const up=()=>{v.textContent=fmt?fmt(+i.value):i.value;fn(+i.value);};i.oninput=up;w.append(s,v,i);ctl.append(w);up();return i;}
function ctlBtn(ctl,label,fn,cls){const b=h('button',{class:'btn '+(cls||'')},label);b.onclick=()=>fn(b);ctl.append(b);return b;}
function ctlToggle(ctl,label,fn,init){const w=h('label',{class:'ctl tog'});const i=h('input',{type:'checkbox'});i.checked=!!init;i.onchange=()=>fn(i.checked);w.append(i,document.createTextNode(label));ctl.append(w);fn(i.checked);return i;}
function ctlTabs(ctl,names,fn,init=0){const row=h('div',{class:'tabs'});const bs=names.map((n,i)=>{const b=h('button',{class:'btn'+(i===init?' on':'')},n);b.onclick=()=>{bs.forEach(x=>x.classList.remove('on'));b.classList.add('on');fn(i);};row.append(b);return b;});ctl.append(row);fn(init);return bs;}
function ctlSelect(ctl,label,opts,fn,init=0){const w=h('label',{class:'ctl'});const s=h('span',{},label);const sel=h('select');opts.forEach((o,i)=>sel.append(h('option',{value:i},o)));sel.value=init;sel.onchange=()=>fn(+sel.value);w.append(s,h('span'),sel);ctl.append(w);fn(init);return sel;}
function bars(rows){return rows.map(([l,v,cls,t])=>`<div class="brow"><span>${l}</span><div class="btrack"><i class="${cls||''}" style="width:${clamp(v,0,100)}%"></i></div><b>${t!=null?t:Math.round(v)+'%'}</b></div>`).join('');}

/* quiz engine */
function renderQuiz(box,qs,opt={}){
  box.innerHTML='';const total=qs.length;let answered=0,score=0;const res=[];
  box.append(h('div',{class:'qhead'},h('h3',{},opt.title||'Check your understanding'),h('span',{class:'qscore'},`0 / ${total}`)));
  qs.forEach((q,qi)=>{
    const order=q.o.map((_,i)=>i);if(opt.shuffle)shuffle(order);
    const card=h('div',{class:'qcard'});
    card.append(h('div',{class:'qtext',html:`<b>${qi+1}.</b> ${q.mod?`<span class="chip">M${q.mod}</span> `:''}${q.q}`}));
    const fac=S.mode==='faculty';
    const fb=h('div',{class:'qfb'+(fac?' fac':''),html:fac?`<b>Rationale (faculty view):</b> ${q.e}`:''});
    const btns=order.map((oi,k)=>{
      const b=h('button',{class:'opt'+(fac&&oi===q.a?' key':'')},`${'ABCDE'[k]}. ${q.o[oi]}`);
      b.onclick=()=>{
        if(card.dataset.done)return;card.dataset.done=1;answered++;
        const ok=oi===q.a;if(ok)score++;res.push({mod:q.mod,ok});
        b.classList.add(ok?'right':'wrong');
        if(!ok)btns[order.indexOf(q.a)].classList.add('right');
        fb.className='qfb show '+(ok?'ok':'no');
        fb.innerHTML=`<b>${ok?'Correct.':'Not quite.'}</b> ${q.e}`;
        $('.qscore',box).textContent=`${score} / ${total}`;
        if(answered===total)finish();
      };
      card.append(b);return b;
    });
    card.append(fb);box.append(card);
  });
  function finish(){
    const pct=Math.round(score/total*100);
    const d=h('div',{class:'qdone panel',html:`<h4>Score: ${score} / ${total} (${pct}%)</h4><p>${pct>=80?'Excellent mastery.':pct>=60?'Good progress \u2014 review the explanations for missed items.':'Revisit the simulation above, then try again.'}</p>`});
    const b=h('button',{class:'btn pri'},'Retry (shuffled)');b.onclick=()=>renderQuiz(box,qs,{...opt,shuffle:true});
    d.append(b);box.append(d);
    if(opt.onDone)opt.onDone(score,total,res,d);
  }
}

/* module page */
function openModule(i){
  const m=MODS[i];S.visited[m.id]=1;save();
  const pg=h('section',{class:'page'});main.append(pg);
  pg.append(h('div',{class:'mnum'},`Module ${m.n} of ${MODS.length}`),h('h2',{},`${m.icon} ${m.title}`),h('p',{class:'sub',html:m.sub}),h('div',{class:'objs',html:'Learning objectives addressed: '+m.obj.map(o=>`<span class="chip" title="${OBJ[o-1]}">#${o} ${OBJ[o-1]}</span>`).join('')}));
  const extra=h('div',{class:'extra'});
  const ctx={extra,frame:runFrame};
  if(m.noStage){
    const info=h('div',{class:'panel info',style:'margin-top:12px'});pg.append(info);ctx.info=info;ctx.ctl=h('div');ctx.svg=null;
  }else{
    const svg=el('svg',{viewBox:'0 0 800 460',role:'img','aria-label':m.title});svgDefs(svg);
    const ctl=h('div',{class:'ctls panel'}),info=h('div',{class:'panel info'});
    pg.append(h('div',{class:'grid'},h('div',{class:'stage'},svg),h('div',{class:'side'},ctl,info)));
    Object.assign(ctx,{svg,ctl,info});
  }
  ctx.setInfo=s=>{ctx.info.innerHTML=s;};
  pg.append(extra);
  m.build(ctx);
  if(m.take)pg.append(h('div',{class:'panel take',html:`<h4>Key takeaways</h4>${m.take}`}));
  if(S.mode==='faculty'&&m.faculty)pg.append(h('div',{class:'panel fac',html:`<h4>Faculty notes</h4>${m.faculty}`}));
  const qbox=h('div',{class:'quiz panel'});pg.append(qbox);
  renderQuiz(qbox,m.quiz,{title:`Module ${m.n} quiz`,onDone:(sc)=>{S.best[m.id]=Math.max(S.best[m.id]||0,sc);S.done[m.id]=1;save();chrome();}});
  const nav=h('div',{class:'mnav'});
  const pv=h('button',{class:'btn'},i>0?`\u2190 ${MODS[i-1].title}`:'\u2190 Home');pv.onclick=()=>i>0?go('mod',i-1):go('home');
  const nx=h('button',{class:'btn pri'},i<MODS.length-1?`${MODS[i+1].title} \u2192`:'Final quiz \u2192');nx.onclick=()=>i<MODS.length-1?go('mod',i+1):go('final');
  nav.append(pv,nx);pg.append(nav);
  pg.append(h('div',{class:'disc',html:'Educational simulation. Receptor-occupancy figures, risk scores, and animations are simplified teaching models, not dosing guidance. Always verify against current prescribing information and local protocols.'}));
}

MODS.push({id:'m10',n:10,icon:'\uD83C\uDF9B\uFE0F',title:'Partial Agonists',obj:[6,7],
sub:'Dopamine stabilizers: a partial agonist dampens signaling when dopamine is high and supports it when dopamine is low. Move the dopamine-tone slider and compare drugs.',
take:'<ul><li>A D2 <b>partial agonist</b> competes with dopamine and activates the receptor at a fixed fraction of full activity \u2192 it acts as a <b>functional antagonist</b> where dopamine is high (mesolimbic) and a <b>functional agonist</b> where it is very low.</li><li>Aripiprazole, brexpiprazole, cariprazine: low prolactin and metabolic burden; <b>akathisia</b> is the characteristic adverse effect.</li><li>Cariprazine is D3-preferring and has long-lived active metabolites (weeks).</li></ul>',

  main.append(top);
  const t=h('div',{class:'panel tscroll',style:'margin-top:12px'});
  t.innerHTML='<table class="t"><tr><th>Module</th><th>Status</th><th>Best quiz score</th><th></th></tr>'+MODS.map((m,i)=>`<tr><td>${m.icon} ${m.n}. ${m.title}</td><td>${S.done[m.id]?'<span class="tag g">Complete</span>':S.visited[m.id]?'<span class="tag y">In progress</span>':'<span class="tag">Not started</span>'}</td><td>${S.done[m.id]?`${S.best[m.id]||0} / ${m.quiz.length}`:'\u2014'}</td><td><button class="btn" data-m="${i}">Open</button></td></tr>`).join('')+'</table>';
  main.append(t);$$('[data-m]',t).forEach(b=>b.onclick=()=>go('mod',+b.dataset.m));
  const oc=h('div',{class:'panel',style:'margin-top:12px'});
  oc.innerHTML='<h4 style="margin:0 0 6px">Learning-objective coverage</h4>'+OBJ.map((o,i)=>{const ms=MODS.filter(m=>m.obj.includes(i+1));const d=ms.filter(m=>S.done[m.id]).length;return `<div class="brow" style="grid-template-columns:1fr 120px 48px"><span>${i+1}. ${o}</span><div class="btrack"><i class="g" style="width:${d/ms.length*100}%"></i></div><b>${d}/${ms.length}</b></div>`;}).join('');
  main.append(oc);
  const at=h('div',{class:'panel',style:'margin-top:12px'});
  at.innerHTML='<h4 style="margin:0 0 6px">Final-exam attempts</h4>'+(S.attempts.length?'<table class="t"><tr><th>Date</th><th>Score</th><th>%</th></tr>'+S.attempts.slice().reverse().map(a=>`<tr><td>${new Date(a.d).toLocaleString()}</td><td>${a.sc} / ${a.tot}</td><td>${a.pct}%</td></tr>`).join('')+'</table>':'<p class="muted">No attempts yet.</p>');
  main.append(at);
}
function pageFinal(){
  main.append(h('h2',{},'\uD83D\uDCDD Quiz Mode \u2014 Final Exam'),h('p',{class:'sub'},'Questions are drawn from every module and the clinical cases and are shuffled each attempt. Score 70% or higher (with all modules complete) to unlock your certificate.'));
  const pool=[];MODS.forEach(m=>m.quiz.forEach(q=>pool.push({...q,mod:m.n})));
  const bar=h('div',{class:'panel'});bar.append(h('b',{},'Choose length: '));
  const qbox=h('div',{class:'quiz panel',style:'display:none'});
  [10,20,pool.length].forEach((n,i)=>{const b=h('button',{class:'btn',style:'margin-left:6px'},i===2?`All ${n} questions`:`${n} questions`);b.onclick=()=>run(n);bar.append(b);});
  main.append(bar,qbox);
  function run(n){
    qbox.style.display='';
    const qs=shuffle(pool.slice()).slice(0,n);
    renderQuiz(qbox,qs,{shuffle:true,title:`Final exam \u2014 ${n} questions`,onDone:(sc,tot,res,d)=>{
      const pct=Math.round(sc/tot*100);S.attempts.push({d:Date.now(),sc,tot,pct});S.attempts=S.attempts.slice(-30);save();
      const miss=[...new Set(res.filter(r=>!r.ok).map(r=>r.mod))].sort((a,b)=>a-b);
      d.append(h('p',{html:miss.length?`<b>Review:</b> ${miss.map(x=>`Module ${x}`).join(', ')}`:'<b>No modules to review.</b>'}));
      chrome();
    }});
    qbox.scrollIntoView({behavior:'smooth'});
  }
  if(S.attempts.length){const a=S.attempts[S.attempts.length-1];main.append(h('p',{class:'muted',html:`Last attempt: <b>${a.sc}/${a.tot} (${a.pct}%)</b> \u00B7 Best: <b>${bestPct()}%</b>`}));}
}
function pageCert(){
  const all=MODS.every(m=>S.done[m.id]),best=bestPct(),ok=all&&best>=70;
  main.append(h('h2',{},'\uD83C\uDF93 Completion Certificate'));
  if(!ok){
    const p=h('div',{class:'panel'});
    p.innerHTML=`<p>Complete the requirements below to unlock your certificate.</p><ul><li>${all?'\u2713':'\u2717'} All ${MODS.length} module quizzes completed (${MODS.filter(m=>S.done[m.id]).length}/${MODS.length})</li><li>${best>=70?'\u2713':'\u2717'} Final exam score \u2265 70% (best so far: ${S.attempts.length?best+'%':'\u2014'})</li></ul>`;
    const b=h('button',{class:'btn pri'},'Go to final exam');b.onclick=()=>go('final');p.append(b);main.append(p);return;
  }
  const row=h('div',{class:'panel'});
  const inp=h('input',{class:'txt',placeholder:'Enter your name for the certificate',value:S.name||'',style:'min-width:260px'});
  const pr=h('button',{class:'btn pri',style:'margin-left:8px'},'\uD83D\uDDA8 Print / Save as PDF');pr.onclick=()=>window.print();
  row.append(inp,pr);main.append(row);
  const cert=h('div',{class:'cert'});main.append(cert);
  function draw(){cert.innerHTML=`<div style="letter-spacing:.2em;font-size:13px">CERTIFICATE OF COMPLETION</div><h1>Schizophrenia Pathophysiology &amp; Pharmacology Simulator</h1><div style="font-size:15px;font-weight:600;margin:-4px 0 10px">Hafeez Faridi Ph.D.</div><p>This certifies that</p><div class="nm">${(S.name||'Learner').replace(/</g,'&lt;')}</div><p>has completed all ${MODS.length} interactive modules and passed the final assessment<br>with a best score of <b>${best}%</b>.</p><p style="margin-top:22px">${new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}</p><p style="font-size:11px;opacity:.7;margin-top:18px">Educational certificate of participation \u2014 not a professional credential.</p>`;}
  inp.oninput=()=>{S.name=inp.value;save();draw();};draw();
}

/* ================= BOOT ================= */
applyTheme();hh();go('home');
</script>
