<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Advanced Anxiety and Insomnia Pathophysiology &amp; Pharmacology Simulator</title>

<style>
/* Layout concept: left module rail + one working canvas per module; instrument-panel density, cool clinical neutrals,
   one teal accent, and a transmitter colour code (GABA blue, glutamate amber, 5-HT magenta, NE red, DA green, histamine ochre, orexin cyan, ACh violet, melatonin indigo) used everywhere. */
:root{
  --bg:#EBF1F2; --surface:#FFFFFF; --surface2:#E0E9EB; --ink:#10252C; --muted:#4B636B; --line:#C5D3D7;
  --accent:#0A7480; --accent-ink:#FFFFFF; --accent-soft:#D5ECEF;
  --good:#23824F; --good-soft:#D7EEE0; --warn:#A8670F; --warn-soft:#F6E8CF; --bad:#BC3647; --bad-soft:#F6DADF; --sleep:#5B47B0;
  --canvas:#F6FAFB;
  --gaba:#2C7BD6; --glu:#D77A18; --ser:#B03A90; --ne:#CC3B35; --da:#2A9A5E; --his:#A98E0E; --ore:#0B93A5; --ach:#6D50C9; --mel:#4252B8;
  --stage-w:#BC3647; --stage-rem:#D77A18; --stage-n1:#7F99A2; --stage-n2:#2C7BD6; --stage-n3:#4252B8;
  --font-ui:"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1317; --surface:#111F26; --surface2:#1A2F39; --ink:#E4EFF2; --muted:#93AAB3; --line:#26414D;
    --accent:#3BBDCA; --accent-ink:#06191D; --accent-soft:#12363D;
    --good:#4CC08A; --good-soft:#143826; --warn:#E3A44A; --warn-soft:#3A2B10; --bad:#EF6B7C; --bad-soft:#41191F; --sleep:#9A87EA;
    --canvas:#0D191F;
    --gaba:#58A0F2; --glu:#F0A04A; --ser:#E070C2; --ne:#F0665F; --da:#4CC88A; --his:#D5B93A; --ore:#35C4D6; --ach:#9C84F0; --mel:#7C8CF0;
    --stage-w:#EF6B7C; --stage-rem:#F0A04A; --stage-n1:#8DA6AF; --stage-n2:#58A0F2; --stage-n3:#7C8CF0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1317; --surface:#111F26; --surface2:#1A2F39; --ink:#E4EFF2; --muted:#93AAB3; --line:#26414D;
  --accent:#3BBDCA; --accent-ink:#06191D; --accent-soft:#12363D;
  --good:#4CC08A; --good-soft:#143826; --warn:#E3A44A; --warn-soft:#3A2B10; --bad:#EF6B7C; --bad-soft:#41191F; --sleep:#9A87EA;
  --canvas:#0D191F;
  --gaba:#58A0F2; --glu:#F0A04A; --ser:#E070C2; --ne:#F0665F; --da:#4CC88A; --his:#D5B93A; --ore:#35C4D6; --ach:#9C84F0; --mel:#7C8CF0;
  --stage-w:#EF6B7C; --stage-rem:#F0A04A; --stage-n1:#8DA6AF; --stage-n2:#58A0F2; --stage-n3:#7C8CF0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;-webkit-text-size-adjust:100%}
.app{max-width:1360px;margin:0 auto}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* header */
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;padding:18px 0 14px}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.brand svg{flex:none;width:64px;height:36px;color:var(--accent)}
.brand h1{font-size:19px;line-height:1.2;font-weight:700;text-wrap:balance}
.brand p{color:var(--muted);font-size:12.5px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tg{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:12.5px;user-select:none}
.tg input{accent-color:var(--accent);margin:0}
.score{font:600 12.5px var(--font-mono);padding:5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:20px;align-items:start}
.nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:12px}
.nav button{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink)}
.nav button .n{font:600 12px var(--font-mono);color:var(--muted)}
.nav button small{display:block;color:var(--muted);font-size:11.5px;line-height:1.25}
.nav button:hover{background:var(--surface2)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav button[aria-current="page"] .n,.nav button[aria-current="page"] small{color:inherit;opacity:.85}
.nav .ck{font-size:12px;color:var(--good)}
.nav button[aria-current="page"] .ck{color:inherit}
main{min-width:0}

/* panels */
.mhead{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.mhead h2{font-size:26px;line-height:1.15;text-wrap:balance}
.lead{color:var(--muted);max-width:76ch}
.cols{display:grid;gap:16px;margin-bottom:16px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.c12{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
.c21{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel>h3,.sub{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px}
.panel>h3 em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.sp{height:10px}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.small{font-size:12.5px}

/* controls */
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-right:1px solid var(--line);background:transparent;padding:7px 12px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=range]{width:100%;accent-color:var(--accent)}
.lab{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.lab b{color:var(--ink);font-weight:600}
.ticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
select,input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.chk{display:flex;align-items:center;gap:6px;font-size:13px}
.chk input{accent-color:var(--accent)}

/* canvases */
.cv{display:block;width:100%;background:var(--canvas);border:1px solid var(--line);border-radius:8px}
svg.diag{display:block;width:100%;height:auto;background:var(--canvas);border:1px solid var(--line);border-radius:8px}
svg text{font-family:var(--font-ui)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* readouts */
.meter{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .3s}
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.vital{display:flex;flex-direction:column;gap:4px;padding:10px;border:1px solid var(--line);border-radius:8px}
.vital span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.vital b{font:600 24px/1.1 var(--font-mono);font-variant-numeric:tabular-nums}
.vital small{color:var(--muted)}
.ev{display:grid;grid-template-columns:minmax(130px,1.2fr) 2fr 38px;gap:10px;align-items:center;font-size:13px;padding:3px 0}
.ev .meter i{background:var(--warn)}
.ev.hot .meter i{background:var(--bad);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.kv{display:grid;grid-template-columns:minmax(96px,.35fr) 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 11px 5px 9px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.chip:hover{background:var(--surface2)}
.chip[aria-pressed="true"]{border-color:var(--c,var(--accent));box-shadow:inset 0 0 0 1px var(--c,var(--accent));background:var(--surface2)}
.chip .tone{width:26px;height:4px;border-radius:2px;background:var(--surface2);overflow:hidden;display:inline-block}
.chip .tone b{display:block;height:100%;background:var(--c,var(--accent));width:0;transition:width .5s}
.pearl{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:13px}
.pearl b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.cap{font-size:13px;color:var(--ink);min-height:2.7em}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;background:var(--surface2);color:var(--muted);font-weight:600}
.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.good{background:var(--good-soft);color:var(--good)}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tbl td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}

/* brain svg */
.node{cursor:pointer}
.node .halo{transition:r .4s,opacity .4s}
.node .core{stroke:var(--surface);stroke-width:2}
.node:focus-visible .core,.node.sel .core{stroke:var(--ink);stroke-width:3}
.nlabel{font-size:14.5px;fill:var(--ink);font-weight:600;paint-order:stroke;stroke:var(--canvas);stroke-width:3px}
.path{fill:none;stroke-width:2;stroke-dasharray:5 7;opacity:.75;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.hide-labels .nlabel,.hide-labels .lbl{display:none}
.hide-pathways .path{display:none}
.hide-pearls .pearl{display:none}
.hide-detail .detail{display:none}
.reduce *{animation:none!important;transition:none!important}

/* alerts / log */
.alert{padding:8px 10px;border-radius:8px;font-size:13px;margin:6px 0}
.alert.danger{background:var(--bad-soft);color:var(--ink);border:1px solid var(--bad)}
.alert.warn{background:var(--warn-soft);border:1px solid var(--warn)}
.alert.info{background:var(--surface2);border:1px solid var(--line)}
.alert b{margin-right:6px}
.log{max-height:300px;overflow:auto;font-size:13px;display:flex;flex-direction:column;gap:6px}
.log div{padding:6px 8px;border-radius:6px;background:var(--surface2)}
.log div.ev-bad{background:var(--bad-soft)}.log div.ev-good{background:var(--good-soft)}
.pt{display:flex;gap:12px;align-items:center}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font:700 18px var(--font-mono);color:var(--accent);flex:none}

/* quiz */
.quiz .q{padding:10px 0;border-top:1px solid var(--line)}
.quiz .q:first-of-type{border-top:0}
.opt{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer}
.opt input{margin-top:3px;accent-color:var(--accent)}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin-top:6px;font-size:13px}
textarea{width:100%;min-height:150px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px var(--font-mono)}

@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .nav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:6px}
  .nav button{flex:none;grid-template-columns:auto;padding:7px 12px;border:1px solid var(--line);background:var(--surface)}
  .nav button small,.nav .ck{display:none}
  .c2,.c12,.c21,.c3{grid-template-columns:minmax(0,1fr)}
  .ev{grid-template-columns:1fr 1fr 34px}
}
@media (max-width:560px){
  .mhead h2{font-size:22px}
  .kv{grid-template-columns:1fr}
  .brand svg{display:none}
}
.syncv{aspect-ratio:2.1/1}
.mrow{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center;margin-top:4px}
.mrow small{color:var(--muted)}
.ring{width:34px;height:34px;border-radius:50%;border:4px solid var(--bad);flex:none;animation:ringp 1.2s ease-in-out infinite}
@keyframes ringp{50%{transform:scale(1.22);opacity:.45}}
.tbl td,.tbl th{min-width:0}
#m8-tb td{min-width:150px}
.brand .by{font-size:14px;font-weight:600;color:var(--accent);margin-top:2px}
.themeseg button{padding:5px 12px;font-size:12.5px}

.skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:0 0 8px 8px;z-index:50;text-decoration:none;font-weight:600}
.skip:focus{left:max(16px,env(safe-area-inset-left,0px))}
html[data-font="readable"]{--font-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
html[data-font="dys"]{--font-ui:"Lexend",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
html[data-space="wide"] body{line-height:1.85;letter-spacing:.03em;word-spacing:.1em}
html[data-space="wide"] p,html[data-space="wide"] dd,html[data-space="wide"] li{margin-bottom:.4em}
html[data-focus="strong"] :focus-visible{outline:4px solid var(--ink)!important;outline-offset:3px!important;box-shadow:0 0 0 8px var(--accent)}
html[data-contrast="high"] .panel,html[data-contrast="high"] .btn,html[data-contrast="high"] .seg,html[data-contrast="high"] .chip,html[data-contrast="high"] .tg,html[data-contrast="high"] .opt,html[data-contrast="high"] select,html[data-contrast="high"] input[type=number]{border-color:var(--ink)}
html[data-contrast="high"] .muted,html[data-contrast="high"] .lead{color:var(--ink)}
:root[data-contrast="high"]:not([data-theme="dark"]){--bg:#FFFFFF;--surface:#FFFFFF;--surface2:#E3E8EA;--ink:#000000;--muted:#1A2A30;--line:#44575E;--accent:#00505B;--accent-ink:#FFFFFF;--accent-soft:#CFEAEE;--canvas:#FFFFFF;--good:#0B5B2F;--warn:#7A4300;--bad:#9B1022;--sleep:#3F2C93}
@media (prefers-color-scheme: dark){:root[data-contrast="high"]:not([data-theme="light"]){--bg:#000000;--surface:#000000;--surface2:#1B2A30;--ink:#FFFFFF;--muted:#E1EAED;--line:#8EA6AE;--accent:#62E3F0;--accent-ink:#000000;--accent-soft:#0B3A41;--canvas:#000000;--good:#6FE3A6;--warn:#FFC266;--bad:#FF8A98;--sleep:#C2B4FF;color-scheme:dark}}
:root[data-contrast="high"][data-theme="dark"]{--bg:#000000;--surface:#000000;--surface2:#1B2A30;--ink:#FFFFFF;--muted:#E1EAED;--line:#8EA6AE;--accent:#62E3F0;--accent-ink:#000000;--accent-soft:#0B3A41;--canvas:#000000;--good:#6FE3A6;--warn:#FFC266;--bad:#FF8A98;--sleep:#C2B4FF;color-scheme:dark}
:root[data-cb="on"]:not([data-theme="dark"]){--gaba:#0072B2;--glu:#E69F00;--ser:#CC79A7;--ne:#D55E00;--da:#009E73;--his:#8A7B00;--ore:#56B4E9;--ach:#7B5AC8;--mel:#332288}
@media (prefers-color-scheme: dark){:root[data-cb="on"]:not([data-theme="light"]){--gaba:#56A8E8;--glu:#F5B83A;--ser:#E3A0C8;--ne:#F07F3A;--da:#2FC49A;--his:#E6D84A;--ore:#7CCBF0;--ach:#B39AF0;--mel:#8E85E8;color-scheme:dark}}
:root[data-cb="on"][data-theme="dark"]{--gaba:#56A8E8;--glu:#F5B83A;--ser:#E3A0C8;--ne:#F07F3A;--da:#2FC49A;--his:#E6D84A;--ore:#7CCBF0;--ach:#B39AF0;--mel:#8E85E8;color-scheme:dark}

<script>
(function(){
'use strict';
/* ============ helpers ============ */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(v,d)=>Number(v).toFixed(d==null?0:d);
function rng(seed){let s=(seed>>>0)||1;return function(){s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function gauss(r){let u=0,v=0;while(u===0)u=r();while(v===0)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function smooth(a,b,x){const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);}
function hill(x,ec,n){x=Math.max(x,0);return Math.pow(x,n)/(Math.pow(x,n)+Math.pow(ec,n));}

const CVS=[];
function mkCanvas(cv){
  const o={cv:cv,ctx:cv.getContext('2d'),w:0,h:0,dpr:1};
  function fit(){const r=cv.getBoundingClientRect();let zf=cv.offsetWidth>0?r.width/cv.offsetWidth:1;if(Math.abs(zf-1)<.01||!isFinite(zf)||zf<=0)zf=1;const d=Math.min(2,window.devicePixelRatio||1);o.w=r.width/zf;o.h=r.height/zf;cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));o.dpr=d;o.ctx.setTransform(d*zf,0,0,d*zf,0,0);App.force=true;}
  if(window.ResizeObserver){new ResizeObserver(fit).observe(cv);}
  window.addEventListener('resize',fit);fit();o.fit=fit;CVS.push(o);if(CVS.length>60)CVS.splice(0,CVS.length-40);
  o.ok=()=>o.w>20&&o.h>20;
  return o;
}
function refitAll(){CVS.forEach(o=>{if(o.cv.isConnected)o.fit();});}
function clearCv(o){o.ctx.clearRect(0,0,o.w,o.h);}
function txt(ctx,s,x,y,col,size,align,weight){ctx.fillStyle=col;ctx.font=(weight||'500')+' '+(size||11)+'px '+getComputedStyle(document.body).fontFamily;ctx.textAlign=align||'left';ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ============ LMS (SCORM-ready adapter) ============ */
const LMS=(function(){
  let api=null,ver=null,n=0;
  function find(w){let k=0;try{while(w&&k<10){if(w.API_1484_11)return [w.API_1484_11,'2004'];if(w.API)return [w.API,'1.2'];if(w===w.parent)break;w=w.parent;k++;}}catch(e){}return [null,null];}
  const o={connected:false,mode:'standalone',
    init(){const r=find(window);api=r[0];ver=r[1];if(api){try{const ok=ver==='2004'?api.Initialize(''):api.LMSInitialize('');o.connected=(ok===true||ok==='true');}catch(e){}}o.mode=o.connected?('SCORM '+ver):'standalone (progress saved in this browser)';},
    set(k,v){if(!o.connected)return;try{ver==='2004'?api.SetValue(k,String(v)):api.LMSSetValue(k,String(v));}catch(e){}},
    commit(){if(!o.connected)return;try{ver==='2004'?api.Commit(''):api.LMSCommit('');}catch(e){}},
    report(pct,score,done){
      if(ver==='2004'){o.set('cmi.progress_measure',(pct/100).toFixed(2));o.set('cmi.score.min',0);o.set('cmi.score.max',100);o.set('cmi.score.raw',Math.round(score));o.set('cmi.score.scaled',(score/100).toFixed(2));o.set('cmi.completion_status',done?'completed':'incomplete');}
      else if(ver==='1.2'){o.set('cmi.core.score.raw',Math.round(score));o.set('cmi.core.lesson_status',done?'completed':'incomplete');}
      o.commit();},
    interaction(id,resp,ok){if(!o.connected||ver!=='2004')return;const p='cmi.interactions.'+n+'.';o.set(p+'id',id);o.set(p+'type','choice');o.set(p+'learner_response',resp);o.set(p+'result',ok?'correct':'incorrect');n++;o.commit();},
    end(){if(!o.connected)return;try{ver==='2004'?api.Terminate(''):api.LMSFinish('');}catch(e){}o.connected=false;}
  };
  return o;
})();

/* ============ shared synapse engine ============ */
const SYN_ION={gaba:{lab:'Cl⁻',colv:'gaba',dir:-1},glu:{lab:'Na⁺/Ca²⁺',colv:'glu',dir:1},ach:{lab:'Na⁺',colv:'ach',dir:1}};
const G_TXT={gs:'Gs → adenylyl cyclase → cAMP ↑ → PKA',gi:'Gi/o → cAMP ↓ and GIRK K⁺ channel opening',gq:'Gq → PLC → IP₃ and DAG → Ca²⁺ ↑ → PKC'};
class Synapse{
  constructor(cv,o){
    this.c=mkCanvas(cv);
    this.o=Object.assign({colv:'ser',name:'Transmitter',rtype:'gpcr',g:'gi',clear:'transporter',tr:'SERT',ionKey:null,auto:false,rate:1,block:0,cap:null,sel:'',title:true},o||{});
    this.trN=5;this.recN=4;this.vesN=4;this.reset();
  }
  reset(){
    this.parts=[];this.msg=[];this.mode='idle';this.t=0;this.relQ=0;this.sig=false;this.sigT=0;this.seq=null;
    this.ves=[0,1,2,3].map(i=>({fx:[.2,.4,.6,.8][i],f:0,d:0}));
    this.rec=[0,1,2,3].map(i=>({fx:[.2,.4,.6,.8][i],b:null,open:0}));
    this.absorbed=0;this.boundSm=0;this.freeSm=0;this.setCap('Press Play sequence, or use the four phase buttons.');
  }
  setCap(s){if(this.o.cap)this.o.cap.textContent=s;}
  opts(o){Object.assign(this.o,o);}
  geo(){const w=this.c.w,h=this.c.h;const u=Math.min(w/9,h/8);return {w:w,h:h,u:u,preB:h*.34,postT:h*.6,pr:Math.max(2.6,u*.17)};}
  X(fx){return this.c.w*(.07+.86*fx);}
  fuse(i){const g=this.geo();if(this.parts.length>80)return;const v=this.ves[i==null?Math.floor(Math.random()*this.ves.length):i];if(v.f>0)return;v.f=1;const n=3;for(let k=0;k<n;k++)this.parts.push({x:this.X(v.fx)+(Math.random()-.5)*8,y:g.preB+3,vx:(Math.random()-.5)*50,vy:20+Math.random()*30,st:'free',seek:Math.random()<.6?'rec':'tr',life:1,r:null,bt:0,cool:0});}
  release(){this.mode='idle';this.setCap('Release: Ca²⁺ entry triggers vesicle fusion; '+this.o.name+' enters the cleft.');this.ves.forEach((v,i)=>setTimeout(()=>this.fuse(i),i*130));}
  setMode(m){this.mode=m;if(m==='binding')this.setCap('Binding: '+this.o.name+' diffuses across the cleft and binds '+(this.o.rtype==='ion'?'a ligand-gated channel (fast, milliseconds).':'a G-protein-coupled receptor (slower, modulatory).'));if(m==='reuptake')this.setCap(this.o.clear==='transporter'?'Reuptake: '+this.o.tr+' carries '+this.o.name+' back into the terminal. Blocked transporters (red) cannot.':'Clearance: '+this.o.tr+' removes '+this.o.name+' from the cleft; there is no classic reuptake pump.');}
  signal(){if(!this.rec.some(r=>r.b)){this.setMode('binding');setTimeout(()=>this.signal(),1600);return;}this.sig=true;this.sigT=5;this.setCap(this.o.rtype==='ion'?'Signal: channel opens and '+(SYN_ION[this.o.ionKey]?SYN_ION[this.o.ionKey].lab:'ions')+' flow, changing membrane potential within milliseconds.':'Signal: '+G_TXT[this.o.g]+'.');}
  play(){this.reset();this.seq={t:0,i:0,steps:[[.1,()=>this.release()],[1.5,()=>this.setMode('binding')],[3.4,()=>this.signal()],[8,()=>this.setMode('reuptake')],[12,()=>{this.setMode('idle');this.setCap('Sequence complete. Replay or step through the phases.');this.seq=null;}]]};}
  hit(){return null;}
  tick(dt){
    const c=this.c;if(!c.ok())return;const g=this.geo(),o=this.o;this.t+=dt;
    const trs=[];for(let i=0;i<this.trN;i++)trs.push({x:this.X(i/(this.trN-1)*.8+.1),blocked:i<Math.round(o.block*this.trN)});
    if(this.seq){const s=this.seq;s.t+=dt;while(s.i<s.steps.length&&s.t>=s.steps[s.i][0]){const f=s.steps[s.i][1];s.i++;f();}}
    if(o.auto){this.relQ+=dt*o.rate*1.5;while(this.relQ>=1){this.relQ-=1;this.fuse();}}
    this.ves.forEach(v=>{if(v.f>0)v.f=Math.max(0,v.f-dt*1.6);});
    const auto=o.auto,mode=this.mode;
    if(this.sigT>0){this.sigT-=dt;if(this.sigT<=0&&!o.auto)this.sig=false;}
    const free=[];let nb=0;
    for(const p of this.parts){
      p.cool=Math.max(0,p.cool-dt);
      if(p.st==='free'){
        p.vx+=(Math.random()-.5)*520*dt;p.vy+=(Math.random()-.5)*520*dt;p.vx*=(1-2.2*dt);p.vy*=(1-2.2*dt);
        let seek=null;if(auto)seek=p.seek;else if(mode==='binding')seek='rec';else if(mode==='reuptake')seek='tr';
        if(seek==='rec'){let best=null,bd=1e9;this.rec.forEach(r=>{if(!r.b){const d=Math.hypot(this.X(r.fx)-p.x,g.postT-4-p.y);if(d<bd){bd=d;best=r;}}});
          if(best){const tx=this.X(best.fx),ty=g.postT-4;const d=Math.max(1,Math.hypot(tx-p.x,ty-p.y));p.vx+=(tx-p.x)/d*240*dt;p.vy+=(ty-p.y)/d*240*dt;if(d<g.pr+7){best.b=p;p.st='bound';p.r=best;p.bt=0;p.x=tx;p.y=ty;}}else if(auto)p.seek='tr';}
        else if(seek==='tr'){if(o.clear==='transporter'){let best=null,bd=1e9;trs.forEach(t=>{const d=Math.hypot(t.x-p.x,g.preB+2-p.y);if(d<bd){bd=d;best=t;}});
          if(best){const d=Math.max(1,bd);p.vx+=(best.x-p.x)/d*240*dt;p.vy+=(g.preB+2-p.y)/d*240*dt;if(d<g.pr+8&&p.cool<=0){if(best.blocked){p.vy=70;p.vx=(Math.random()-.5)*120;p.cool=.7;}else{p.st='in';}}}}
          else{p.life-=dt*(o.clear==='enzyme'?.5:.25);if(p.life<=0)p.st='gone';}}
        p.x+=p.vx*dt;p.y+=p.vy*dt;
        const x0=this.X(0)-6,x1=this.X(1)+6,y0=g.preB+g.pr,y1=g.postT-g.pr-1;
        if(p.x<x0){p.x=x0;p.vx=Math.abs(p.vx);}if(p.x>x1){p.x=x1;p.vx=-Math.abs(p.vx);}if(p.y<y0){p.y=y0;p.vy=Math.abs(p.vy);}if(p.y>y1){p.y=y1;p.vy=-Math.abs(p.vy);}
        free.push(p);
      }else if(p.st==='bound'){
        p.bt+=dt;nb++;const rel=(mode==='reuptake')?.9:(auto?.7:.12);
        if(p.bt>.9&&Math.random()<rel*dt){if(p.r){p.r.b=null;}p.r=null;p.st='free';p.seek='tr';p.vy=-40;p.cool=.4;}
      }else if(p.st==='in'){p.y-=60*dt;p.life-=dt*2.2;if(p.life<=0){p.st='gone';this.absorbed++;}}
    }
    this.parts=this.parts.filter(p=>p.st!=='gone');
    this.freeSm=lerp(this.freeSm,free.length,Math.min(1,dt*2));this.boundSm=lerp(this.boundSm,nb,Math.min(1,dt*3));
    // receptor opening and messengers
    const sigOn=o.auto?true:this.sig;let openSum=0;
    this.rec.forEach(r=>{const tgt=r.b?(sigOn?1:.35):0;r.open=lerp(r.open,tgt,Math.min(1,dt*5));openSum+=r.open;
      if(r.open>.6&&sigOn&&Math.random()<dt*(o.rtype==='ion'?16:8)&&this.msg.length<90){const x=this.X(r.fx);
        if(o.rtype==='ion')this.msg.push({x:x+(Math.random()-.5)*4,y:g.postT+4,vx:(Math.random()-.5)*10,vy:50+Math.random()*30,life:1.4});
        else this.msg.push({x:x+10,y:g.postT+g.u*.9,vx:(Math.random()-.5)*60,vy:(Math.random()-.2)*45,life:1.8});}});
    this.msg.forEach(m=>{m.x+=m.vx*dt;m.y+=m.vy*dt;m.life-=dt;if(o.rtype!=='ion'){m.vx+=(Math.random()-.5)*160*dt;m.vy+=(Math.random()-.5)*160*dt;}});
    this.msg=this.msg.filter(m=>m.life>0&&m.y<g.h);
    this.openAvg=openSum/this.rec.length;
    this.draw(g,trs,sigOn);
  }
  draw(g,trs,sigOn){
    const c=this.c,ctx=c.ctx,col=App.col,o=this.o,nc=col[o.colv]||col.accent,w=g.w,h=g.h,u=g.u;
    clearCv(c);
    // membranes
    const tx0=this.X(0)-14,tw=this.X(1)+28-tx0;
    ctx.fillStyle=rgba(nc,.07);rrect(ctx,tx0,-12,tw,g.preB+12,16);ctx.fill();ctx.strokeStyle=col.line;ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle=rgba(col.accent,.06);ctx.fillRect(0,g.postT,w,h-g.postT);ctx.strokeStyle=col.muted;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,g.postT);ctx.lineTo(w,g.postT);ctx.stroke();
    // vesicles
    this.ves.forEach(v=>{const x=this.X(v.fx),y=g.preB*.5;const f=v.f;ctx.save();ctx.globalAlpha=1-f*.8;ctx.strokeStyle=nc;ctx.lineWidth=2;ctx.fillStyle=rgba(nc,.12);ctx.beginPath();ctx.arc(x,lerp(y,g.preB-4,f),u*.5*(1+f*.3),0,7);ctx.fill();ctx.stroke();ctx.fillStyle=nc;for(let k=0;k<3;k++){ctx.beginPath();ctx.arc(x+(k-1)*u*.2,lerp(y,g.preB-4,f)+((k%2)?u*.1:-u*.08),g.pr*.7,0,7);ctx.fill();}ctx.restore();});
    // transporters or enzyme
    if(o.clear==='transporter'){trs.forEach(t=>{const y=g.preB;ctx.fillStyle=t.blocked?rgba(col.bad,.18):rgba(col.muted,.25);ctx.strokeStyle=t.blocked?col.bad:col.muted;ctx.lineWidth=2;rrect(ctx,t.x-u*.3,y-u*.5,u*.6,u*.7,5);ctx.fill();ctx.stroke();ctx.fillStyle=col.canvas;ctx.beginPath();ctx.arc(t.x,y+u*.2,u*.14,0,7);ctx.fill();
      if(t.blocked){ctx.strokeStyle=col.bad;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(t.x-u*.2,y-u*.35);ctx.lineTo(t.x+u*.2,y+u*.0);ctx.moveTo(t.x+u*.2,y-u*.35);ctx.lineTo(t.x-u*.2,y+u*.0);ctx.stroke();}});}
    else{const ey=(g.preB+g.postT)/2;for(let k=0;k<3;k++){const x=this.X(.18+k*.32);ctx.fillStyle=rgba(col.muted,.35);ctx.strokeStyle=col.muted;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,ey+u*.3*(k%2?1:-1),u*.22,.5,6);ctx.lineTo(x,ey+u*.3*(k%2?1:-1));ctx.closePath();ctx.fill();ctx.stroke();}}
    // receptors
    this.rec.forEach(r=>{const x=this.X(r.fx),y=g.postT,op=r.open;
      if(o.rtype==='ion'){const gap=u*.12+op*u*.34;ctx.fillStyle=r.b?nc:col.muted;ctx.globalAlpha=.9;rrect(ctx,x-u*.5-gap/2,y-u*.55,u*.5,u*1.1,4);ctx.fill();rrect(ctx,x+gap/2,y-u*.55,u*.5,u*1.1,4);ctx.fill();ctx.globalAlpha=1;
        if(op>.5){ctx.fillStyle=rgba(nc,.25);ctx.fillRect(x-gap/2,y-u*.5,gap,u*1.1);}}
      else{ctx.strokeStyle=r.b?nc:col.muted;ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y+u*.5);ctx.lineTo(x,y-u*.15);ctx.lineTo(x-u*.32,y-u*.6);ctx.moveTo(x,y-u*.15);ctx.lineTo(x+u*.32,y-u*.6);ctx.stroke();
        // G protein
        const gx=x+(op>.5?u*.55:u*.12)*1,gy=y+u*.8+(op>.5?u*.22:0);ctx.fillStyle=op>.5?rgba(col.accent,.9):rgba(col.muted,.6);ctx.beginPath();ctx.arc(x-u*.12,y+u*.78,u*.17,0,7);ctx.fill();ctx.beginPath();ctx.arc(gx,gy,u*.14,0,7);ctx.fill();
        if(op>.7){ctx.fillStyle=rgba(col.accent,.3);ctx.beginPath();ctx.arc(x+u*.9,y+u*1.1,u*.28,0,7);ctx.fill();ctx.strokeStyle=col.accent;ctx.lineWidth=1.5;ctx.stroke();}}
    });
    // messengers/ions
    this.msg.forEach(m=>{ctx.fillStyle=o.rtype==='ion'?(col[(SYN_ION[o.ionKey]||{colv:'accent'}).colv]||col.accent):col.accent;ctx.globalAlpha=clamp(m.life,0,1);ctx.beginPath();ctx.arc(m.x,m.y,g.pr*.7,0,7);ctx.fill();ctx.globalAlpha=1;});
    // particles
    this.parts.forEach(p=>{ctx.globalAlpha=p.st==='in'||o.clear!=='transporter'?clamp(p.life,.15,1):1;ctx.fillStyle=nc;ctx.beginPath();ctx.arc(p.x,p.y,g.pr,0,7);ctx.fill();if(p.st==='bound'){ctx.strokeStyle=nc;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,g.pr+3,0,7);ctx.stroke();}ctx.globalAlpha=1;});
    // blockers on transporter (drug blobs)
    if(o.clear==='transporter')trs.forEach(t=>{if(t.blocked){ctx.fillStyle=col.bad;ctx.beginPath();ctx.arc(t.x,g.preB-u*.62,g.pr*1.1,0,7);ctx.fill();}});
    // gauge
    const gx=w-u*2.1,gy=h-u*.55;ctx.fillStyle=col.surface2;rrect(ctx,gx,gy,u*1.8,u*.22,4);ctx.fill();ctx.fillStyle=nc;rrect(ctx,gx,gy,Math.max(4,u*1.8*clamp(this.openAvg||0,0,1)),u*.22,4);ctx.fill();
    // labels
    if(App.layers.labels){const s=Math.max(10,Math.min(12,u*.32));txt(ctx,'Presynaptic terminal',8,12,col.muted,s,'left','600');txt(ctx,'Synaptic cleft',8,(g.preB+g.postT)/2,col.muted,s,'left','600');txt(ctx,'Postsynaptic neuron',8,g.postT+14,col.muted,s,'left','600');
      if(o.clear==='transporter'){txt(ctx,o.tr,trs[trs.length-1].x,g.preB+u*.5,col.muted,s,'center','600');}else{txt(ctx,o.tr,this.X(.5),(g.preB+g.postT)/2-u*.55,col.muted,s,'center','600');}
      txt(ctx,'Vesicles',this.X(.5),g.preB*.5-u*.75,col.muted,s,'center','600');
      txt(ctx,o.rtype==='ion'?'Ligand-gated channel':'GPCR',this.X(.5),g.postT+u*1.7,col.muted,s,'center','600');
      txt(ctx,'Response',gx,gy-8,col.muted,s-1,'left','600');}
  }
}

const STG=['Wake','REM','N1','N2','N3'];
function genNight(a,seed){
  const rn=rng(seed),N=480,out=new Array(N).fill(3);
  const lat=Math.round(10+a*55+rn()*6);for(let i=0;i<lat;i++)out[i]=0;
  const n3=[34,26,16,6,2],rem=[8,14,20,26,32];let t=lat,k=0;
  while(t<N&&k<6){const c=Math.min(k,4);const d3=Math.round(n3[c]*(1-.7*a)),dr=Math.round(rem[c]*(1-.25*a)),cl=Math.round(88+rn()*10),n1=2+(a>.3?2:0);
    const rest=Math.max(6,cl-n1-d3-dr),r1=Math.round(rest*.55);
    [[2,n1],[3,r1],[4,d3],[3,rest-r1],[1,dr]].forEach(s=>{for(let i=0;i<s[1]&&t<N;i++)out[t++]=s[0];});k++;}
  const rn2=rng(seed*7+3),cnt=a<=0?2:Math.round(2+9*a);
  for(let q=0;q<14;q++){const pos=lat+25+Math.floor(rn2()*(N-lat-60)),dur=a<=0?1+Math.floor(rn2()*2):2+Math.floor(rn2()*(4+12*a));if(q<cnt)for(let i=0;i<dur&&pos+i<N;i++)out[pos+i]=0;}
  const rn3=rng(seed*11+5),ma=Math.round(3+10*a);
  for(let q=0;q<14;q++){const pos=lat+10+Math.floor(rn3()*(N-lat-30)),dur=1+Math.floor(rn3()*2);if(q<ma&&out[pos]!==0)for(let i=0;i<dur&&pos+i<N;i++)if(out[pos+i]!==0)out[pos+i]=2;}
  const early=Math.round(a*rng(seed*13+1)()*55);for(let i=N-early;i<N;i++)out[i]=0;
  return out;
}
function nightStats(arr){
  let sol=0;while(sol<arr.length-3&&!(arr[sol]!==0&&arr[sol+1]!==0&&arr[sol+2]!==0))sol++;
  let tst=0,waso=0,c=[0,0,0,0,0];for(let i=sol;i<arr.length;i++){c[arr[i]]++;if(arr[i]===0)waso++;else tst++;}
  let rb=0,rl=0,run=0;for(let i=0;i<arr.length;i++){if(arr[i]===1){run++;}else{if(run>=3){rb++;rl+=run;}run=0;}}if(run>=3){rb++;rl+=run;}
  const p=x=>tst?x/tst*100:0;
  return {sol:sol,tst:tst,waso:waso,se:tst/arr.length*100,n1:p(c[2]),n2:p(c[3]),n3:p(c[4]),rem:p(c[1]),remBout:rb?rl/rb:0};
}

  regen(){const s=CHRONO[this.ch].s,a=this.a;this.ins=genNight(a,29);this.sn=nightStats(this.normal);this.si=nightStats(this.ins);
    const row=(l,x,y,ref)=>'<tr><td>'+l+'</td><td class="num">'+x+'</td><td class="num">'+y+'</td><td class="muted">'+ref+'</td></tr>';
    $('#m3-stats',this.root).innerHTML='<tr><th>Measure</th><th>Normal</th><th>Insomnia</th><th>Typical normal</th></tr>'+row('Sleep latency (min)',this.sn.sol,this.si.sol,'< 20–30')+row('Total sleep time (h)',(this.sn.tst/60).toFixed(1),(this.si.tst/60).toFixed(1),'7–9')+row('Wake after sleep onset (min)',this.sn.waso,this.si.waso,'< 30')+row('Sleep efficiency (%)',this.sn.se.toFixed(0),this.si.se.toFixed(0),'≥ 85')+row('N1 / N2 (% of sleep)',this.sn.n1.toFixed(0)+' / '+this.sn.n2.toFixed(0),this.si.n1.toFixed(0)+' / '+this.si.n2.toFixed(0),'5 / 50')+row('N3 slow-wave (% of sleep)',this.sn.n3.toFixed(0),this.si.n3.toFixed(0),'15–25')+row('REM (% of sleep)',this.sn.rem.toFixed(0),this.si.rem.toFixed(0),'20–25');
    // two-process
    const w=s+8,sl=s%24,wk=w%24,td=4.2*(1+a*.9);const arr=[];let S=.3;const dt=1/12;

    for(let d=0;d<6;d++)for(let i=0;i<288;i++){const t=i*dt;if(inS(t))S=S*Math.exp(-dt/td);else S=1-(1-S)*Math.exp(-dt/18.2);if(d===5)arr.push(S);}
    this.S=arr;this.sl=sl;this.wk=wk;this.Cpk=(wk+10)%24;this.updateClock();},
  C(t){return Math.cos(2*Math.PI*(t-this.Cpk)/24);},
  mel(t){const on=((this.sl-2)%24+24)%24,len=10.5;const dh=((t-on)%24+24)%24;return dh>len?0:smooth(0,1.5,dh)*(1-smooth(len-1.5,len,dh));},
  cort(t){const x=(Math.cos(2*Math.PI*(t-(this.wk+.5))/24)+1)/2;return .1+.9*Math.pow(x,1.6);},

  buildClock(){

    const arc=(a0,a1,r0,r1,fill,op)=>{const p=(a,r)=>[Math.sin(a)*r,-Math.cos(a)*r];const A=p(a0,r1),B=p(a1,r1),C=p(a1,r0),D=p(a0,r0),big=(a1-a0)>Math.PI?1:0;return '<path d="M'+A[0].toFixed(1)+' '+A[1].toFixed(1)+' A'+r1+' '+r1+' 0 '+big+' 1 '+B[0].toFixed(1)+' '+B[1].toFixed(1)+' L'+C[0].toFixed(1)+' '+C[1].toFixed(1)+' A'+r0+' '+r0+' 0 '+big+' 0 '+D[0].toFixed(1)+' '+D[1].toFixed(1)+' Z" style="fill:'+fill+';opacity:'+op+'"/>';};

    [[0,'00'],[6,'06'],[12,'12'],[18,'18']].forEach(x=>{const a=this.ang(x[0]);h+='<text class="lbl" x="'+(Math.sin(a)*109).toFixed(1)+'" y="'+(-Math.cos(a)*109+3).toFixed(1)+'" text-anchor="middle" style="font-size:9px;fill:var(--muted)">'+x[1]+'</text>';});
    h+='<g id="m3-mk"></g><line id="m3-hand" x1="0" y1="0" x2="0" y2="-82" style="stroke:var(--ink);stroke-width:2.5;stroke-linecap:round"/><circle r="5" style="fill:var(--ink)"/><text id="m3-ctr" y="30" text-anchor="middle" style="font-size:13px;font-weight:700;fill:var(--ink);font-family:var(--font-mono)">09:00</text><text class="lbl" y="44" text-anchor="middle" style="font-size:8.5px;fill:var(--muted)">SCN time (24 h)</text>';

    const set=ev=>{const r=svg.getBoundingClientRect();const x=ev.clientX-(r.left+r.width/2),y=ev.clientY-(r.top+r.height/2);let a=Math.atan2(x,-y);if(a<0)a+=2*Math.PI;this.ct=Math.round(a/(2*Math.PI)*96)/4;$('#m3-ct',this.root).value=this.ct;this.runDay=false;};
    let drag=false;svg.addEventListener('pointerdown',e=>{drag=true;try{svg.setPointerCapture(e.pointerId);}catch(x){}set(e);});svg.addEventListener('pointermove',e=>{if(drag)set(e);});svg.addEventListener('pointerup',()=>{drag=false;});

  updateClock(){
    const arc=this.arc,r=this.root;let env='',mel='';
    env+=arc(this.ang(6.5),this.ang(18.5),84,92,'var(--glu)',.55)+arc(this.ang(18.5),this.ang(24),84,92,'var(--mel)',.5)+arc(0,this.ang(6.5),84,92,'var(--mel)',.5);

  tick(dt,t){

  hyp(c,arr,pm,lo){

    for(let k=0;k<=8;k+=2){const x=L+pw*k/8;txt(ctx,hh(lo+k),x,h-8,col.muted,10,k===0?'left':k===8?'right':'center');}

  drawTwo(){

    ctx.fillStyle=rgba(col.sleep,.14);const s=this.sl,e=this.wk;if(s<e)ctx.fillRect(X(s),T,X(e)-X(s),ph);else{ctx.fillRect(X(s),T,X(24)-X(s),ph);ctx.fillRect(X(0),T,X(e)-X(0),ph);}

function bzSim(id,mult,perDay,hours){
  const d=BZ[id],dt=.05,n=Math.round(hours/dt),kp=Math.log(2)/d.th,km=Math.log(2)/d.mh;

    for(let i=0;i<=N;i++){const t=i*dt;if(t>=nextDose-1e-9){G+=m;nextDose+=iv;}out[i]=P+d.mw*M;
      const G1=G*Math.exp(-d.ka*dt),ab=G-G1;G=G1;const Pn=P*Math.exp(-kp*dt)+ab;const form=d.fm*kp*P*dt;P=Pn;M=M*Math.exp(-km*dt)+form;}return out;}
  if(!BZ_CACHE[id]){const one=run(1,1,Math.min(hours,24)),mx=Math.max.apply(null,Array.from(one));BZ_CACHE[id]=mx/1.1;}
  const raw=run(mult,perDay,hours),vd=BZ_CACHE[id];const c=new Float32Array(raw.length);for(let i=0;i<raw.length;i++)c[i]=raw[i]/vd;return {c:c,dt:dt};
}

    '<div><div class="sub">Contrast</div>'+seg('ax-contrast',[['std','Standard'],['high','High contrast']],AX.contrast)+'</div>'+
    '<div><div class="sub">Colour-vision friendly palette <em style="text-transform:none;letter-spacing:0;font-weight:500">(neurotransmitter and chart colours)</em></div>'+seg('ax-cb',[['std','Standard'],['on','Colour-blind safe']],AX.cb)+'</div>'+
    '<div><div class="sub">Font</div>'+seg('ax-font',[['def','System default'],['readable','Atkinson Hyperlegible'],['dys','Lexend (reading support)']],AX.font)+'<p class="small muted" style="margin-top:6px">Alternate fonts load from Google Fonts. Offline, the system font is used.</p></div>'+
    '<div><div class="sub">Text spacing</div>'+seg('ax-space',[['std','Standard'],['wide','Wide lines and letters']],AX.space)+'</div></div>'+
    '<div class="panel stack"><h3>Interaction</h3>'+
    '<div><div class="sub">Focus outlines</div>'+seg('ax-focus',[['std','Standard'],['strong','Strong']],AX.focus)+'</div>'+
    '<div><div class="sub">Motion</div><div>'+seg('ax-motion',[['full','Full'],['reduced','Reduced']],App.reduce?'reduced':'full')+'</div><p class="small muted" style="margin-top:6px">Reduced motion removes pulsing effects and slows animation. Your device setting is respected on first load.</p></div>'+
    '<div><div class="sub">Freeze animations</div>'+seg('ax-freeze',[['off','Animate'],['on','Freeze']],AX.freeze)+'<p class="small muted" style="margin-top:6px">Freezing holds particles, flows and traces still. Charts and readouts still respond to controls.</p></div>'+
    '<div class="row"><button class="btn" id="ax-reset" type="button">Reset accessibility settings</button></div></div></div>'+
    '<div class="panel" style="margin-bottom:16px"><h3>Preview</h3><div class="cols c2" style="margin:0"><div><p><b>Cortisol and the HPA axis</b></p><p class="muted">Chronic stress weakens glucocorticoid negative feedback, so cortisol stays high and sleep fragments.</p></div><div class="row"><span class="chip" style="--c:var(--gaba)"><i></i>GABA</span><span class="chip" style="--c:var(--glu)"><i></i>Glutamate</span><span class="chip" style="--c:var(--ser)"><i></i>Serotonin</span><span class="chip" style="--c:var(--ne)"><i></i>Norepinephrine</span><span class="chip" style="--c:var(--da)"><i></i>Dopamine</span><span class="chip" style="--c:var(--his)"><i></i>Histamine</span><span class="chip" style="--c:var(--ore)"><i></i>Orexin</span><span class="chip" style="--c:var(--mel)"><i></i>Melatonin</span></div></div></div>'+
    '<div class="cols c2"><div class="panel"><h3>Keyboard</h3><div class="scroll"><table class="tbl"><tr><th>Keys</th><th>Action</th></tr><tr><td class="mono">Tab / Shift+Tab</td><td>Move between controls, including brain-map structures</td></tr><tr><td class="mono">Enter / Space</td><td>Activate a button, tab, chip or brain-map structure</td></tr><tr><td class="mono">← → ↑ ↓</td><td>Adjust a slider</td></tr><tr><td class="mono">Home / End</td><td>Jump a slider to its minimum or maximum</td></tr><tr><td class="mono">Skip link</td><td>First Tab press offers “Skip to content”</td></tr></table></div></div>'+
    '<div class="panel"><h3>Accessibility statement</h3><p class="small">Controls are native buttons, sliders, selects and checkboxes with visible focus, labels and live regions for feedback. Meaning is never carried by colour alone: every transmitter, receptor and drug has a text label. Animated canvases are visual: the same information is repeated in readouts, tables and captions beside them, and the canvases carry text descriptions. Known limits: the anatomical brain map and molecular animations have no full audio description; use the text panels. Report problems to your course instructor or the simulator author.</p></div></div>';
  },
  init(root){
    const bind=(id,key,fn)=>bindSeg(root,id,v=>{AX[key]=key==='size'?+v:v;applyAX();if(fn)fn(v);});
    bind('ax-size','size');bind('ax-contrast','contrast');bind('ax-cb','cb');bind('ax-font','font');bind('ax-space','space');bind('ax-focus','focus');bind('ax-freeze','freeze');
    bindSeg(root,'ax-motion',v=>{App.setMotion(v==='reduced');});
    $('#ax-reset',root).onclick=()=>{Object.assign(AX,AXD);applyAX();App.setMotion(!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches));mount('ax');};
  },
  tick(){}
};

/* ============ shell: navigation, layers, theme, loop ============ */
function buildNav(){
  const nav=$('#nav');nav.innerHTML=MODLIST.map((m,i)=>'<button type="button" data-mod="'+m.id+'"><span class="n">'+(m.id==='pg'||m.id==='ax'?'·':i+1)+'</span><span>'+m.t+'<small>'+m.s+'</small></span><span class="ck" aria-hidden="true"></span></button>').join('');
  nav.addEventListener('click',e=>{const b=e.target.closest('button');if(b){mount(b.dataset.mod);try{history.replaceState(null,'','#'+b.dataset.mod);}catch(x){}}});
}
function mount(id){
  const mod=App.mods[id];if(!mod)return;App.cur=null;const main=$('#main');main.innerHTML=mod.html();
  $$('#nav button').forEach(b=>{if(b.dataset.mod===id)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  try{mod.init(main);}catch(err){main.insertAdjacentHTML('afterbegin','<div class="alert danger"><b>Module error:</b>'+esc(err.message)+'</div>');console.error(err);}
  App.cur=mod;App.curId=id;if(id!=='pg'&&id!=='ax'){PROG.visited[id]=1;}saveProg();store.set('last',id);window.scrollTo(0,0);
}
function applyLayers(){const a=$('#app');a.classList.toggle('hide-labels',!App.layers.labels);a.classList.toggle('hide-pathways',!App.layers.pathways);a.classList.toggle('hide-pearls',!App.layers.pearls);a.classList.toggle('hide-detail',!App.layers.detail);}
function boot(){
  LMS.init();readColors();buildNav();applyAX();
  const map={labels:'L-labels',pathways:'L-pathways',pearls:'L-pearls',detail:'L-detail'};
  Object.keys(map).forEach(k=>{const el=$('#'+map[k]);el.checked=App.layers[k];el.addEventListener('change',()=>{App.layers[k]=el.checked;applyLayers();});});applyLayers();
  const bm=$('#btn-motion');bm.addEventListener('click',()=>{App.setMotion(!App.reduce);});App.setMotion(App.reduce);
  const ts=$('#theme-seg');const sysDark=()=>!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  const showTheme=()=>{const eff=App.theme==='auto'?(sysDark()?'dark':'light'):App.theme;$$('button',ts).forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===eff?'true':'false'));};
  const setTheme=t=>{App.theme=t;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);readColors();showTheme();};
  ts.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;setTheme(b.dataset.v);store.set('theme',b.dataset.v);});
  const saved=store.get('theme','auto');setTheme(saved==='light'||saved==='dark'?saved:'auto');
  if(window.matchMedia)try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readColors();showTheme();});}catch(e){}
  $('#main').addEventListener('click',e=>{const b=e.target.closest('[data-check]');if(b)checkQuiz(b.dataset.check);});
  let id=(location.hash||'').replace('#','');if(!App.mods[id])id=store.get('last','m1');if(!App.mods[id])id='m1';mount(id);
  window.addEventListener('hashchange',()=>{const h=location.hash.replace('#','');if(App.mods[h]&&h!==App.curId)mount(h);});
  window.addEventListener('pagehide',()=>LMS.end());window.addEventListener('resize',()=>applyAX());
  const sk=$('#skip');if(sk)sk.addEventListener('click',e=>{e.preventDefault();const mn=$('#main');mn.setAttribute('tabindex','-1');mn.focus();});
  let last=performance.now(),t=0;
  function frame(now){let dt=Math.min(.05,(now-last)/1000)*(App.reduce?.5:1);last=now;if(App.freeze)dt=0;t+=dt;const m=App.cur;
    if(App.force){App.force=false;if(m){m._f=-1;m._ft=-1;}}
    if(m&&m.tick){try{m.tick(dt,t);}catch(err){if(!App._err){App._err=1;console.error(err);}}}requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();

</script>
