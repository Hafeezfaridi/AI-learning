<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NeuroSleep Pharm Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: left rail navigation + instrument-panel workspace; each module is a lab bench of linked live gauges. */
:root{
  --bg:#EDF1F5; --panel:#FFFFFF; --panel2:#E3E9F0; --ink:#13202E; --muted:#4B5B6C; --line:#C9D3DE;
  --teal:#0B7A85; --teal-soft:#D3EEF0; --violet:#5A4A9E; --violet-soft:#E4DFF5;
  --amber:#A8650A; --amber-soft:#F8E8CC; --red:#B3261E; --red-soft:#F8DAD6; --green:#2A7A3B; --green-soft:#D9EFDD;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1620; --panel:#142130; --panel2:#1B2C3F; --ink:#E6EEF6; --muted:#9DB0C3; --line:#2A3D52;
  --teal:#3CC4D0; --teal-soft:#123B42; --violet:#A99BEA; --violet-soft:#2A2550;
  --amber:#F0B34E; --amber-soft:#41300F; --red:#FF8A80; --red-soft:#47201D; --green:#7FD28F; --green-soft:#183A20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1620; --panel:#142130; --panel2:#1B2C3F; --ink:#E6EEF6; --muted:#9DB0C3; --line:#2A3D52;
  --teal:#3CC4D0; --teal-soft:#123B42; --violet:#A99BEA; --violet-soft:#2A2550;
  --amber:#F0B34E; --amber-soft:#41300F; --red:#FF8A80; --red-soft:#47201D; --green:#7FD28F; --green-soft:#183A20; color-scheme:dark}
:root[data-theme="contrast"]{
  --bg:#000; --panel:#000; --panel2:#111; --ink:#fff; --muted:#fff; --line:#fff;
  --teal:#00FFFF; --teal-soft:#002b2b; --violet:#FFB3FF; --violet-soft:#2a002a;
  --amber:#FFD400; --amber-soft:#2a2200; --red:#FF6B6B; --red-soft:#2a0000; --green:#5CFF7A; --green-soft:#002a0b; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.9rem} h2{font-size:1.35rem} h3{font-size:1.05rem}
p{margin:.4em 0 .8em;max-width:68ch}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:var(--teal);color:#000;padding:8px 12px;z-index:50}
.skip:focus{left:8px}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;max-width:1400px;margin:0 auto;min-height:calc(100% - 4px)}
nav.rail{position:sticky;top:12px;align-self:start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 24px);overflow:auto}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.1rem;padding:6px 8px 10px;color:var(--teal);letter-spacing:.01em}
.brand small{display:block;font:500 .68rem var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
nav.rail button{all:unset;box-sizing:border-box;cursor:pointer;padding:7px 10px;border-radius:6px;font-size:.88rem;color:var(--muted);display:block;width:100%}
nav.rail button:hover{background:var(--panel2);color:var(--ink)}
nav.rail button[aria-current="page"]{background:var(--teal-soft);color:var(--teal);font-weight:600}
nav.rail button:focus-visible{outline:3px solid var(--teal)}
.tools{display:flex;gap:6px;flex-wrap:wrap;padding:8px 6px 2px;border-top:1px solid var(--line);margin-top:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:.78rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
main{min-width:0;display:flex;flex-direction:column;gap:14px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.xp{display:flex;gap:10px;align-items:center;font:500 .8rem var(--f-mono)}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;min-width:120px}
.bar>i{display:block;height:100%;background:var(--teal);transition:width .5s}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.panel h3{margin-bottom:6px}
.lbl{font:500 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{background:var(--teal);color:#fff;border:0;border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:600}
:root[data-theme="dark"] .btn,:root[data-theme="contrast"] .btn{color:#000}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#001417}}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;font:500 .72rem var(--f-mono);padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.pill.g{background:var(--green-soft);color:var(--green)} .pill.a{background:var(--amber-soft);color:var(--amber)} .pill.r{background:var(--red-soft);color:var(--red)} .pill.t{background:var(--teal-soft);color:var(--teal)} .pill.v{background:var(--violet-soft);color:var(--violet)}
svg{max-width:100%;height:auto;display:block}
svg text{fill:var(--ink);font-family:var(--f-body)}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:var(--panel)}
.slider{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;margin:4px 0}
.slider input[type=range]{width:100%;accent-color:var(--teal)}
.meter{display:grid;grid-template-columns:120px 1fr 44px;gap:8px;align-items:center;margin:5px 0;font-size:.85rem}
.meter .bar{height:10px}
.meter .bar>i.bad{background:var(--red)} .meter .bar>i.ok{background:var(--green)} .meter .bar>i.v{background:var(--violet)}
.note{border-left:3px solid var(--teal);background:var(--teal-soft);padding:8px 12px;border-radius:0 6px 6px 0;font-size:.88rem;margin:8px 0}
.note.warn{border-color:var(--amber);background:var(--amber-soft)}
.note.bad{border-color:var(--red);background:var(--red-soft)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--teal)}
.opt[aria-checked="true"],.opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.opt.right{border-color:var(--green);background:var(--green-soft)} .opt.wrong{border-color:var(--red);background:var(--red-soft)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:10px}
.tabs button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--teal);border-color:var(--teal);font-weight:600}
.region{cursor:pointer;transition:filter .2s}
.region:hover,.region:focus-visible{filter:brightness(1.2)}
.region.on{stroke:var(--ink);stroke-width:3}
.mono{font-family:var(--f-mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-24}}
.flow{stroke-dasharray:6 6;animation:flow 1s linear infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}*{transition:none!important}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav.rail{position:static;flex-direction:row;overflow-x:auto;max-height:none;align-items:center}
  nav.rail button{white-space:nowrap;width:auto}
  .brand,.tools{flex:none;border:0;margin:0}
  .slider{grid-template-columns:90px 1fr 34px}
  .meter{grid-template-columns:96px 1fr 40px}
}

/* ---------- 2. Stress physiology time series ---------- */
function stressSeries(intensity,minutes=60,step=1,primed=false){
  /* intensity 0-1. Sympathetic response in seconds-minutes; cortisol peaks about 20-30 min after stressor onset. */
  const out=[];const k=primed?1.25:1;
  for(let t=0;t<=minutes;t+=step){
    const sym=intensity*k*(1-Math.exp(-t/1.2))*Math.exp(-Math.max(0,t-6)/(primed?45:18));
    const crt=intensity*k*Math.pow(t/22,2)*Math.exp(2*(1-t/22))*(primed?1.15:1);
    out.push({t,hr:72+48*sym,sbp:118+34*sym,rr:14+14*sym,cort:9+22*crt,ne:1+3.2*sym,crh:1+2.2*Math.min(1,intensity*k*(1-Math.exp(-t/4)))*Math.exp(-Math.max(0,t-15)/30)});
  }

}

/* ---------- 3. Sleep architecture ---------- */
const STAGES=['W','REM','N1','N2','N3'];
function sleepNight(opts={}){

  const D=DRUG_BY_ID[o.drug]; const A=D?D.arch:{sl:0,n3:0,rem:0,waso:0};
  const r=rng(o.seed);

  const lat=Math.max(5,15+o.caffeine*0.08+o.stress*0.35+A.sl+(o.alcohol>0?-5:0)); /* minutes */
  const f3=clamp(1-o.caffeine/600-o.stress/320+A.n3/100-(o.alcohol>0?0.1:0),0.1,1.4);
  let fR=clamp(1-o.stress/450+A.rem/100,0.1,1.5);

  const L3=[6,5,3,1,0,0,0],R=[2,3,5,6,7,7,7];
  const stages=[];
  const latE=Math.round(lat/5); for(let i=0;i<latE&&stages.length<N;i++)stages.push('W');
  let c=0;
  while(stages.length<N&&c<7){
    const first=stages.length<N/2;
    let l3=Math.round(L3[c]*f3);
    let rr=Math.round(R[c]*fR*(o.alcohol>0?(first?0.45:1.3):1));
    rr=Math.max(c===0?1:0,rr);
    const rest=Math.max(0,18-1-4-l3-rr);
    const seq=[['N1',1],['N2',4],['N3',l3],['N2',rest],['REM',rr]];
    seq.forEach(([s,n])=>{for(let i=0;i<n&&stages.length<N;i++)stages.push(s);});
    c++;
  }
  while(stages.length<N)stages.push('N2');
  /* awakenings in second half, scaled by waso modifier (negative = fewer) */
  const wf=clamp(1+A.waso/40,0.2,1.6);
  for(let i=Math.floor(N*0.3);i<N;i++){
    const p=waso0*wf/12*(i>N*0.6?1.4:0.8)*0.35;
    if(stages[i]!=='W'&&r()<p&&(stages[i-1]!=='W'))stages[i]='W';
  }
  let cnt={W:0,REM:0,N1:0,N2:0,N3:0};stages.forEach(s=>cnt[s]++);
  const asleepE=N-cnt.W;
  const first=stages.findIndex(s=>s!=='W');
  const wasoE=stages.slice(Math.max(0,first)).filter(s=>s==='W').length;
  const pct=s=>asleepE?+(100*cnt[s]/asleepE).toFixed(1):0;
  return{stages,latency:Math.round(lat),tst:Math.round(asleepE*5),efficiency:Math.round(100*asleepE/N),
    waso:wasoE*5,n1:pct('N1'),n2:pct('N2'),n3:pct('N3'),rem:pct('REM'),n3min:cnt.N3*5,remMin:cnt.REM*5};
}

/* Line chart: series [{name,cls,pts:[[x,y]]}]. Colors come from CSS variables. Returns {el,update(series,opts)} */
const PALETTE=['--teal','--violet','--amber','--red','--green'];
function lineChart(opts){
  const W=opts.w||520,H=opts.h||220,m={l:42,r:14,t:14,b:34};
  const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':opts.label||'Line chart'});
  const g=sv('g');svg.append(g);
  const legend=h('div',{class:'row',style:'font-size:.78rem;gap:12px'});
  function draw(series,o2){
    const o=Object.assign({},opts,o2||{});g.innerHTML='';legend.innerHTML='';
    const xs=series.flatMap(s=>s.pts.map(p=>p[0])),ys=series.flatMap(s=>s.pts.map(p=>p[1]));
    const x0=o.xmin!=null?o.xmin:Math.min(...xs),x1=o.xmax!=null?o.xmax:Math.max(...xs);
    let y0=o.ymin!=null?o.ymin:Math.min(...ys,0),y1=o.ymax!=null?o.ymax:Math.max(...ys)*1.1;if(y1===y0)y1=y0+1;
    const X=x=>m.l+(x-x0)/(x1-x0||1)*(W-m.l-m.r),Y=y=>H-m.b-(y-y0)/(y1-y0)*(H-m.t-m.b);
    for(let i=0;i<=4;i++){const yv=y0+(y1-y0)*i/4,yy=Y(yv);
      g.append(sv('line',{x1:m.l,x2:W-m.r,y1:yy,y2:yy,style:'stroke:var(--line);stroke-width:1'}));
      g.append(sv('text',{x:m.l-6,y:yy+4,'text-anchor':'end','font-size':10,class:'mono'},(Math.round(yv*10)/10)));}
    const xt=o.xticks||5;for(let i=0;i<=xt;i++){const xv=x0+(x1-x0)*i/xt;
      g.append(sv('text',{x:X(xv),y:H-m.b+16,'text-anchor':'middle','font-size':10,class:'mono'},o.xfmt?o.xfmt(xv):Math.round(xv*10)/10));}
    g.append(sv('text',{x:W/2,y:H-4,'text-anchor':'middle','font-size':10,style:'fill:var(--muted)'},o.xlabel||''));
    g.append(sv('text',{x:10,y:H/2,'text-anchor':'middle','font-size':10,style:'fill:var(--muted)',transform:`rotate(-90 10 ${H/2})`},o.ylabel||''));
    series.forEach((s,i)=>{const col=`var(${s.col||PALETTE[i%5]})`;
      const d=s.pts.map((p,j)=>(j?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');
      g.append(sv('path',{d,fill:'none',style:`stroke:${col};stroke-width:2.2`}));
      const last=s.pts[s.pts.length-1];g.append(sv('circle',{cx:X(last[0]),cy:Y(last[1]),r:4,style:`fill:${col}`}));
      legend.append(h('span',{},h('span',{style:`display:inline-block;width:10px;height:10px;border-radius:2px;background:${col};margin-right:5px`}),s.name));});
    if(o.marker!=null){g.append(sv('line',{x1:X(o.marker),x2:X(o.marker),y1:m.t,y2:H-m.b,style:'stroke:var(--ink);stroke-dasharray:4 3;opacity:.6'}));}
  }
  return{el:h('div',{},svg,legend),update:draw};
}

  function start(){const pool=QS.filter(q=>typeSel.value==='all'||q.t===typeSel.value);
    const order=[...pool].sort(()=>Math.random()-.5).slice(0,8);let i=0,correct=0;
    function show(){box.innerHTML='';if(i>=order.length){const pct=Math.round(100*correct/order.length);S.quiz.push({pct,n:order.length,t:Date.now()});save();gain(10+correct*3,null);if(pct>=80)award('quiz');
      box.append(h('div',{class:'panel'},h('h2',{},'Score: '+correct+' / '+order.length+' ('+pct+'%)'),h('p',{},pct>=80?'Strong mastery.':'Review the rationales and the Pharmacology Lab, then retry.'),h('button',{class:'btn',onclick:start},'New round')));return;}

        opts.forEach((o,k)=>{o.classList.remove('sel');if(q.a.includes(k))o.classList.add('right');else if(chosen.has(k))o.classList.add('wrong');});
        fb.append(h('div',{class:'note '+(ok?'':'bad')},h('strong',{},ok?'Correct. ':'Not quite. '),q.r,h('div',{style:'margin-top:6px;font-size:.8rem;color:var(--muted)'},'Reference: '+q.ref)),
          h('button',{class:'btn',onclick:()=>{i++;show();}},i+1<order.length?'Next question':'See score'));save();}
      box.append(h('div',{class:'panel'},h('div',{class:'row'},pill('Question '+(i+1)+' of '+order.length),pill(QTYPES.find(x=>x[0]===q.t)[1],'t'),pill("Bloom: "+BLOOM[q.bloom]+' (L'+q.bloom+')','v'),pill(q.tag)),
        h('h3',{style:'margin:10px 0'},q.q),multi?h('p',{style:'color:var(--muted)'},'Select all that apply, then submit.'):null,h('div',{role:multi?'group':'radiogroup','aria-label':'Answer choices'},opts),
        multi?h('button',{class:'btn',onclick:()=>{if(!done&&chosen.size)submit();}},'Submit answer'):null,fb));}

  return h('div',{style:'display:flex;flex-direction:column;gap:14px'},head('Knowledge Check','Question bank with rationales, references and Bloom\'s taxonomy levels. Choose a type, answer, and read the explanation.'),h('div',{class:'row'},h('label',{for:'q-type',class:'lbl'},'Type'),typeSel),box);
};

/* ---------- Instructor Analytics ---------- */
const COHORT=[['Amara O.',840,92,88],['Diego R.',720,85,81],['Priya S.',650,78,76],['Jordan T.',510,70,64],['Lena K.',430,66,70],['Marcus W.',260,52,55],['Sofia B.',180,48,50]];
VIEWS.inst=()=>{
  const fmt=s=>s>=3600?(s/3600).toFixed(1)+' h':s>=60?Math.round(s/60)+' min':s+' s';
  const total=Object.values(S.time).reduce((a,b)=>a+b,0)+(cur?Math.round((Date.now()-curStart)/1000):0);
  const done=Object.keys(S.visited).length,avgQ=S.quiz.length?Math.round(S.quiz.reduce((a,b)=>a+b.pct,0)/S.quiz.length):null;
  const avgR=S.reasoning.length?Math.round(S.reasoning.reduce((a,b)=>a+b.score,0)/S.reasoning.length):null;
  const stat=(l,v,s)=>h('div',{class:'panel'},h('div',{class:'lbl'},l),h('div',{style:'font:700 1.8rem var(--f-display)'},v),h('div',{style:'color:var(--muted);font-size:.8rem'},s));
  const timeRows=MODS.slice(1).map(([id,n])=>[n,S.time[id]||0]);const maxT=Math.max(60,...timeRows.map(r=>r[1]));
  const missed=Object.entries(S.missed).sort((a,b)=>b[1]-a[1]).slice(0,6);const maxM=Math.max(1,...missed.map(m=>m[1]));
  const you=[S.name+' (you)',S.xp,avgQ||0,avgR||0];const board=[...COHORT,you].sort((a,b)=>b[1]-a[1]);
  return h('div',{style:'display:flex;flex-direction:column;gap:14px'},head('Instructor Analytics','Your own activity is tracked live in this browser. The cohort leaderboard uses sample classmates for demonstration; connect the optional backend (see README) to collect real cohort data.'),
    h('div',{class:'grid'},stat('Time spent',fmt(total),'across modules'),stat('Modules opened',done+' / '+(MODS.length),'completion '+Math.round(100*done/MODS.length)+'%'),stat('Quiz performance',avgQ!=null?avgQ+'%':'No quiz yet',S.quiz.length+' rounds'),stat('Clinical reasoning',avgR!=null?avgR+'/100':'No case yet',S.reasoning.length+' cases/patients')),
    h('div',{class:'grid'},
      h('div',{class:'panel'},h('h3',{},'Time by module'),timeRows.map(([n,s])=>{const i=h('i',{});i.style.width=(100*s/maxT)+'%';return h('div',{class:'meter',style:'grid-template-columns:150px 1fr 56px'},h('span',{},n),h('div',{class:'bar'},i),h('span',{class:'mono'},fmt(s)));})),
      h('div',{class:'panel'},h('h3',{},'Most missed concepts'),missed.length?missed.map(([n,c])=>{const i=h('i',{class:'bad'});i.style.width=(100*c/maxM)+'%';return h('div',{class:'meter',style:'grid-template-columns:150px 1fr 30px'},h('span',{},n),h('div',{class:'bar'},i),h('span',{class:'mono'},c));}):h('p',{style:'color:var(--muted)'},'Answer some questions in Knowledge Check to see missed concepts.'))),
    h('div',{class:'grid'},
      h('div',{class:'panel'},h('h3',{},'Leaderboard'),h('div',{class:'scroll-x'},h('table',{},h('thead',{},h('tr',{},['#','Learner','XP','Quiz %','Reasoning'].map(x=>h('th',{scope:'col'},x)))),h('tbody',{},board.map((r,i)=>h('tr',{style:r===you?'background:var(--teal-soft)':''},h('td',{},i+1),h('td',{},r[0]),h('td',{class:'mono'},r[1]),h('td',{class:'mono'},r[2]||'-'),h('td',{class:'mono'},r[3]||'-'))))))),
      h('div',{class:'panel'},h('h3',{},'Badges'),h('div',{class:'row'},Object.keys(BADGES).map(k=>h('div',{class:'panel',style:'width:150px;opacity:'+(S.badges[k]?1:.5)},h('div',{class:'lbl'},S.badges[k]?'Earned':'Locked'),h('strong',{},BADGES[k][0]),h('div',{style:'font-size:.78rem;color:var(--muted)'},BADGES[k][1])))),
        h('h3',{style:'margin-top:12px'},'Mastery'),h('p',{},'Level: '+level().name+' ('+S.xp+' XP)'),h('button',{class:'btn alt',onclick:()=>{S={xp:0,badges:{},time:{},done:{},visited:{},regions:{},recepts:{},sleepRuns:{},quiz:[],missed:{},reasoning:[],cases:{},name:'You'};save();go('inst');}},'Reset my progress'))));
};

/* ---------- Shell ---------- */
function boot(){
  const rail=$('#rail');
  MODS.forEach(([id,name])=>rail.insertBefore(h('button',{'data-v':id,onclick:()=>go(id)},name),$('#tools')));
  const th=$('#t-theme'),hc=$('#t-contrast');
  const setTheme=t=>{if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');try{localStorage.setItem('nspl.theme',t||'');}catch(e){}th.setAttribute('aria-pressed',t==='dark');hc.setAttribute('aria-pressed',t==='contrast');};
  th.addEventListener('click',()=>setTheme(th.getAttribute('aria-pressed')==='true'?'light':'dark'));
  hc.addEventListener('click',()=>setTheme(hc.getAttribute('aria-pressed')==='true'?'light':'contrast'));
  try{const t=localStorage.getItem('nspl.theme');if(t)setTheme(t);}catch(e){}
  const first=(location.hash||'').slice(1);go(VIEWS[first]?first:'home');
  window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(VIEWS[id]&&id!==cur)go(id);});
}
boot();
