<style>
:root{
  --bg:#f4f6fb;--bg2:#ffffff;--bg3:#eaeef7;--ink:#14213d;--ink2:#46526e;--line:#d5dcec;

html{font-size:var(--fs)}

header.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 18px;background:linear-gradient(90deg,#14213d,#2a2f6e 60%,#5b3aa8);color:#fff;box-shadow:var(--shadow);flex-wrap:wrap}

.tbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:9px;padding:6px 11px;font-size:.8rem}

.layout{display:flex;min-height:calc(100vh - 58px)}

.p-glu{background:var(--glu)}.p-da{background:var(--da)}.p-ser{background:var(--ser)}.p-ne{background:var(--ne)}.p-gaba{background:var(--gaba)}

.objs li{margin:3px 0}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.heatc{border-radius:10px;padding:8px;color:#fff;font-size:.78rem;font-weight:600}
.cert{border:10px double #b08d2a;background:#fffdf4;color:#2b2b2b;padding:34px;text-align:center;border-radius:6px}
.cert h1{font-family:Georgia,serif;margin:6px 0}
.mini{font-size:.78rem;color:var(--ink2)}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes drift{0%{transform:translateY(0)}50%{transform:translateY(-4px)}100%{transform:translateY(0)}}

<script>
'use strict';
/* =====================================================================
   PART 2 — CORE: utilities, state, animation engine, quiz engine, router
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const NS='http://www.w3.org/2000/svg';
function h(tag,props,...kids){
  const e=document.createElement(tag);
  if(props)for(const k in props){const v=props[k];
    if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)e.setAttribute(k,v);}
  kids.flat(9).forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c));});
  return e;
}
function s(tag,props,...kids){
  const e=document.createElementNS(NS,tag);
  if(props)for(const k in props){const v=props[k];
    if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(k==='text')e.textContent=v;
    else if(v!=null&&v!==false)e.setAttribute(k,v);}
  kids.flat(9).forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c));});
  return e;
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmtTime=sec=>{sec=Math.round(sec);const m=Math.floor(sec/60),r=sec%60;return m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m ${r}s`;};
const hash=str=>{let x=5381;for(let i=0;i<str.length;i++)x=((x<<5)+x+str.charCodeAt(i))|0;return String(x);};
function addCSS(t){const st=document.createElement('style');st.textContent=t;document.head.appendChild(st);}
const COL={normal:'#2f6fed',path:'#d93a3a',dep:'#7b4bd6',mania:'#f08a1c',drug:'#1f9d55',glu:'#13a89e',da:'#d9a406',ser:'#e0568f',ne:'#16a9c9',gaba:'#6b7bd0',gray:'#8791a8'};
addCSS(`.modal-bg{position:fixed;inset:0;background:rgba(5,8,20,.6);z-index:400;display:grid;place-items:center;padding:16px}
.modal{background:var(--bg2);color:var(--ink);border-radius:16px;padding:20px;max-width:560px;width:100%;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.hero svg.bgfx{position:absolute;inset:0;width:100%;height:100%;opacity:.35;pointer-events:none}
.hero>*:not(svg){position:relative}
.timer{height:6px;background:var(--bg3);border-radius:9px;overflow:hidden;margin:6px 0}.timer>i{display:block;height:100%;background:var(--mania);width:100%}
.nt-row{display:flex;align-items:center;gap:8px;font-size:.78rem;margin:3px 0}.nt-row b{width:100px}.nt-row .bar{flex:1}
.sub{color:var(--ink2);font-size:.85rem}.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:.86rem}.kv dt{font-weight:700}.kv dd{margin:0}
ul.tight{margin:4px 0;padding-left:20px}ul.tight li{margin:2px 0}
.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:.74rem;margin:2px;background:var(--bg3)}
details.fold{border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin:6px 0;background:var(--bg2)}details.fold summary{cursor:pointer;font-weight:700}`);

/* ---------- State / persistence ---------- */
const KEY='mdd-bpd-sim-v1';
function defState(){return{mode:'student',dark:false,acc:false,narr:false,mods:{},ach:{},answered:0,streak:0,bestStreak:0,cases:{},challengeBest:0,capstone:false,tut:0,facPass:hash('faculty2026'),started:Date.now()};}
const S=(()=>{let d=null;try{d=JSON.parse(localStorage.getItem(KEY));}catch(e){}return Object.assign(defState(),d||{});})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function modS(id){return S.mods[id]||(S.mods[id]={visits:0,time:0,n:0,ok:0,hist:[],seen:{}});}
function resetAll(){try{localStorage.removeItem(KEY);}catch(e){}location.reload();}

/* ---------- Module registry ---------- */
const MODULES=[
 {id:1,t:'Normal Mood Regulation',g:'Pathophysiology',c:'normal'},
 {id:2,t:'Monoamine Hypothesis of Depression',g:'Pathophysiology',c:'dep'},
 {id:3,t:'Modern Depression Model',g:'Pathophysiology',c:'dep'},
 {id:4,t:'HPA Axis Dysfunction',g:'Pathophysiology',c:'path'},
 {id:5,t:'BDNF & Neuroplasticity',g:'Pathophysiology',c:'glu'},
 {id:6,t:'Reward Deficiency & Anhedonia',g:'Pathophysiology',c:'da'},
 {id:7,t:'Bipolar Disorder Pathophysiology',g:'Pathophysiology',c:'mania'},
 {id:8,t:'Mania Mechanisms',g:'Pathophysiology',c:'mania'},
 {id:9,t:'Glutamate & GABA Model',g:'Pathophysiology',c:'glu'},
 {id:10,t:'SSRIs',g:'Antidepressants',c:'drug'},
 {id:11,t:'SNRIs',g:'Antidepressants',c:'drug'},
 {id:12,t:'Atypical Antidepressants',g:'Antidepressants',c:'drug'},
 {id:13,t:'TCAs & MAOIs',g:'Antidepressants',c:'drug'},
 {id:14,t:'Esketamine & Ketamine',g:'Antidepressants',c:'glu'},
 {id:15,t:'Lithium Deep Dive',g:'Mood Stabilizers',c:'drug'},
 {id:16,t:'Mood Stabilizers',g:'Mood Stabilizers',c:'drug'},
 {id:17,t:'Atypical Antipsychotics in Bipolar',g:'Mood Stabilizers',c:'drug'},
 {id:18,t:'Adverse Effects Lab',g:'Clinical Application',c:'path'},
 {id:19,t:'Patient Case Simulator',g:'Clinical Application',c:'normal'},
 {id:20,t:'Advanced Clinical Decision Lab',g:'Clinical Application',c:'normal'}
];
const modById=id=>MODULES.find(m=>m.id===id);
const VIZ={};      // id -> function(host)  (part 3)
const LESSON={};   // id -> lesson content  (part 4)
const Views={};    // view renderers

/* ---------- Animation engine ---------- */
const Anim={loops:new Set(),running:false,paused:false,speed:1,
  add(fn){const o={fn,last:performance.now()};this.loops.add(o);this.kick();return o;},
  remove(o){this.loops.delete(o);},
  clear(){this.loops.clear();},
  kick(){if(this.running)return;this.running=true;
    const step=t=>{if(!this.loops.size){this.running=false;return;}
      this.loops.forEach(o=>{const dt=this.paused?0:Math.min(.05,(t-o.last)/1000)*this.speed;o.last=t;
        try{o.fn(dt,t/1000);}catch(e){console.error(e);this.loops.delete(o);}});
      requestAnimationFrame(step);};
    requestAnimationFrame(step);}};
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)Anim.speed=.4;

/* ---------- Tooltip ---------- */
const Tip={el:null,
  show(e,title,text){const t=this.el||(this.el=$('#tip'));t.innerHTML=`<b>${title}</b>${text||''}`;t.style.display='block';this.move(e);},
  move(e){const t=this.el;const x=(e.clientX||e.pageX||40)+14,y=(e.clientY||e.pageY||40)+14;
    t.style.left=Math.min(x,innerWidth-t.offsetWidth-10)+'px';t.style.top=Math.min(y,innerHeight-t.offsetHeight-10)+'px';},
  hide(){(this.el||(this.el=$('#tip'))).style.display='none';},
  bind(node,title,text,click){
    node.addEventListener('mouseenter',e=>this.show(e,title,text));
    node.addEventListener('mousemove',e=>this.move(e));
    node.addEventListener('mouseleave',()=>this.hide());
    node.addEventListener('focus',()=>{const r=node.getBoundingClientRect();this.show({clientX:r.left+r.width/2,clientY:r.top},title,text);});
    node.addEventListener('blur',()=>this.hide());
    if(click){node.addEventListener('click',click);node.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();click(e);}});}
    node.setAttribute('tabindex','0');node.setAttribute('aria-label',title+'. '+(text||'').replace(/<[^>]+>/g,''));
  }};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3200);}
function modal(node){const bg=h('div',{class:'modal-bg',onclick:e=>{if(e.target===bg)bg.remove();}},h('div',{class:'modal',role:'dialog','aria-modal':'true'},node));document.body.append(bg);return bg;}

/* ---------- Narration ---------- */
const Narr={speak(t){if(!S.narr||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,' '));u.rate=.95;speechSynthesis.speak(u);}catch(e){}},
  stop(){try{speechSynthesis.cancel();}catch(e){}}};

/* ---------- Progress, mastery, achievements ---------- */
const visitedCount=()=>MODULES.filter(m=>modS(m.id).visits>0).length;
function mastery(id){const m=modS(id);if(!m.n)return 0;const r=m.hist.slice(-20);const acc=r.reduce((a,b)=>a+b.ok,0)/r.length;
  const cov=Math.min(1,Object.keys(m.seen).length/15);return Math.round(100*acc*(.6+.4*cov));}
const totalOK=()=>MODULES.reduce((a,m)=>a+modS(m.id).ok,0);
const totalN=()=>MODULES.reduce((a,m)=>a+modS(m.id).n,0);
const overallAcc=()=>totalN()?Math.round(100*totalOK()/totalN()):0;
const totalTime=()=>MODULES.reduce((a,m)=>a+modS(m.id).time,0);
const masteredCount=()=>MODULES.filter(m=>mastery(m.id)>=80).length;
const certEligible=()=>visitedCount()>=20&&totalN()>=60&&overallAcc()>=70;
const ACH=[
 {id:'first',n:'First Steps',d:'Open your first module',ic:'🧭',f:()=>visitedCount()>=1},
 {id:'ten',n:'Quiz Starter',d:'Answer 10 questions',ic:'📝',f:()=>S.answered>=10},
 {id:'fifty',n:'Quiz Veteran',d:'Answer 50 questions',ic:'📚',f:()=>S.answered>=50},
 {id:'hundred',n:'Century',d:'Answer 100 questions',ic:'💯',f:()=>S.answered>=100},
 {id:'streak5',n:'On a Roll',d:'5 correct answers in a row',ic:'🔥',f:()=>S.bestStreak>=5},
 {id:'streak10',n:'Unstoppable',d:'10 correct answers in a row',ic:'⚡',f:()=>S.bestStreak>=10},
 {id:'explorer',n:'Explorer',d:'Visit all 20 modules',ic:'🗺️',f:()=>visitedCount()>=20},

function record(q,ok){const m=modS(q.m);m.n++;if(ok)m.ok++;m.hist.push({ok:ok?1:0,l:q.l});if(m.hist.length>60)m.hist.shift();

/* ---------- Quiz engine ---------- */
const QB=[];   // question bank (part 4)
const poolFor=ids=>QB.filter(q=>ids.includes(q.m));
const Quiz={
 run(root,pool,o){
  o=Object.assign({count:10,adaptive:true,timed:0,title:'Quiz',onDone:null,practice:false},o||{});
  root.innerHTML='';
  const wrap=h('div',{class:'card fadein'});root.append(wrap);
  const total=Math.min(o.count,pool.length);
  let asked=[],score=0,lvl=2,n=0,pts=0,streak=0,timer=null,tStart=0;
  const levelsHit={1:[0,0],2:[0,0],3:[0,0]};
  const wrong=[];
  function choose(){
    const left=pool.filter(q=>!asked.includes(q.id));if(!left.length)return null;
    if(!o.adaptive)return pick(left);
    const sc=left.map(q=>({q,s:Math.abs(q.l-lvl)+(modS(q.m).seen[q.id]?.7:0)+Math.random()*.6}));
    sc.sort((a,b)=>a.s-b.s);return sc[0].q;
  }
  function finish(){
    clearInterval(timer);wrap.innerHTML='';
    const pc=Math.round(100*score/total);
    wrap.append(h('h2',{},`${o.title} complete`),
      h('p',{class:'sub'},`Score ${score}/${total} (${pc}%)${o.timed?` • Points ${pts}`:''}`),
      h('div',{class:'bar'},h('i',{style:`width:${pc}%`})),
      h('p',{},'Difficulty breakdown: ',...[1,2,3].map(l=>h('span',{class:'chip'},`Level ${l}: ${levelsHit[l][0]}/${levelsHit[l][1]}`))),
      pc>=85?h('div',{class:'explain green'},'Excellent — you are demonstrating mastery of this content.'):
      pc>=70?h('div',{class:'explain'},'Good work. Review the explanations for missed items to consolidate.'):
      h('div',{class:'explain red'},'Review the Lesson tab and simulation for this topic, then try again.'));
    if(wrong.length){const d=h('details',{class:'fold',open:true},h('summary',{},`Review missed questions (${wrong.length})`));
      wrong.forEach(q=>d.append(h('div',{class:'fb'},h('b',{},q.q),h('div',{},'Answer: '+Quiz.answerText(q)),h('div',{class:'sub'},q.e))));wrap.append(d);}
    wrap.append(h('div',{class:'btnrow'},h('button',{class:'btn',onclick:()=>Quiz.run(root,pool,o)},'Try again'),
      o.onDone?null:null));
    if(o.onDone)o.onDone({score,total,pts,pc});
  }
  function next(){
    if(n>=total)return finish();
    const q=choose();if(!q)return finish();
    asked.push(q.id);n++;tStart=Date.now();
    wrap.innerHTML='';
    wrap.append(h('div',{class:'qmeta'},h('b',{},`${o.title}`),`Question ${n}/${total}`,h('span',{class:'chip'},'Module '+q.m+' • '+modById(q.m).t),
      h('span',{class:'chip'},['','Foundational','Applied','Advanced'][q.l]),h('span',{class:'chip'},({mc:'Multiple choice',case:'Case-based',mech:'Mechanism',reason:'Clinical reasoning',match:'Matching',hot:'Hotspot'})[q.t]||'Question')),
      h('div',{class:'bar'},h('i',{style:`width:${Math.round(100*(n-1)/total)}%`})));
    let tbar=null;
    if(o.timed){tbar=h('div',{class:'timer'},h('i'));wrap.append(tbar);let left=o.timed;
      timer=setInterval(()=>{left-=.1;tbar.firstChild.style.width=Math.max(0,100*left/o.timed)+'%';if(left<=0){clearInterval(timer);resolve(false,true);}},100);}
    wrap.append(h('h3',{html:q.q}));
    const fbBox=h('div');const nextRow=h('div',{class:'btnrow'});
    let done=false;
    function resolve(ok,timeout){
      if(done)return;done=true;clearInterval(timer);
      const ms=Date.now()-tStart;
      levelsHit[q.l][1]++;if(ok){score++;levelsHit[q.l][0]++;streak++;
        pts+=o.timed?Math.round(100+Math.max(0,(o.timed*1000-ms)/o.timed/10)+Math.min(streak,5)*20):0;}else{streak=0;wrong.push(q);}
      if(!o.practice)record(q,ok);
      lvl=clamp(lvl+(ok?1:-1)*(o.adaptive?1:0),1,3);
      fbBox.append(h('div',{class:'fb'},h('b',{},ok?'✔ Correct. ':(timeout?'⏱ Time is up. ':'✘ Not quite. ')),h('span',{html:q.e})));
      nextRow.append(h('button',{class:'btn',onclick:next},n>=total?'See results':'Next question →'));
      Narr.speak((ok?'Correct. ':'Incorrect. ')+q.e);
    }
    if(q.t==='match')Quiz.matchUI(wrap,q,resolve);
    else if(q.t==='hot')Quiz.hotUI(wrap,q,resolve);
    else Quiz.mcUI(wrap,q,resolve);
    wrap.append(fbBox,nextRow);
  }
  next();
 },
 answerText(q){if(q.t==='match')return q.pairs.map(p=>p[0]+' → '+p[1]).join('; ');if(q.t==='hot')return Quiz.regionName(q.region);return q.o[q.a];},
 regionName(id){return (typeof REGIONS!=='undefined'&&REGIONS.find(r=>r.id===id)||{n:id}).n;},
 mcUI(wrap,q,resolve){
  const order=shuffle(q.o.map((t,i)=>i));const box=h('div',{role:'group','aria-label':'Answer options'});
  order.forEach((oi,k)=>{const b=h('button',{class:'qopt',onclick:()=>{
      $$('.qopt',box).forEach(x=>x.disabled=true);
      const ok=oi===q.a;b.classList.add(ok?'right':'wrong');
      if(!ok){const ri=order.indexOf(q.a);$$('.qopt',box)[ri].classList.add('right');}
      resolve(ok);}},`${String.fromCharCode(65+k)}.  ${q.o[oi]}`);box.append(b);});
  wrap.append(box);
 },
 matchUI(wrap,q,resolve){
  const rights=shuffle(q.pairs.map(p=>p[1]));const sels=[];
  const tbl=h('div',{});
  q.pairs.forEach((p,i)=>{const sel=h('select',{'aria-label':'Match for '+p[0]},h('option',{value:''},'— choose —'),...rights.map(r=>h('option',{value:r},r)));sels.push(sel);
    tbl.append(h('div',{class:'ctrl'},h('b',{style:'min-width:190px'},p[0]),sel));});
  const btn=h('button',{class:'btn',onclick:()=>{
    if(sels.some(x=>!x.value)){toast('Choose a match for every item.');return;}
    let ok=true;sels.forEach((x,i)=>{const good=x.value===q.pairs[i][1];if(!good)ok=false;x.style.borderColor=good?COL.drug:COL.path;x.disabled=true;});
    btn.disabled=true;resolve(ok);}},'Check matches');
  wrap.append(tbl,btn);
 },
 hotUI(wrap,q,resolve){
  const host=h('div',{class:'stage'});wrap.append(host);
  Viz.hotspot(host,id=>{const ok=id===q.region;resolve(ok);return ok;},q.region);
 }
};

/* =====================================================================

   ===================================================================== */
LESSON[1]={intro:'Mood is regulated by distributed circuits in which prefrontal cortex exerts top-down control over limbic structures, modulated by serotonin, norepinephrine, dopamine, glutamate and GABA.',narr:'Normal mood regulation depends on balance. The prefrontal cortex restrains the amygdala, the hippocampus provides context and feedback to the stress axis, and brainstem nuclei supply serotonin, norepinephrine and dopamine.',
 obj:['Name the key cortical, limbic, hypothalamic and brainstem structures involved in mood regulation.','Describe the origin and projection targets of serotonergic, noradrenergic and dopaminergic systems.','Explain the roles of glutamate and GABA in excitation–inhibition balance.','Predict the consequence of perturbing one transmitter system.'],
 sections:[{h:'Circuits',p:'<b>Prefrontal cortex (PFC)</b> integrates emotion and cognition and inhibits the <b>amygdala</b>. The <b>hippocampus</b> encodes context and restrains the HPA axis through glucocorticoid receptors. The <b>hypothalamus</b> controls the stress axis, sleep and appetite. The <b>nucleus accumbens</b> (ventral striatum) with dopaminergic input from the <b>VTA</b> forms the reward circuit.'},
  {h:'Neurotransmitter systems',p:'<ul class="tight"><li><b>Serotonin</b> — dorsal/median raphe → cortex, limbic system. Mood, sleep, appetite, impulsivity.</li><li><b>Norepinephrine</b> — locus coeruleus → widespread. Arousal, attention, stress response.</li><li><b>Dopamine</b> — VTA (mesolimbic/mesocortical) and substantia nigra. Reward, motivation.</li><li><b>Glutamate</b> — principal excitatory transmitter (AMPA, NMDA, kainate, mGluR).</li><li><b>GABA</b> — principal inhibitory transmitter (GABA-A ionotropic, GABA-B metabotropic).</li></ul>'}],
 pearls:['Antidepressants do not “add” a missing chemical — they modify signaling, plasticity and network connectivity.'],teach:['Teach with the PFC–amygdala “brake” metaphor.','Have learners predict which symptom appears when each system is turned down.']};
LESSON[2]={intro:'The monoamine hypothesis proposed that depression results from deficient serotonin, norepinephrine and/or dopamine signaling. It explains drug targets but not the delayed onset or all patients.',narr:'The monoamine hypothesis links reduced serotonin, norepinephrine and dopamine to the symptoms of depression.',
 obj:['State the monoamine hypothesis and its supporting evidence (reserpine, MAOIs, tricyclics).','Link each monoamine to characteristic symptoms.','Describe synaptic release, receptor binding, reuptake and metabolism.','Identify the limitations of the hypothesis.'],
 sections:[{h:'Symptom mapping',p:'<ul class="tight"><li>↓5-HT: depressed mood, anxiety, sleep and appetite disturbance, irritability.</li><li>↓NE: fatigue, poor concentration, psychomotor retardation.</li><li>↓DA: anhedonia, low motivation, impaired reward learning.</li></ul>'},
  {h:'Limitations',p:'Acute monoamine elevation (hours) precedes clinical benefit by weeks; tryptophan depletion lowers mood mainly in remitted patients; ~30–40% fail first-line therapy; rapid agents act through glutamate.'}],
 pearls:['Reserpine (VMAT inhibitor) depletes monoamines and can induce depression-like states — historical support for the hypothesis.'],teach:['Show that blocking reuptake changes synaptic concentration immediately yet symptoms improve later — motivates Module 3.']};
LESSON[3]={intro:'Modern models integrate stress, inflammation, neurotransmitter changes, reduced BDNF and impaired neuroplasticity.',narr:'The modern model of depression begins with stress and inflammation, alters neurotransmitters, lowers BDNF and impairs neuroplasticity.',
 obj:['Sequence the integrated stress–inflammation–plasticity pathway.','Explain the kynurenine pathway and glutamate excitotoxicity.','Identify where monoamine drugs, ketamine and psychotherapy act.'],
 sections:[{h:'Pathway',p:'Chronic stress → HPA activation and cytokines (IL-6, TNF-α, CRP) → microglial activation, kynurenine shunt (↓5-HT synthesis, ↑quinolinic acid, NMDA agonist) → ↑extrasynaptic glutamate, ↓BDNF/mTOR → dendritic atrophy and synaptic loss → network dysfunction.'},
  {h:'Heterogeneity',p:'Inflammatory depression (high CRP) may respond differently to treatment and show prominent anhedonia, fatigue and metabolic features.'}],
 pearls:['Neuroplasticity is the common downstream target of effective antidepressant treatments.'],teach:['Draw a causal cascade and add drugs at each step.']};
LESSON[4]={intro:'The HPA axis couples perceived stress to cortisol release. In depression, glucocorticoid-receptor negative feedback is impaired, producing hypercortisolemia.',narr:'The hypothalamus releases CRH, the pituitary releases ACTH, and the adrenal cortex releases cortisol. Chronic stress impairs feedback.',
 obj:['Trace the HPA axis hormonal sequence.','Explain negative feedback by glucocorticoid receptors.','Describe consequences of chronic hypercortisolemia for the hippocampus and mood.','Interpret the dexamethasone suppression test conceptually.'],
 sections:[{h:'Axis',p:'Stress → PVN (hypothalamus) → CRH (+ vasopressin) → anterior pituitary → ACTH → adrenal cortex (zona fasciculata) → cortisol → negative feedback via GR/MR in hippocampus, PFC, hypothalamus and pituitary.'},{h:'Dysfunction',p:'About half of patients with melancholic or psychotic depression show non-suppression on dexamethasone testing, elevated CSF CRH and enlarged adrenal glands. Cortisol reduces BDNF, dendritic arborization and neurogenesis.'}],
 pearls:['Cushing syndrome and exogenous corticosteroids can cause depression, mania or psychosis — consider in the differential.'],teach:['Link to Module 5: cortisol ↓BDNF.']};
LESSON[5]={intro:'BDNF supports neuronal survival, dendritic growth and synaptic plasticity via TrkB signaling. Stress lowers BDNF; effective treatments raise it.',narr:'Lower BDNF leads to dendritic spine loss and fewer synapses. Treatment increases BDNF and restores neuroplasticity.',
 obj:['Describe BDNF–TrkB–mTOR signaling.','Explain spine loss and hippocampal volume reduction in depression.','Compare timelines of SSRIs, ketamine and ECT for plasticity recovery.'],
 sections:[{h:'Mechanism',p:'BDNF binds TrkB → PI3K–Akt, MAPK/ERK, PLCγ pathways → CREB-driven transcription and mTORC1-dependent synthesis of synaptic proteins (PSD-95, GluA1, synapsin). Stress, glucocorticoids and inflammation suppress BDNF; exercise, antidepressants, ECT and ketamine increase it.'},{h:'Val66Met',p:'The BDNF Val66Met polymorphism reduces activity-dependent secretion and is associated with altered stress sensitivity and hippocampal volume.'}],
 pearls:['Peripheral serum BDNF is lower in depression and normalizes with effective treatment, but is not a clinical biomarker.'],teach:['Use the neuron-regrowth simulator to show reversibility.']};
LESSON[6]={intro:'The mesolimbic dopamine pathway (VTA → nucleus accumbens → PFC) mediates reward and motivation. Reduced dopamine signaling produces anhedonia and motivational deficits.',narr:'Dopamine neurons in the ventral tegmental area project to the nucleus accumbens and prefrontal cortex. Reduced signaling causes anhedonia.',
 obj:['Describe the reward circuit and dopamine’s role in “wanting” and learning.','Explain anhedonia and effort-related motivational deficits.','Identify treatments that target dopaminergic signaling.'],
 sections:[{h:'Circuit',p:'VTA dopamine neurons fire in bursts to unexpected rewards (reward-prediction error). Dopamine in the nucleus accumbens drives motivation and reinforcement; PFC evaluates value and goal-directed behavior.'},{h:'In depression',p:'Blunted ventral striatal response, reduced effort expenditure, and impaired reinforcement learning. Treatments: bupropion, pramipexole (adjunct, off-label), stimulants (off-label), cariprazine (D3), behavioral activation.'}],
 pearls:['SSRIs may blunt reward sensitivity (“emotional blunting”) in some patients; consider switching to or adding bupropion or vortioxetine.'],teach:['Distinguish anhedonia (loss of pleasure) from amotivation (loss of drive).']};
LESSON[7]={intro:'Bipolar disorder is a highly heritable illness of mood episodes spanning depression, hypomania, mania and mixed features, with circadian, dopaminergic and glutamatergic dysregulation.',narr:'Bipolar disorder spans major depression, euthymia, hypomania and mania, with mixed states in between.',
 obj:['Differentiate bipolar I, bipolar II and cyclothymia.','Characterize depression, hypomania, mania and mixed features.','Describe heritability and implicated neurobiology.','Explain why antidepressant monotherapy is hazardous.'],
 sections:[{h:'Definitions',p:'<b>Mania</b>: ≥1 week elevated/irritable mood with ↑energy and ≥3 symptoms (grandiosity, ↓sleep need, pressured speech, flight of ideas, distractibility, ↑goal activity, risky behavior), marked impairment, or hospitalization. <b>Hypomania</b>: ≥4 days, observable change, no marked impairment, no psychosis. <b>Mixed features</b> specifier: ≥3 opposite-pole symptoms.'},{h:'Neurobiology',p:'Heritability ≈ 70–80%. Reduced PFC inhibition of limbic regions, ↑dopaminergic reward drive, glutamatergic hyperexcitability, mitochondrial dysfunction, circadian instability, inflammation.'}],
 pearls:['Always screen for mania/hypomania before starting an antidepressant (family history, prior episodes, MDQ).'],teach:['Use the slider to show monotonic changes in dopamine and sleep need along the spectrum.']};
LESSON[8]={intro:'Mania reflects increased dopamine and glutamate signaling, circadian dysfunction and network hyperexcitability, producing grandiosity, pressured speech, decreased need for sleep, risk-taking and impulsivity.',narr:'Mania involves increased dopamine and glutamate, circadian dysfunction and hyperexcitable networks.',
 obj:['List mechanisms underlying mania.','Link mechanisms to symptoms.','Explain why sleep deprivation precipitates mania.','Match antimanic mechanisms with drug classes.'],
 sections:[{h:'Mechanisms',p:'↑Dopamine (reward drive, psychosis; amphetamines and levodopa can induce mania); ↑glutamate/↓GABA (excitation–inhibition imbalance); circadian rhythm disruption (clock genes, sleep loss); impaired PFC–amygdala control; ↑intracellular signaling (PKC, GSK-3).'},{h:'Treatment link',p:'D2 antagonists/partial agonists reduce dopaminergic drive; lithium and valproate dampen glutamatergic/PKC signaling and enhance GABA; sleep restoration is therapeutic.'}],
 warns:['Antidepressants, stimulants, corticosteroids and sleep loss can precipitate mania.'],pearls:['Decreased need for sleep (feeling rested after 3 hours) distinguishes mania from insomnia in depression.'],teach:['Connect network model to antimanic drug classes.']};
LESSON[9]={intro:'Excitation–inhibition balance depends on glutamate (AMPA, NMDA) and GABA (GABA-A). Mania tilts toward excitation; depression shows reduced AMPA-mediated synaptic strength with NMDA/GABA deficits.',narr:'Normal brain function requires a balance between glutamate-driven excitation and GABA-mediated inhibition.',
 obj:['Describe NMDA, AMPA and GABA-A receptors.','Contrast E/I balance in health, mania and depression.','Explain how ketamine, lamotrigine, valproate and neurosteroids modulate this balance.'],
 sections:[{h:'Receptors',p:'<b>AMPA</b>: fast Na⁺ influx; trafficking sets synaptic strength. <b>NMDA</b>: Mg²⁺ block removed with depolarization, Ca²⁺ entry, triggers LTP/LTD. <b>GABA-A</b>: Cl⁻ channel; benzodiazepines, neurosteroids (zuranolone) and barbiturates are positive allosteric modulators.'},{h:'Disease models',p:'MDD: reduced GABA levels (cortical), somatostatin-interneuron deficits, ↑extrasynaptic NMDA, synapse loss. Mania: ↑glutamate (Glx on MRS), ↓GABA. Treatments restore balance.'}],
 pearls:['Ketamine produces a transient glutamate burst, but its therapeutic effect relies on AMPA receptor activation and downstream mTOR signaling.'],teach:['Have learners predict E/I direction before revealing each state.']};
LESSON[10]={intro:'SSRIs selectively inhibit the serotonin transporter (SERT). Effect is delayed because autoreceptor desensitization and plasticity changes take weeks.',narr:'SSRIs block the serotonin transporter, increasing synaptic serotonin. Clinical benefit appears over weeks.',
 obj:['Describe SSRI mechanism and delayed onset.','Compare pharmacokinetics and interactions of fluoxetine, sertraline, escitalopram, paroxetine and citalopram.','Recognize adverse effects, serotonin syndrome and discontinuation syndrome.'],
 sections:[{h:'Pharmacology',p:'<ul class="tight"><li><b>Fluoxetine</b>: long t½ (norfluoxetine), CYP2D6 and 2C19 inhibitor; activating.</li><li><b>Sertraline</b>: GI effects; mild DAT activity; safe in cardiac disease and lactation.</li><li><b>Escitalopram</b>: most selective; QTc dose-dependent.</li><li><b>Paroxetine</b>: anticholinergic, weight gain, worst discontinuation; CYP2D6 inhibitor.</li><li><b>Citalopram</b>: QTc—max 40 mg (20 mg >60 y).</li></ul>'},{h:'Timeline',p:'Day 1: SERT blockade, autoreceptor brake. Week 2: partial desensitization. Week 4: robust response in many. Week 8: full effect/remission.'}],
 warns:['Boxed warning for suicidal thoughts in patients <25 years: monitor closely early in treatment.'],pearls:['Switching from fluoxetine to an MAOI requires 5 weeks washout.'],teach:['Pair the autoreceptor desensitization slider with the clinical-response curve.']};
LESSON[11]={intro:'SNRIs inhibit both SERT and NET. Duloxetine is balanced; venlafaxine is serotonergic at low doses with NET effects at higher doses; levomilnacipran is NET-preferring.',narr:'Serotonin norepinephrine reuptake inhibitors block both SERT and NET.',
 obj:['Contrast SERT:NET selectivity across SNRIs.','Explain dose-dependent NET inhibition of venlafaxine.','List SNRI-specific adverse effects and monitoring.'],
 sections:[{h:'Profiles',p:'<ul class="tight"><li><b>Venlafaxine</b>: SERT (low dose), NET (≥150 mg). BP rise, discontinuation syndrome.</li><li><b>Desvenlafaxine</b>: renally cleared, minimal CYP.</li><li><b>Duloxetine</b>: pain indications; hepatotoxicity caution.</li><li><b>Levomilnacipran</b>: ↑HR/BP, urinary hesitancy.</li></ul>'}],
 pearls:['Venlafaxine is generally the most effective SNRI at high doses but carries highest BP and discontinuation burden.'],teach:['Use the dose slider to show emergence of NET occupancy.']};
LESSON[12]={intro:'Atypical antidepressants act through diverse mechanisms: NDRI (bupropion), α2/5-HT2/H1 antagonism (mirtazapine), SARI (trazodone), SPARI (vilazodone) and multimodal serotonin modulation (vortioxetine).',narr:'Atypical antidepressants have distinct mechanisms and side-effect profiles.',
 obj:['Describe the mechanism of each atypical antidepressant.','Match drugs to patient characteristics.','Identify key safety issues.'],
 sections:[{h:'Selection by patient factor',p:'Bupropion: sexual dysfunction, weight, smoking, fatigue. Mirtazapine: insomnia, poor appetite, anxiety. Trazodone: adjunct hypnotic. Vilazodone/vortioxetine: lower sexual dysfunction; vortioxetine with cognitive symptoms.'}],
 warns:['Bupropion lowers seizure threshold; contraindicated in seizure disorder, bulimia/anorexia and abrupt sedative/alcohol withdrawal.'],pearls:['Mirtazapine causes more sedation at low doses because H1 blockade is not offset by noradrenergic effects.'],teach:['Use presets to demonstrate each mechanism in the same synapse.']};
LESSON[13]={intro:'TCAs inhibit SERT and NET with additional antihistaminic, anticholinergic and α1 effects; MAOIs irreversibly block MAO, raising monoamine stores.',narr:'Tricyclic antidepressants block reuptake, while MAO inhibitors prevent monoamine breakdown.',
 obj:['Describe TCA and MAOI mechanisms.','Explain tyramine reaction and serotonin syndrome.','Specify washout periods.','Describe TCA toxicity and management.'],
 sections:[{h:'Metabolism',p:'Tyrosine → L-DOPA → dopamine → norepinephrine; tryptophan → 5-HTP → serotonin. MAO-A: 5-HT, NE, tyramine; MAO-B: DA, phenylethylamine. Phenelzine, tranylcypromine and isocarboxazid inhibit both irreversibly; selegiline patch is MAO-B-selective at low dose.'}],
 warns:['MAOI + SSRI/SNRI/TCA/meperidine/dextromethorphan/linezolid → serotonin syndrome. MAOI + tyramine/sympathomimetics → hypertensive crisis. TCA overdose → QRS widening, seizures, arrhythmias (sodium bicarbonate).'],pearls:['Tranylcypromine has stimulant-like properties and the highest hypertensive risk; MAOIs are effective in atypical depression and TRD.'],teach:['Walk through MAOI diet and washout rules.']};
LESSON[14]={intro:'Ketamine and esketamine block NMDA receptors, triggering a glutamate surge, AMPA activation, BDNF release and rapid synaptogenesis — antidepressant effects within hours.',narr:'Esketamine blocks NMDA receptors, causing a glutamate surge and AMPA activation that increases BDNF and rapidly restores synapses.',
 obj:['Sequence the ketamine mechanism.','Compare onset with traditional antidepressants.','Describe esketamine REMS and monitoring.'],
 sections:[{h:'Clinical use',p:'Esketamine (Spravato) nasal: induction twice weekly × 4 weeks, weekly weeks 5–8, then weekly or every 2 weeks. Indicated for TRD and MDD with acute suicidal ideation/behavior (with oral antidepressant); monotherapy for TRD was approved in 2025. IV racemic ketamine is off-label.'}],
 warns:['Dissociation, ↑BP, sedation; abuse/misuse risk; observe ≥2 hours; no driving until the next day.'],pearls:['Effects may wane within 1–2 weeks without maintenance dosing.'],teach:['Emphasize that downstream AMPA/mTOR—not NMDA blockade per se—mediates antidepressant effect.']};
LESSON[15]={intro:'Lithium is the prototype mood stabilizer: GSK-3β and inositol monophosphatase inhibition, neuroprotection, circadian regulation and unique anti-suicide effect.',narr:'Lithium inhibits GSK-3 and inositol monophosphatase, promotes neuroprotection, and stabilizes circadian rhythms.',
 obj:['Describe lithium’s molecular targets.','State therapeutic range and toxicity signs.','Identify monitoring parameters and interacting drugs.','Counsel on pregnancy and discontinuation.'],
 sections:[{h:'Monitoring',p:'Level (12 h post-dose): acute 0.8–1.2, maintenance 0.6–1.0 mEq/L. Baseline and periodic: creatinine/eGFR, electrolytes, calcium, TSH, ECG if >40 or cardiac disease, pregnancy test, weight.'}],
 warns:['Narrow therapeutic index; NSAIDs, ACE inhibitors, ARBs, thiazides, dehydration and sodium depletion raise levels. Severe toxicity (levels >2.5 or neurologic signs) requires hemodialysis.'],pearls:['Lithium is the only mood stabilizer with strong evidence for reducing suicide.'],teach:['Use the lithium slider to illustrate narrow therapeutic index.']};
LESSON[16]={intro:'Mood stabilizers include lithium, valproate, lamotrigine and carbamazepine. They differ in polarity of efficacy, safety and interactions.',narr:'Mood stabilizers prevent episodes of mania and depression through ion-channel, GABAergic and intracellular mechanisms.',
 obj:['Contrast mechanisms and polarity of efficacy.','Describe key toxicities and drug interactions.','Select maintenance therapy based on polarity and patient factors.'],
 sections:[{h:'Key points',p:'<ul class="tight"><li><b>Valproate</b>: ↑GABA, Na⁺ block; hepatotoxicity, pancreatitis, teratogenic; ↓levels of lamotrigine clearance (↑lamotrigine).</li><li><b>Lamotrigine</b>: depressive-pole prevention; SJS risk; valproate doubles its level.</li><li><b>Carbamazepine</b>: CYP inducer; HLA-B*1502; hyponatremia; aplastic anemia.</li></ul>'}],
 warns:['Valproate: avoid in women of childbearing potential unless no alternative; folic acid and contraception.'],pearls:['Lamotrigine dose must be reduced by 50% with valproate and doubled with carbamazepine or estrogen-containing contraceptives.'],teach:['Use relapse simulator to compare polarity coverage.']};
LESSON[17]={intro:'Second-generation antipsychotics treat acute mania, bipolar depression and maintenance through D2 antagonism/partial agonism plus 5-HT2A antagonism and 5-HT1A partial agonism.',narr:'Atypical antipsychotics act on dopamine D2 and serotonin 5-HT2A and 5-HT1A receptors.',
 obj:['Describe the receptor profile of each agent.','Link receptors to efficacy and adverse effects.','Choose an agent by metabolic and motor risk.'],
 sections:[{h:'Key agents',p:'<ul class="tight"><li><b>Quetiapine</b>: bipolar depression/mania; sedating.</li><li><b>Olanzapine</b>: robust antimanic; major metabolic liability.</li><li><b>Lurasidone</b>: bipolar depression; with food; akathisia.</li><li><b>Cariprazine</b>: D3-preferring; mania and depression.</li><li><b>Aripiprazole</b>: mania/maintenance; akathisia.</li><li><b>Risperidone</b>: mania; prolactin elevation.</li></ul>'}],
 warns:['Boxed warning: increased mortality in elderly patients with dementia-related psychosis.'],pearls:['D2 occupancy >80% increases EPS risk; partial agonists produce akathisia rather than parkinsonism.'],teach:['Use the receptor lab to build structure–activity reasoning.']};
LESSON[18]={intro:'Adverse effects drive nonadherence and morbidity. Monitoring strategies differ across antidepressants, mood stabilizers and antipsychotics.',narr:'Adverse effects of psychotropic medications require structured monitoring.',
 obj:['Identify major adverse effects for each class.','Create monitoring plans.','Recognize and manage serotonin syndrome.'],
 sections:[{h:'Monitoring essentials',p:'Antidepressants: suicidality, sodium, BP (SNRI), sexual function. Lithium: level, eGFR, TSH, calcium. Valproate: LFTs, platelets, level, weight. Carbamazepine: CBC, sodium, LFTs. Lamotrigine: rash. SGAs: weight, waist, BP, glucose/A1c, lipids at baseline, 4, 8, 12 weeks then annually.'}],
 warns:['Serotonin syndrome: clonus, hyperreflexia, agitation, diaphoresis, hyperthermia — stop agents, supportive care, benzodiazepines, cyproheptadine.'],pearls:['Switching from a high-liability to a low-liability SGA is an effective strategy for metabolic complications.'],teach:['Use the serotonin syndrome simulator to build risk assessment.']};
LESSON[19]={intro:'Seven patient cases integrate pathophysiology and pharmacology into treatment decisions with immediate feedback.',narr:'Work through seven patient cases and choose evidence-based therapy.',
 obj:['Select first-line treatment for MDD, bipolar depression and mania.','Manage treatment resistance and suicidality.','Optimize maintenance therapy and rapid cycling.'],
 sections:[{h:'Approach',p:'Define diagnosis and polarity → assess risk (suicidality, psychosis, pregnancy, comorbidity) → choose evidence-based agent → plan monitoring and follow-up → reassess at 2–4 weeks.'}],
 pearls:['Measurement-based care (PHQ-9, MADRS, YMRS) improves outcomes.'],teach:['Let learners commit to a choice before reading feedback.']};
LESSON[20]={intro:'The decision lab adapts treatment to age, comorbidity, pregnancy, and renal/hepatic dysfunction.',narr:'Adjust the patient profile to see how treatment recommendations adapt.',
 obj:['Adapt first-line therapy to special populations.','Apply organ-function dosing principles.','Justify drug avoidance in pregnancy and organ impairment.'],
 sections:[{h:'Principles',p:'Renal clearance: lithium, desvenlafaxine, levomilnacipran, venlafaxine metabolites. Hepatic metabolism/toxicity: duloxetine, valproate, carbamazepine, most antidepressants. Pregnancy: avoid valproate/carbamazepine, paroxetine; prefer sertraline/escitalopram, lamotrigine.'}],
 pearls:['When in doubt in pregnancy: balance relapse risk, use monotherapy at lowest effective dose, and involve perinatal psychiatry.'],teach:['Have learners change one variable at a time.']};

const Q=(m,l,t,q,right,wrong,e)=>{QB.push({id:'m'+m+'q'+(_qid[m]=(_qid[m]||0)+1),m,l,t,q,o:[right,...wrong],a:0,e});};

/* ---------- Module 1: Normal mood regulation ---------- */
Q(1,1,'mc','Which brain region is the principal source of serotonergic projections to the forebrain?','Raphe nuclei',['Locus coeruleus','Ventral tegmental area','Nucleus accumbens'],'The dorsal and median raphe nuclei of the brainstem supply serotonin to cortex and limbic regions.');
Q(1,1,'mc','The locus coeruleus is the main source of which neurotransmitter?','Norepinephrine',['Serotonin','Dopamine','GABA'],'The locus coeruleus is the primary noradrenergic nucleus, regulating arousal and vigilance.');
Q(1,1,'mc','Dopamine neurons projecting to the nucleus accumbens originate in the:','Ventral tegmental area',['Raphe nuclei','Locus coeruleus','Hippocampus'],'The mesolimbic pathway runs from VTA to nucleus accumbens.');
Q(1,1,'mc','The principal excitatory neurotransmitter in the brain is:','Glutamate',['GABA','Serotonin','Dopamine'],'Glutamate acts on AMPA, NMDA, kainate and metabotropic receptors.');
Q(1,1,'mc','The principal inhibitory neurotransmitter in the brain is:','GABA',['Glutamate','Norepinephrine','Acetylcholine'],'GABA acts at GABA-A (Cl⁻ channel) and GABA-B (GPCR) receptors.');
Q(1,1,'mc','Which structure integrates executive control and exerts top-down regulation of the amygdala?','Prefrontal cortex',['Hypothalamus','Locus coeruleus','Pituitary'],'PFC–amygdala coupling is central to emotion regulation.');
Q(1,2,'mc','Which region detects emotional salience and threat?','Amygdala',['Hippocampus','Nucleus accumbens','Raphe nuclei'],'The amygdala encodes emotional salience; hyperreactivity is seen in depression and anxiety.');
Q(1,2,'mc','Which structure provides negative feedback to the HPA axis through dense glucocorticoid receptors?','Hippocampus',['Nucleus accumbens','Amygdala','Raphe nuclei'],'Hippocampal GR/MR mediate feedback inhibition of CRH and ACTH.');
Q(1,2,'mech','Healthy mood regulation chiefly depends on:','Balance among interacting circuits and neurotransmitter systems',['A single optimal serotonin level','Maximal dopamine activity in all regions','Complete suppression of amygdala activity'],'Mood arises from distributed network balance; no single transmitter determines mood.');
Q(1,2,'mech','Which neurotransmitter system most directly mediates reward prediction and motivation?','Mesolimbic dopamine',['Raphe serotonin','Cerebellar GABA','Hypothalamic CRH'],'Phasic dopamine release in the nucleus accumbens signals reward prediction error.');
Q(1,2,'mech','Which transmitter acts at ionotropic receptors that conduct Cl⁻ and hyperpolarize neurons?','GABA (GABA-A)',['Glutamate (AMPA)','Serotonin (5-HT1A)','Norepinephrine (β1)'],'GABA-A is a ligand-gated Cl⁻ channel mediating fast inhibition.');
Q(1,3,'reason','A patient with normal amygdala reactivity but reduced PFC activity during an emotional task would be expected to show:','Reduced top-down regulation of emotional responses',['Enhanced working memory','Improved fear extinction','Increased dopamine release in the VTA'],'PFC hypoactivity reduces inhibitory control over limbic structures.');

/* ---------- Module 2: Monoamine hypothesis ---------- */

Q(2,3,'case','A 40-year-old reports low energy, no pleasure, poor motivation, but sleeps normally and feels no sadness. Which monoaminergic deficit is most consistent?','Dopamine and norepinephrine',['Serotonin only','GABA only','Cortisol'],'Anhedonia/amotivation and fatigue suggest DA/NE-related symptoms.');

Q(2,3,'reason','The best summary of the monoamine hypothesis today is:','Monoamines are an upstream entry point to network and plasticity changes, not a complete explanation',['Depression is solely low serotonin','Monoamines are irrelevant','Only dopamine matters'],'Modern models integrate monoamines with stress, inflammation and plasticity.');
