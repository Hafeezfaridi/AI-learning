<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autonomic Nervous System Pathophysiology &amp; Pharmacology Simulator</title>
<meta name="description" content="Interactive ANS physiology, pathophysiology, pharmacology and NAPLEX-style practice by Hafeez Faridi, PhD.">
<style>
:root{
  --bg1:#070b1a;--bg2:#0e1633;--bg3:#1a1245;
  --glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.12);--stroke:rgba(255,255,255,.16);
  --tx:#eef2ff;--tx2:#b4bfdc;--tx3:#8591b3;
  --sns:#ff9f43;--pns:#3fa9ff;--ach:#c77dff;--ne:#ff7a59;--ok:#3ddc97;--bad:#ff5d73;--warn:#ffd166;--acc:#7c9cff;
  --shadow:0 10px 40px rgba(0,0,0,.45);--r:18px;
}
[data-theme="light"]{
  --bg1:#eef2fb;--bg2:#e3eaf9;--bg3:#d8e0f7;
  --glass:rgba(255,255,255,.72);--glass2:rgba(255,255,255,.9);--stroke:rgba(40,60,120,.18);
  --tx:#101935;--tx2:#38466e;--tx3:#5b6890;
  --sns:#c2570a;--pns:#0b6fc2;--ach:#7a2fc0;--ne:#c23b17;--ok:#0f8a57;--bad:#c4233c;--warn:#9a6a00;--acc:#2b4fd8;
  --shadow:0 10px 30px rgba(30,50,110,.15);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--tx);line-height:1.55;
  background:radial-gradient(1200px 700px at 10% -10%,var(--bg3),transparent 60%),radial-gradient(900px 600px at 100% 0%,#1b3a6b55,transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;min-height:100vh}
.skip{position:absolute;left:-999px;top:8px;background:var(--acc);color:#fff;padding:8px 14px;border-radius:8px;z-index:999}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px;border-radius:6px}
header.top{position:sticky;top:0;z-index:50;backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);background:var(--glass);border-bottom:1px solid var(--stroke)}
.top-in{max-width:1280px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto}
.brand b{font-size:clamp(.9rem,2.2vw,1.15rem);letter-spacing:.02em}
.brand span{font-size:.72rem;color:var(--tx2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--glass2);border:1px solid var(--stroke);font-size:.8rem;color:var(--tx)}
.btn{cursor:pointer;border:1px solid var(--stroke);background:var(--glass2);color:var(--tx);padding:9px 16px;border-radius:12px;font:inherit;font-weight:600;transition:transform .15s,background .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.btn.pri{background:linear-gradient(135deg,var(--acc),#a66bff);color:#fff;border:none}
.btn.sm{padding:5px 10px;font-size:.8rem;border-radius:9px}
.btn[aria-pressed="true"],.btn.on{background:var(--acc);color:#fff}
.xpbar{width:120px;height:8px;border-radius:9px;background:var(--glass2);overflow:hidden;border:1px solid var(--stroke)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--acc));transition:width .6s}
nav.tabs{max-width:1280px;margin:auto;padding:0 12px 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--tx2);padding:8px 13px;border-radius:11px;font:inherit;font-size:.85rem;font-weight:600;white-space:nowrap;transition:all .2s}
nav.tabs button:hover{background:var(--glass);color:var(--tx)}
nav.tabs button[aria-selected="true"]{background:var(--glass2);color:var(--tx);border-color:var(--stroke);box-shadow:inset 0 -3px 0 var(--acc)}
nav.tabs button .done{color:var(--ok);margin-left:4px}
main{max-width:1280px;margin:auto;padding:20px 16px 80px}
.view{animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3,h4{line-height:1.2;margin:.2em 0 .5em}
h1{font-size:clamp(1.5rem,4vw,2.3rem)}h2{font-size:clamp(1.2rem,2.8vw,1.6rem)}h3{font-size:1.1rem}
.card{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin-bottom:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.muted{color:var(--tx2)}.small{font-size:.85rem}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;border:1px solid var(--stroke);background:var(--glass2)}
.t-sns{color:var(--sns)}.t-pns{color:var(--pns)}.t-ach{color:var(--ach)}.t-ne{color:var(--ne)}.t-ok{color:var(--ok)}.t-bad{color:var(--bad)}.t-warn{color:var(--warn)}
.hero{display:grid;gap:20px;grid-template-columns:1.2fr 1fr;align-items:center}
@media(max-width:860px){.hero{grid-template-columns:1fr}}
.tilecard{cursor:pointer;text-align:left;color:inherit;font:inherit;transition:transform .2s,border-color .2s}
.tilecard:hover{transform:translateY(-3px);border-color:var(--acc)}
/* edu panel */
.edu{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));margin:16px 0}
.edu>div{border-radius:14px;padding:12px 14px;border:1px solid var(--stroke);background:var(--glass);font-size:.9rem}
.edu h4{margin:0 0 6px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
.edu ul{margin:0;padding-left:18px}.edu li{margin:3px 0}
.e-obj{border-left:4px solid var(--acc)!important}.e-obj h4{color:var(--acc)}
.e-clin{border-left:4px solid var(--ok)!important}.e-clin h4{color:var(--ok)}
.e-board{border-left:4px solid var(--ach)!important}.e-board h4{color:var(--ach)}
.e-nap{border-left:4px solid var(--warn)!important}.e-nap h4{color:var(--warn)}
.e-pit{border-left:4px solid var(--bad)!important}.e-pit h4{color:var(--bad)}
.e-mem{border-left:4px solid var(--pns)!important}.e-mem h4{color:var(--pns)}
/* tables */
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--stroke)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--stroke);vertical-align:top}
th{background:var(--glass2);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--glass)}
/* controls */
label.sl{display:block;font-size:.85rem;font-weight:600;margin:10px 0 2px}
input[type=range]{width:100%;accent-color:var(--acc);height:28px}
select{background:var(--glass2);color:var(--tx);border:1px solid var(--stroke);border-radius:10px;padding:8px 10px;font:inherit;max-width:100%}
select option{color:#111}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pill{cursor:pointer;border:1px solid var(--stroke);background:var(--glass);color:var(--tx);padding:6px 12px;border-radius:999px;font:inherit;font-size:.84rem;font-weight:600;transition:all .15s}
.pill:hover{background:var(--glass2)}
.pill[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:transparent}
.meter{margin:8px 0}
.meter .ml{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:3px}
.meter .mb{height:12px;border-radius:9px;background:var(--glass2);border:1px solid var(--stroke);overflow:hidden;position:relative}
.meter .mb i{display:block;height:100%;width:50%;background:linear-gradient(90deg,var(--pns),var(--acc));transition:width .5s cubic-bezier(.2,.8,.2,1),background .4s}
.meter .mb:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--tx3);opacity:.6}
.vit{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.vit div{background:var(--glass2);border:1px solid var(--stroke);border-radius:14px;padding:10px;text-align:center}
.vit b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.vit span{font-size:.72rem;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em}
.alert{border-radius:12px;padding:10px 14px;margin:10px 0;border:1px solid var(--stroke);font-size:.92rem}
.alert.bad{background:rgba(255,93,115,.14);border-color:var(--bad)}
.alert.ok{background:rgba(61,220,151,.14);border-color:var(--ok)}
.alert.warn{background:rgba(255,209,102,.14);border-color:var(--warn)}
.alert.info{background:rgba(124,156,255,.14);border-color:var(--acc)}
svg{max-width:100%;height:auto}
.svgbox{background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.05));border:1px solid var(--stroke);border-radius:16px;padding:8px}
[data-theme="light"] .svgbox{background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(220,230,250,.6))}
.svgbox{width:100%}
.svgbox svg{display:block;width:100%;max-height:560px}
.svgtx{fill:var(--tx);font-size:12px;font-family:inherit}
.svgtx2{fill:var(--tx2);font-size:10.5px;font-family:inherit}
.hot{cursor:pointer;transition:filter .2s,transform .2s}
.hot:hover,.hot:focus-visible{filter:drop-shadow(0 0 8px var(--warn))}
.glow{filter:drop-shadow(0 0 10px currentColor)}
@keyframes flow{to{stroke-dashoffset:-40}}
.flowline{stroke-dasharray:6 10;animation:flow 1.2s linear infinite}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.pulse{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(1)}}
.beat{animation:beat var(--bpm,1s) infinite;transform-box:fill-box;transform-origin:center}
.noanim *{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* quiz */
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;margin:6px 0;padding:10px 14px;border-radius:12px;border:1px solid var(--stroke);background:var(--glass);color:var(--tx);font:inherit;transition:all .15s}
.opt:hover{background:var(--glass2)}
.opt .k{font-weight:800;min-width:22px;color:var(--acc)}
.opt.sel{border-color:var(--acc);background:rgba(124,156,255,.2)}
.opt.right{border-color:var(--ok);background:rgba(61,220,151,.18)}
.opt.wrong{border-color:var(--bad);background:rgba(255,93,115,.16)}
.opt.right .k:after{content:" ✓"}.opt.wrong .k:after{content:" ✗"}
.seqitem{display:flex;align-items:center;gap:8px;padding:8px 12px;margin:5px 0;border-radius:11px;border:1px dashed var(--stroke);background:var(--glass);cursor:grab}
.seqitem.drag{opacity:.4}
.prog{height:10px;border-radius:9px;background:var(--glass2);overflow:hidden;border:1px solid var(--stroke)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));transition:width .5s}
.badge{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;border:1px solid var(--stroke);background:var(--glass)}
.badge.lock{opacity:.5;filter:grayscale(.8)}
.badge .ic{font-size:1.8rem;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--glass2);border:2px solid var(--warn)}
.hm{display:grid;gap:4px}
.hm div{padding:8px 6px;border-radius:8px;font-size:.75rem;text-align:center;font-weight:700;color:#fff;border:1px solid rgba(255,255,255,.2)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);z-index:200;padding:12px 20px;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;box-shadow:var(--shadow);transition:transform .4s;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:150}
footer{text-align:center;color:var(--tx3);font-size:.78rem;padding:30px 16px 50px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hc [data-theme]{}
.kbd{font-family:ui-monospace,monospace;border:1px solid var(--stroke);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-size:.8rem;background:var(--glass2)}
details{border:1px solid var(--stroke);border-radius:12px;padding:8px 12px;margin:8px 0;background:var(--glass)}
summary{cursor:pointer;font-weight:700}
.drugcard{border-left:4px solid var(--acc)}
.lvlrow{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;border:1px solid var(--stroke);margin:4px 0;font-size:.86rem}
.lvlrow.cur{background:rgba(124,156,255,.2);border-color:var(--acc)}
.lvlrow.locked{opacity:.5}
.step{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.step .n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.85rem}
.step.act .n{background:var(--ok)}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<canvas id="fx" aria-hidden="true"></canvas>
<header class="top">
  <div class="top-in">
    <div class="brand"><b>Autonomic Nervous System Simulator</b><span>Pathophysiology &amp; Pharmacology · by Hafeez Faridi, PhD</span></div>
    <span class="chip" id="lvlchip" aria-live="polite">Lv 1</span>
    <div class="xpbar" role="progressbar" aria-label="XP to next level" id="xpbarwrap"><i id="xpfill" style="width:0%"></i></div>
    <button class="btn sm" id="btnAnim" aria-pressed="true" title="Toggle animations">Animations: On</button>
    <button class="btn sm" id="btnTheme" aria-label="Toggle dark or light mode">☀ Light</button>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Simulator sections"></nav>
</header>
<main id="main" tabindex="-1"><div id="view" class="view" aria-live="polite"></div></main>
<footer>© Hafeez Faridi, PhD · Educational use only. Not a substitute for clinical judgment or current prescribing information.<br>Keyboard: <span class="kbd">←</span> <span class="kbd">→</span> switch tabs · <span class="kbd">Enter</span> activate · <span class="kbd">Tab</span> move focus</footer>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ===================== CORE ===================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const store={get(){try{return JSON.parse(localStorage.getItem('ansSimV1'))}catch(e){return null}},set(v){try{localStorage.setItem('ansSimV1',JSON.stringify(v))}catch(e){}}};
let S=Object.assign({xp:0,visited:{},time:{},inter:{},flags:{},mastery:{},history:[],badges:{},cases:{},exams:[],theme:'dark',anim:true,daily:{}},store.get()||{});
let saveT=null;function save(){clearTimeout(saveT);saveT=setTimeout(()=>store.set(S),250)}
const TABS=[
 {id:'home',n:'Home'},{id:'sns',n:'SNS Physiology'},{id:'pns',n:'PNS Physiology'},
 {id:'direct',n:'Cholinomimetics Direct Acting'},{id:'indirect',n:'Cholinomimetics Indirect Acting'},
 {id:'anti',n:'Anticholinergics'},{id:'symm',n:'Sympathomimetics'},{id:'symp',n:'Sympatholytics'},
 {id:'organ',n:'Integrated Organ Simulator'},{id:'patho',n:'Clinical Pathophysiology'},
 {id:'naplex',n:'NAPLEX Challenge'},{id:'dash',n:'Progress Dashboard'},{id:'game',n:'Gamification Center'}
];
let cur='home';
const lvlNeed=n=>20*(n-1)*n;               // XP needed to reach level n
const lvlOf=xp=>{let n=1;while(n<20&&xp>=lvlNeed(n+1))n++;return n};
const LVL_TITLES=['Novice','Observer','Apprentice','Student','Scholar','Clinician-in-Training','Practitioner','Skilled','Proficient','Specialist','Advanced','Senior','Expert','Master','Authority','Mentor','Sage','Luminary','Grand Master','Autonomic Legend'];
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2800)}
function addXP(n,why){const before=lvlOf(S.xp);S.xp+=n;const after=lvlOf(S.xp);
  if(after>before){toast('Level up! You reached Level '+after+' — '+LVL_TITLES[after-1]);burst();}
  else if(why)toast('+'+n+' XP · '+why);
  save();hdr();checkBadges&&checkBadges();}
function earn(key,xp,why){if(S.flags[key])return false;S.flags[key]=1;addXP(xp,why);return true}
function act(mod){S.inter[mod]=(S.inter[mod]||0)+1;if(S.inter[mod]<=15)S.xp+=2;
  if(S.inter[mod]===4){addXP(25,'Module engaged — nice work!')}else{save();hdr()}
  checkBadges&&checkBadges();}
function modDone(id){return ['home','dash','game'].includes(id)?!!S.visited[id]:(S.inter[id]||0)>=4}
function recM(topic,ok){const m=S.mastery[topic]||(S.mastery[topic]={c:0,t:0});m.t++;if(ok)m.c++;save()}
function hdr(){const L=lvlOf(S.xp);$('#lvlchip').textContent='Lv '+L+' · '+S.xp+' XP';
  const lo=lvlNeed(L),hi=L<20?lvlNeed(L+1):lo+1;$('#xpfill').style.width=(L>=20?100:clamp((S.xp-lo)/(hi-lo)*100,0,100))+'%';
  $('#xpbarwrap').setAttribute('aria-valuenow',Math.round(L>=20?100:(S.xp-lo)/(hi-lo)*100));
  $$('#tabs button').forEach(b=>{const d=b.querySelector('.done');if(d)d.textContent=modDone(b.dataset.id)?'✓':''});}
/* particle burst */
function burst(){const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;if(!S.anim)return;
  const P=[];for(let i=0;i<110;i++)P.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-2,r:3+Math.random()*4,h:Math.random()*360,l:1});
  (function f(){x.clearRect(0,0,c.width,c.height);let alive=0;P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.l-=.012;if(p.l>0){alive++;x.globalAlpha=p.l;x.fillStyle='hsl('+p.h+',90%,60%)';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}});
    if(alive)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();}
/* injected css */
document.head.appendChild(Object.assign(document.createElement('style'),{textContent:`
.pathway{margin:8px 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pstep{padding:8px 12px;border-radius:12px;border:1px solid var(--stroke);background:var(--glass2);font-size:.84rem;font-weight:600;transition:all .35s}
.pstep.act{background:var(--acc);color:#fff;transform:scale(1.06);box-shadow:0 0 18px var(--acc)}
.parr{color:var(--tx3);font-weight:800}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem;margin:0}.dl dt{font-weight:700;color:var(--tx2)}.dl dd{margin:0}
.bigq{font-size:1.05rem;font-weight:600}
.organ-sel{filter:drop-shadow(0 0 10px var(--warn))}
.symp{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--stroke);background:var(--glass);transition:all .3s;font-size:.88rem}
.symp .dot{width:12px;height:12px;border-radius:50%;background:var(--tx3);flex:0 0 12px;transition:all .3s}
.symp.on{border-color:var(--bad);background:rgba(255,93,115,.16)}.symp.on .dot{background:var(--bad);box-shadow:0 0 12px var(--bad)}
.symp.mid{border-color:var(--warn);background:rgba(255,209,102,.12)}.symp.mid .dot{background:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--stroke);border-radius:11px;overflow:hidden}
.seg button{border:none;background:var(--glass);color:var(--tx);padding:7px 13px;font:inherit;font-size:.84rem;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--acc);color:#fff}
.hl{background:linear-gradient(transparent 60%,rgba(255,209,102,.35) 60%)}
`}));
/* ---------- helpers ---------- */
function edu(o){const L=(c,t,a)=>a&&a.length?`<div class="${c}"><h4>${t}</h4><ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:'';
  return `<section class="edu" aria-label="Educational highlights">${L('e-obj','Learning objectives',o.obj)}${L('e-clin','Clinical pearls',o.clin)}${L('e-board','Board pearls',o.board)}${L('e-nap','High-yield NAPLEX facts',o.nap)}${L('e-pit','Pitfalls',o.pit)}${L('e-mem','Memory tricks',o.mem)}</section>`}
function tbl(head,rows,cap){return `<div class="tw" role="region" aria-label="${cap||'Table'}" tabindex="0"><table>${cap?`<caption class="sr">${cap}</caption>`:''}<thead><tr>${head.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>i===0?`<th scope="row" style="position:static;background:none;text-transform:none;letter-spacing:0;font-size:.86rem">${c}</th>`:`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}

    const st=C.steps[step];answered=false;

    $$('.opt',box).forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const o=st.o[+b.dataset.i];
      $$('.opt',box).forEach((x,i)=>{x.disabled=true;if(st.o[i].ok)x.classList.add('right')});if(!o.ok)b.classList.add('wrong');
      if(o.ok)score++;recM('Cases',!!o.ok);recM(C.topic||'Cases',!!o.ok);

  }

}

MODS.direct=function(r){

  edu({obj:['Explain how direct agonists activate M2/M3 receptors','Match each drug to its indication and contraindications','Predict organ effects as dose rises','Recognize cholinergic toxicity and its antidote'],
   clin:['Contraindications mirror muscarinic effects: asthma (bronchospasm), obstruction (↑ pressure), bradycardia/AV block, PUD, hyperthyroidism (AF risk).','Pilocarpine produces the most sweating/salivation; bethanechol is the “bladder and bowel” agent.'],
   board:['Bethanechol and carbachol resist AChE; ACh and methacholine are hydrolyzed (methacholine slowly).','Methacholine challenge: ≥20% FEV1 drop = airway hyperreactivity.'],
   nap:['Atropine reverses muscarinic toxicity from all direct agonists.','Bethanechol is contraindicated in mechanical urinary obstruction (BPH retention due to obstruction should be treated by relieving obstruction).'],
   pit:['Do not give bethanechol to a patient with obstruction: it can rupture/strain the bladder or bowel.','Pilocarpine is a tertiary amine; carbachol and bethanechol are quaternary (poor CNS entry).'],
   mem:['Bethanechol = “Bladder &amp; bowel”.','Pilocarpine = “Pupil, Perspiration, Parotid”.','Carbachol = “Cataract case”.','Methacholine = “Methacholine challenge = asthma test”.']});
  function drawCard(){const d=DD[dk];$('#dcard',r).innerHTML=`<div class="card drugcard" style="margin-top:10px;border-left-color:${d.col}"><h3>${d.n} <span class="tag">${d.cls}</span></h3><dl class="dl"><dt>Mechanism</dt><dd>${d.mech}</dd><dt>Selectivity</dt><dd>${d.sel}</dd><dt>Clinical use</dt><dd>${d.use.join('; ')}</dd><dt>Contraindications</dt><dd>${d.ci.join('; ')}</dd><dt>Side effects</dt><dd>${d.se.join('; ')}</dd><dt>Monitoring</dt><dd>${d.mon.join('; ')}</dd><dt>Pearl</dt><dd>${d.pearl}</dd></dl></div>`}
  function drawSvg(){$('#dsvg',r).innerHTML=muscSVG(sub,DD[dk].col,DD[dk].n);applyAnim()}
  function sim(){const d=DD[dk],x=dose,fv=k=>d.w[k]*f(x,d.p);
    $('#dosev',r).textContent=x;

    setM('hr',(hr-72)/72*100*1.5,hr+' bpm');setM('bp',(sbp-120)/120*100*1.6,sbp+'/'+dbp+' mmHg');

    $('#vHR',r).textContent=hr;$('#vBP',r).textContent=sbp+'/'+dbp;$('#vPU',r).textContent=pu.toFixed(1);$('#vFEV',r).textContent=Math.round(100-45*fv('br'));

    else if(x>0)a='<div class="alert info">Therapeutic range: effects largely confined to the intended organ.</div>';
    $('#dalert',r).innerHTML=a}
  onPills(r,'dpills',v=>{dk=v;drawCard();drawSvg();sim();act('direct')});
  onPills(r,'subp',v=>{sub=v;drawSvg();act('direct')});
  $('#dose',r).addEventListener('input',e=>{dose=+e.target.value;sim()});$('#dose',r).addEventListener('change',()=>{act('direct');if(dose>=75)earn('d_tox',10,'Reached cholinergic toxicity range')});
  drawCard();drawSvg();sim();bindPaths(r);
};

function synSVG(st){

  <rect x="150" y="214" width="340" height="38" rx="12" fill="var(--glass2)" stroke="var(--stroke)" stroke-width="2"/><text x="320" y="272" text-anchor="middle" class="svgtx2">Postsynaptic membrane (muscle / ganglion / CNS neuron)</text>
  <text x="504" y="150" class="svgtx2">Synaptic cleft</text>`;
  rx.forEach(x=>{const glow=st==='accum'?`<circle cx="${x}" cy="208" r="26" fill="var(--bad)" opacity=".35" class="pulse"/>`:st==='inhibited'?`<circle cx="${x}" cy="208" r="20" fill="var(--bad)" opacity=".22" class="pulse"/>`:'';
    s+=`${glow}<path d="M${x-14} 214 L${x-14} 196 Q${x} 186 ${x+14} 196 L${x+14} 214Z" fill="var(--ok)" stroke="var(--ok)" opacity=".85"/>`});
  const dead=st==='inhibited'||st==='accum';
  ae.forEach((x,i)=>{s+=`<g><circle cx="${x}" cy="190" r="15" fill="${dead?'var(--tx3)':'var(--pns)'}" stroke="${dead?'var(--tx3)':'var(--pns)'}" ${dead?'opacity=".6"':''}/><path d="M${x} 190 L${x+13} 181 L${x+13} 199Z" fill="var(--bg2)"/>${dead?`<rect x="${x-9}" y="${i%2?160:164}" width="18" height="14" rx="3" fill="var(--bad)"/><text x="${x}" y="${i%2?171:175}" text-anchor="middle" style="font-size:9px;font-weight:800;fill:#fff">⊣</text>`:''}</g>`});
  s+=`<text x="130" y="158" class="svgtx2" style="fill:${dead?'var(--bad)':'var(--pns)'};font-weight:700">AChE ${dead?'(inhibited)':'(active)'}</text>`;
  if(st==='normal'){rx.forEach((x,i)=>{s+=`<circle r="5" fill="var(--ach)"><animateMotion dur="2.6s" begin="${i*.6}s" repeatCount="indefinite" path="M${x} 70 L${x} 184"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;.85;1" dur="2.6s" begin="${i*.6}s" repeatCount="indefinite"/></circle>`});
    s+=`<text x="330" y="318" text-anchor="middle" class="svgtx" style="font-weight:700">Normal: ACh is released, briefly activates receptors, and is rapidly hydrolyzed.</text>`}
  if(st==='breakdown'){ae.forEach((x,i)=>{s+=`<circle r="5" fill="var(--ach)"><animateMotion dur="2.4s" begin="${i*.5}s" repeatCount="indefinite" path="M${x+10} 70 L${x+8} 176"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;.8;1" dur="2.4s" begin="${i*.5}s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="var(--warn)"><animateMotion dur="2.4s" begin="${i*.5}s" repeatCount="indefinite" path="M${x+8} 176 L${x+36} 130 L${x+40} 100"/><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.78;.85;1" dur="2.4s" begin="${i*.5}s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="var(--ok)"><animateMotion dur="2.4s" begin="${i*.5}s" repeatCount="indefinite" path="M${x+8} 176 L${x-26} 130 L${x-30} 70"/><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.78;.85;1" dur="2.4s" begin="${i*.5}s" repeatCount="indefinite"/></circle>`});
    s+=`<text x="330" y="318" text-anchor="middle" class="svgtx" style="font-weight:700">ACh + H₂O → choline (recycled by CHT) + acetate. One AChE hydrolyzes thousands of ACh per second.</text>`}
  if(st==='inhibited'){rx.forEach((x,i)=>{s+=`<circle r="5" fill="var(--ach)"><animateMotion dur="3.2s" begin="${i*.7}s" repeatCount="indefinite" path="M${x} 72 L${x} 176 L${x+22} 130 L${x-18} 110 L${x} 178"/></circle>`});
    s+=`<text x="330" y="318" text-anchor="middle" class="svgtx" style="font-weight:700">AChE inhibited (neostigmine, physostigmine…): ACh is no longer destroyed.</text>`}

  return s+'</svg>'}

function occ(d,ec){return ec>=NA?0:Math.pow(d,1.6)/(Math.pow(d,1.6)+Math.pow(ec,1.6))}
function physio(k,d){const D=SY[k],o={};['a1','a2','b1','b2','d1'].forEach(x=>o[x]=occ(d,D.ec[x]));
  const cen=D.central?o.a2:0;
  const dSVR=110*o.a1-60*o.b2-40*cen,dCO=65*o.b1;
  const pre=93*(1+dSVR/100)*(1+dCO/100);let reflex=clamp(-0.85*(pre-93),-38,28);if(D.central)reflex=0;
  const hr=clamp(72+75*o.b1+reflex-26*cen,32,190);
  const map=clamp(pre+0.3*reflex,45,200);const pp=40*(1+1.4*o.b1)*(1-0.3*o.a1);
  return {o,hr,map,sbp:clamp(map+.66*pp,70,260),dbp:clamp(map-.34*pp,30,170),svr:100+dSVR,br:100-85*o.b2+5*o.a1,renal:100+80*o.d1-40*o.a1,cns:D.cns?100*occ(d,D.cns):D.central?-60*cen:0,pupil:4+3*o.a1}}

function occBar(id,l,col){return `<div class="meter"><div class="ml"><span>${l}</span><b id="${id}_t">0%</b></div><div class="prog" role="meter" aria-label="${l} occupancy" id="${id}_m"><i id="${id}_b" style="width:0;background:${col}"></i></div></div>`}
function setOcc(id,v){$('#'+id+'_b').style.width=Math.round(v*100)+'%';$('#'+id+'_t').textContent=Math.round(v*100)+'%';$('#'+id+'_m').setAttribute('aria-valuenow',Math.round(v*100))}
MODS.symm=function(r){
  let k='epinephrine',dose=0,em='ana';
  r.innerHTML=modHead(6,'Sympathomimetics','Receptor occupancy simulator · emergency scenarios')+
  `<div class="card"><h2>Drug &amp; receptor occupancy</h2>${pills('syp',Object.entries(SY).map(([a,b])=>({v:a,l:b.n})),k)}<div id="sycard"></div>
   <label class="sl" for="sydose">Dose (relative infusion rate): <b id="sdv">0</b> / 100</label><input type="range" id="sydose" min="0" max="100" value="0">
   <div class="grid g2"><div><h3>Receptor occupancy</h3>${occBar('o1','α1 (Gq) · vasoconstriction','var(--sns)')}${occBar('o2','α2 (Gi) · ↓ NE release / sympatholysis','var(--ach)')}${occBar('o3','β1 (Gs) · heart, renin','var(--bad)')}${occBar('o4','β2 (Gs) · bronchi, vessels','var(--ok)')}${occBar('o5','D1 · renal / mesenteric dilation','var(--pns)')}</div>
   <div><h3>Physiologic effects</h3>${meter('shr','Heart rate')}${meter('smap','Mean arterial pressure')}${meter('ssvr','Systemic vascular resistance')}${meter('sbr','Bronchial resistance')}${meter('srn','Renal blood flow')}${meter('scn','CNS stimulation / sedation')}</div></div>
   ${vitals([{id:'sHR',v:72,l:'HR bpm'},{id:'sBP',v:'120/80',l:'BP mmHg'},{id:'sMAP',v:93,l:'MAP'},{id:'sPP',v:'40',l:'Pulse pressure'}])}<div id="smsg" aria-live="polite"></div></div>
  <div class="card"><h2>Receptor activity summary</h2>${tbl(['Drug','α1','α2','β1','β2','D1','Key point'],[['Epinephrine','++','++','+++','+++','–','Dose-dependent; anaphylaxis'],['Norepinephrine','+++','+++','++','–/±','–','Septic shock; reflex bradycardia'],['Dopamine','+ (high)','–','++ (mid)','±','+++ (low)','Dose-dependent'],['Dobutamine','±','–','+++','+','–','Inotrope; ADHF'],['Phenylephrine','+++','–','–','–','–','Pure pressor; reflex ↓HR'],['Albuterol','–','–','±','+++','–','SABA'],['Terbutaline','–','–','±','+++','–','SC for severe asthma'],['Clonidine','–','+++ (central)','–','–','–','↓ sympathetic outflow'],['Midodrine','+++','–','–','–','–','Orthostatic hypotension'],['Pseudoephedrine','++','–','+','±','–','Indirect + direct'],['Amphetamine','++','–','++','–','–','Indirect; CNS stimulant']],'Sympathomimetic receptor profile')}</div>
  <div class="card"><h2>Emergency scenarios</h2>${pills('emp',EM.map(e=>({v:e.id,l:e.t})),em)}<div id="emcase"></div></div>`+
  edu({obj:['Predict physiologic responses from receptor occupancy','Explain dose-dependent effects of epinephrine and dopamine','Select sympathomimetics for anaphylaxis, arrest, shock and asthma','Explain reflex bradycardia and α2 sympatholysis'],
   clin:['Phenylephrine/norepinephrine raise BP → vagal reflex slows HR (reflex bradycardia).','Epinephrine at low doses can lower diastolic BP (β2) but at high doses raises it (α1).'],
   board:['Dopamine: D1 → β1 → α1 as dose increases.','Dobutamine: β1 selective inotrope; avoid in outflow obstruction; arrhythmias.'],
   nap:['Epinephrine IM 0.3–0.5 mg (1 mg/mL) for adults in anaphylaxis; repeat q5–15 min.','Midodrine: take upright, last dose ≥4 h before bed to avoid supine HTN.'],
   pit:['Giving IV antihistamines or steroids before epinephrine in anaphylaxis.','Extravasation of norepinephrine/dopamine: infiltrate with phentolamine.'],
   mem:['“Dopamine: D → B → A”: low dose Dopamine receptors, mid Beta, high Alpha.','“Phenylephrine = Pure α1; Albuterol = β2 for the lungs”.']});
  function card(){const d=SY[k];$('#sycard',r).innerHTML=`<div class="card drugcard" style="margin:10px 0"><h3>${d.n}</h3><dl class="dl"><dt>Mechanism</dt><dd>${d.mech}</dd><dt>Uses</dt><dd>${d.use}</dd><dt>Adverse effects</dt><dd>${d.ae}</dd><dt>Pearl</dt><dd>${d.pe}</dd></dl></div>`}
  function sim(){const p=physio(k,dose);$('#sdv',r).textContent=dose;
    setOcc('o1',p.o.a1);setOcc('o2',p.o.a2);setOcc('o3',p.o.b1);setOcc('o4',p.o.b2);setOcc('o5',p.o.d1);
    setM('shr',(p.hr-72)/72*110,Math.round(p.hr)+' bpm');setM('smap',(p.map-93)/93*130,Math.round(p.map)+' mmHg');setM('ssvr',p.svr-100,Math.round(p.svr)+'% of baseline');
    setM('sbr',p.br-100,Math.round(p.br)+'% of baseline');setM('srn',(p.renal-100)*.7,Math.round(p.renal)+'% of baseline');setM('scn',p.cns,p.cns>5?'Stimulation '+Math.round(p.cns)+'%':p.cns<-5?'Sedation':'None');
    $('#sHR',r).textContent=Math.round(p.hr);$('#sBP',r).textContent=Math.round(p.sbp)+'/'+Math.round(p.dbp);$('#sMAP',r).textContent=Math.round(p.map);$('#sPP',r).textContent=Math.round(p.sbp-p.dbp);
    let m='';if(k==='phenylephrine'&&dose>25)m='<div class="alert info"><b>Reflex bradycardia:</b> pure α1 stimulation raises MAP and the baroreflex slows the heart.</div>';
    if(k==='epinephrine'&&dose>8&&dose<30)m='<div class="alert info"><b>Low-dose epinephrine:</b> β2 vasodilation lowers SVR and DBP while β1 raises HR and systolic pressure; at high dose α1 dominates.</div>';
    if(k==='epinephrine'&&dose>=60)m='<div class="alert warn"><b>High dose:</b> α1-mediated vasoconstriction dominates; risk of arrhythmia and ischemia.</div>';
    if(k==='dopamine'){m=dose<12?'<div class="alert info">Low dose: D1 renal/mesenteric vasodilation predominates.</div>':dose<55?'<div class="alert info">Intermediate dose: β1 inotropy increases cardiac output.</div>':'<div class="alert warn">High dose: α1 vasoconstriction dominates.</div>'}
    if(k==='clonidine'&&dose>25)m='<div class="alert info"><b>Central α2:</b> ↓ sympathetic outflow lowers BP and HR. Abrupt withdrawal causes rebound hypertension.</div>';
    if(k==='dobutamine'&&dose>25)m='<div class="alert info">β1 inotropy ↑ CO; SVR changes little (β2 vasodilation offsets weak α1).</div>';
    if(p.hr>150)m+='<div class="alert bad"><b>Dangerous tachycardia</b> — risk of arrhythmia/ischemia.</div>';
    $('#smsg',r).innerHTML=m}
  onPills(r,'syp',v=>{k=v;card();sim();act('symm')});
  $('#sydose',r).addEventListener('input',e=>{dose=+e.target.value;sim()});$('#sydose',r).addEventListener('change',()=>act('symm'));
  function loadCase(){const c=EM.find(e=>e.id===em);caseEngine($('#emcase',r),'em_'+em,c,()=>{act('symm')})}
  onPills(r,'emp',v=>{em=v;loadCase()});
  card();sim();loadCase();
};

 pheo:{n:'Pheochromocytoma',svg:pheoSVG,st:['Catecholamine excess','Receptor effects','α-blockade first','Add β-blocker','Pitfall: β-blocker alone'],

  d:['Chromaffin cell tumor secretes epinephrine and/or NE: paroxysms of headache, sweating, palpitations, hypertension.','α1 → vasoconstriction/HTN/pallor; β1 → tachycardia/arrhythmias.','α-blockade first controls BP and expands blood volume before surgery.','Once α-blocked, add a β-blocker to control reflex tachycardia.','Giving a β-blocker first leaves α1 unopposed (β2 vasodilation lost): hypertensive crisis.'],

 op:{n:'Organophosphate Poisoning',svg:opSVG,st:['Normal','AChE inhibition','Cholinergic crisis','Atropine therapy','Pralidoxime therapy','Aging (irreversible)'],
  tx:['Decontaminate (remove clothing, wash skin), secure airway','Atropine IV titrated to dry bronchial secretions (not pupils)','Pralidoxime early (before aging) for OP/nerve agents','Benzodiazepines for seizures','Pyridostigmine pretreatment (military) protects AChE from soman'],
  d:['Normal: ACh is hydrolyzed within milliseconds.','Organophosphates (malathion, parathion) phosphorylate AChE’s serine → enzyme inactive.','ACh accumulates: DUMBBELSS plus nicotinic effects (fasciculations, paralysis) and CNS seizures.','Atropine reverses muscarinic effects only — high doses are often needed (titrate to secretions).','Pralidoxime nucleophilically removes the phosphate and regenerates AChE, restoring neuromuscular function.','After aging the enzyme is permanently inactivated; recovery requires new AChE synthesis (weeks).'],

MODS.patho=function(r){
  let dk='mg',st=0,seen={},auto=null;
  r.innerHTML=modHead(9,'Clinical Pathophysiology Center','Interactive disease mechanisms and antidote animations')+
  `<div class="card">${pills('disp',Object.entries(DIS).map(([k,v])=>({v:k,l:v.n})),dk)}<h2 id="dtitle"></h2>
   <div id="stp"></div><div class="svgbox" id="dsvg2"></div><div class="alert info" id="dtext" aria-live="polite"></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="prev">◀ Previous</button><button class="btn pri" id="next">Next ▶</button><button class="btn" id="auto">▶ Auto-play all stages</button></div></div>
  <div class="card"><h2>Treatment pathway</h2><ol id="dtx"></ol></div>
  <div class="card"><h2>Check your understanding</h2><div id="dq"></div></div>`+
  edu({obj:['Explain mechanisms of MG, AD, orthostatic hypotension, pheochromocytoma and OP poisoning','Link each disease to its pharmacologic rescue','Sequence treatment correctly (α before β; atropine + pralidoxime)'],
   clin:['MG: antibodies at the NMJ; Lambert–Eaton is presynaptic (improves with use).','OP poisoning: treat airway secretions first; atropine until secretions dry.'],
   board:['Pheochromocytoma: “α before β”; labs: metanephrines; associated with MEN2, VHL, NF1.','Pralidoxime is ineffective after aging and for carbamates.'],
   nap:['Myasthenia: pyridostigmine; AD: donepezil; neurogenic OH: midodrine/droxidopa; pheo: phenoxybenzamine; OP: atropine + pralidoxime.'],
   pit:['Starting a β-blocker first in pheochromocytoma.','Giving atropine and expecting it to fix muscle weakness in OP poisoning.'],
   mem:['“Alpha first, then beta, then surgery.”','“Atropine dries, pralidoxime frees.”']});
  function draw(){const D=DIS[dk];$('#dtitle',r).textContent=D.n;
    $('#stp',r).innerHTML=pills('stp2',D.st.map((s,i)=>({v:String(i),l:(i+1)+'. '+s})),String(st));
    onPills(r,'stp2',v=>{st=+v;draw();seen[dk+st]=1;act('patho');chk()});
    $('#dsvg2',r).innerHTML=D.svg(st);$('#dtext',r).innerHTML='<b>Stage '+(st+1)+': '+D.st[st]+'.</b> '+D.d[st];
    $('#dtx',r).innerHTML=D.tx.map(x=>`<li>${x}</li>`).join('');applyAnim()}
  function chk(){const D=DIS[dk];seen[dk+st]=1;if(D.st.every((_,i)=>seen[dk+i]))earn('dis_'+dk,25,'Mastered the mechanism: '+D.n)}
  function loadQ(){caseEngine($('#dq',r),'ph_'+dk,DIS[dk].q,()=>act('patho'))}
  onPills(r,'disp',v=>{dk=v;st=0;clearInterval(auto);draw();loadQ();act('patho')});
  $('#prev',r).onclick=()=>{st=Math.max(0,st-1);draw();chk()};$('#next',r).onclick=()=>{st=Math.min(DIS[dk].st.length-1,st+1);draw();chk();act('patho')};
  $('#auto',r).onclick=()=>{clearInterval(auto);st=0;draw();auto=setInterval(()=>{if(!document.body.contains($('#dtext',r))){clearInterval(auto);return}if(st>=DIS[dk].st.length-1){clearInterval(auto);return}st++;draw();chk()},S.anim?3200:600);act('patho')};
  draw();loadQ();
};
/* ===================== MODULE 10: NAPLEX QUESTION BANK ===================== */
const QB=[];
const QT=['Physiology','Cholinergic','Anticholinergic','Adrenergic','Toxicology','Pathophysiology'];
const tagp=s=>{const [a,b]=(s||'/').split('/');return {d:a?a.split(','):[],r:b?b.split(','):[]}};
const Q1=(ty,t,c,q,o,a,e,m,p,n,tg)=>QB.push(Object.assign({ty,t,c,q,o,a,e,m,p,n},tagp(tg)));
const SB=(t,c,q,o,a,e,m,p,n,tg)=>Q1('sba',t,c,q,o,a,e,m,p,n,tg);
const CS=(t,c,q,o,a,e,m,p,n,tg)=>Q1('case',t,c,q,o,a,e,m,p,n,tg);
const MS=(t,c,q,o,a,e,m,p,n,tg)=>Q1('multi',t,c,q,o,a,e,m,p,n,tg);
const SQ=(t,c,q,o,e,m,p,n,tg)=>Q1('seq',t,c,q,o,null,e,m,p,n,tg);
const HT=(t,c,q,a,e,m,p,n,tg)=>Q1('hot',t,c,q,null,a,e,m,p,n,tg);
const MT=(t,c,q,o,e,m,p,n,tg)=>Q1('match',t,c,q,o,null,e,m,p,n,tg);
/* --- Physiology --- */
CS('Cholinergic','Patient case','A 72-year-old man with BPH experiences urinary retention. Which drug is most appropriate?',['Atropine','Bethanechol','Propranolol','Scopolamine'],1,'Among these choices, bethanechol is the only agent that stimulates M3 receptors on the detrusor, increasing bladder contraction. Atropine and scopolamine would worsen retention; propranolol does not treat it.','Bethanechol: muscarinic agonist (M3 &gt; M2), resistant to AChE → detrusor contraction, sphincter relaxation.','Important real-world caveat: bethanechol is contraindicated when mechanical outlet obstruction is present — in obstructive BPH retention, relieve the obstruction (catheter, α1 blocker). Bethanechol fits atonic (non-obstructive) retention.','Bethanechol = “Bladder &amp; bowel”. Avoid anticholinergics in BPH.','bethanechol/M3');
SB('Physiology','Knowledge','Which neurotransmitter and receptor mediate transmission at ALL autonomic ganglia?',['ACh at muscarinic M1','ACh at neuronal nicotinic (Nn)','Norepinephrine at α1','Dopamine at D1'],1,'Both sympathetic and parasympathetic ganglia use ACh acting on neuronal nicotinic receptors (ligand-gated Na⁺/K⁺ channels).','Nn receptor opening → fast EPSP → postganglionic firing.','Ganglionic blockers (hexamethonium) block both limbs.','Preganglionic = ACh/Nn, always.','/Nn');
SB('Physiology','Knowledge','Sympathetic innervation of eccrine sweat glands uses which transmitter/receptor?',['NE at α1','NE at β2','ACh at muscarinic','Epinephrine at β1'],2,'Sweat glands are the classic exception: sympathetic postganglionic fibers release ACh acting on muscarinic receptors.','M3 → Gq → ↑ Ca²⁺ → sweat secretion.','Anticholinergics cause anhidrosis → hyperthermia.','“Sweat = sympathetic cholinergic.”','atropine/M3');
SB('Physiology','Knowledge','The adrenal medulla is innervated by which fibers and releases what?',['Postganglionic NE fibers; releases dopamine','Preganglionic ACh fibers; releases epinephrine and NE into blood','Parasympathetic fibers; releases ACh','Postganglionic ACh fibers; releases histamine'],1,'The adrenal medulla is a modified sympathetic ganglion: preganglionic ACh → Nn → epinephrine (~80%) + NE (~20%) into the circulation.','Nn → Ca²⁺ influx → chromaffin granule exocytosis.','Pheochromocytoma arises from chromaffin cells.','Adrenal medulla = no postganglionic axon.','/Nn');
SB('Physiology','Knowledge','The rate-limiting enzyme in catecholamine synthesis is:',['DOPA decarboxylase','Dopamine β-hydroxylase','Tyrosine hydroxylase','PNMT'],2,'Tyrosine → DOPA by tyrosine hydroxylase is rate-limiting and inhibited by metyrosine.','Tyrosine → DOPA → dopamine → NE → epinephrine.','Metyrosine is used in pheochromocytoma.','TH = “The Head” of the pathway.','/');
SB('Physiology','Knowledge','Which process is the major mechanism terminating synaptic NE action?',['Diffusion into the blood only','Reuptake by NET into the presynaptic terminal','Hydrolysis by acetylcholinesterase','COMT metabolism in the synaptic cleft only'],1,'Most NE is recycled by the norepinephrine transporter (uptake-1). MAO and COMT metabolize the remainder.','NET (Na⁺/Cl⁻-dependent) → recycled into vesicles via VMAT.','Cocaine and TCAs block NET → ↑ synaptic NE.','NE: reuptake; ACh: hydrolysis.','/');
SB('Physiology','Knowledge','Which receptor is coupled to Gs and increases cAMP?',['α1','α2','β1','M2'],2,'β1, β2, β3 are Gs-coupled. α1 and M1/M3 are Gq; α2 and M2 are Gi.','Gs → adenylyl cyclase ↑ → cAMP ↑ → PKA.','Remember: “Q-Q-I”: α1 (q), M1,3 (q); α2, M2 (i).','Gq: α1/M1/M3; Gi: α2/M2; Gs: β.','/b1');
SB('Physiology','Knowledge','Stimulation of which receptor causes mydriasis without cycloplegia?',['M3','α1','β2','M1'],1,'α1 contracts the radial (dilator) muscle of the iris. M3 blockade also dilates but paralyzes accommodation (cycloplegia).','α1 → Gq → IP3/DAG → radial muscle contraction.','Phenylephrine eye drops: mydriasis, no cycloplegia.','Phenylephrine = pure α1.','phenylephrine/a1');
SB('Physiology','Knowledge','The cranial nerve carrying most parasympathetic outflow to the heart, lungs and GI tract is:',['CN III','CN VII','CN IX','CN X'],3,'The vagus nerve (CN X) supplies the thoracic and abdominal viscera to the splenic flexure.','Vagus → M2 in the heart, M3 in lungs/GI.','CN III: pupil; VII: tears/saliva; IX: parotid.','“Vagus = 75% of parasympathetic.”','/M2');
SB('Physiology','Knowledge','Sympathetic preganglionic neurons are located in which spinal segments?',['C1–C4','T1–L2','L3–L5','S2–S4'],1,'Thoracolumbar outflow: T1–L2 (L3). Sacral S2–S4 is parasympathetic.','Intermediolateral cell column → ventral root → paravertebral chain.','Craniosacral = parasympathetic.','“T1–L2 for fight or flight.”','/');
SB('Physiology','Knowledge','M2 receptor activation in the SA node causes:',['↑ HR via Gs','↓ HR via Gi, ↑ K⁺ conductance, ↓ cAMP','↑ contractility via Gq','Vasodilation via nitric oxide'],1,'M2 → Gi → ↓ cAMP and βγ-mediated K⁺ efflux → hyperpolarization → bradycardia.','Gi → AC inhibition; GIRK channels open.','Atropine blocks this → ↑ HR.','M2 = Heart; M3 = glands, smooth muscle.','atropine/M2');
SB('Physiology','Knowledge','Botulinum toxin causes flaccid paralysis by:',['Blocking Nm receptors','Inhibiting AChE','Cleaving SNARE proteins and preventing ACh release','Depleting vesicular stores via VMAT inhibition'],2,'Botulinum toxin cleaves SNAP-25/synaptobrevin, preventing vesicle fusion and ACh release at NMJ and autonomic synapses.','Zinc endopeptidase → SNARE cleavage.','Autonomic effects: dry mouth, constipation, mydriasis.','“Botox = no ACh release.”','/');
SB('Physiology','Knowledge','Reserpine decreases blood pressure primarily by:',['Blocking α1 receptors','Inhibiting VMAT and depleting NE stores','Blocking NET','Stimulating central α2 receptors'],1,'Reserpine irreversibly inhibits VMAT2, depleting NE, dopamine and serotonin stores.','VMAT blockade → NE degraded by MAO in cytoplasm.','Depression is a classic adverse effect.','“Reserpine = Reserve depletion.”','reserpine/');
MT('Physiology','Knowledge','Match each autonomic site with the receptor that mediates its main effect.',[['Detrusor contraction','M3'],['SA node slowing','M2'],['Bronchodilation','β2'],['Renin release','β1']],'Bladder contraction (M3), SA node slowing (M2), bronchodilation (β2), renin release from JG cells (β1).','Gq/Gi/Gs pathways explain each effect.','Cell-surface receptor identity determines drug choice.','Link effect → receptor → drug.','/M3,M2,b2,b1');
/* --- Cholinergic direct --- */
SB('Cholinergic','Drug therapy selection','Which agent is used for the bronchial challenge test to diagnose airway hyperreactivity?',['Bethanechol','Methacholine','Pilocarpine','Carbachol'],1,'Inhaled methacholine provokes bronchoconstriction; a ≥20% fall in FEV1 indicates hyperreactivity.','Methacholine → M3 on airway smooth muscle → Gq → contraction.','Have albuterol available. Hold bronchodilators before test.','Methacholine = challenge test.','methacholine/M3');
SB('Cholinergic','Drug therapy selection','A patient with Sjögren syndrome has severe xerostomia. Which drug increases salivation?',['Atropine','Pilocarpine','Propranolol','Scopolamine'],1,'Pilocarpine (or cevimeline) stimulates M3 receptors on salivary glands.','M3 → Gq → IP3 → Ca²⁺ → secretion.','Adverse effects: sweating, flushing, urinary frequency.','Pilocarpine = Pupil, Perspiration, Parotid.','pilocarpine/M3');
CS('Cholinergic','Patient case','A patient with acute angle-closure glaucoma is awaiting definitive treatment. Which topical drug can be used to open the angle by causing miosis?',['Atropine','Pilocarpine','Phenylephrine','Tropicamide'],1,'Pilocarpine causes miosis via M3 and ciliary muscle contraction, increasing trabecular outflow.','Miosis pulls the iris away from the trabecular meshwork.','Atropine/tropicamide/phenylephrine dilate the pupil and can precipitate angle closure.','Miosis for angle-closure; mydriatics are contraindicated.','pilocarpine/M3');
SB('Cholinergic','Adverse effect recognition','Which condition is a contraindication to bethanechol?',['Postoperative atonic bladder','Mechanical urinary obstruction','Neurogenic bladder','Ileus without obstruction'],1,'Bethanechol increases detrusor contraction against an obstructed outlet and may cause bladder rupture/pain.','↑ intravesical pressure with fixed outflow.','Also avoid in asthma, PUD, bradycardia, hyperthyroidism.','Never give a cholinergic against an obstruction.','bethanechol/M3');
SB('Cholinergic','Drug therapy selection','Which agent is injected intraocularly to produce miosis during cataract surgery?',['Carbachol','Atropine','Epinephrine','Scopolamine'],0,'Intraocular carbachol (or ACh) produces rapid miosis during surgery.','Direct M (and N) agonism of the iris sphincter.','Not used systemically.','Carbachol = cataract case.','carbachol/M3');
MS('Cholinergic','Knowledge','Select ALL direct-acting cholinomimetics.',['Bethanechol','Pilocarpine','Neostigmine','Methacholine','Physostigmine'],[0,1,3],'Bethanechol, pilocarpine, carbachol and methacholine bind receptors directly. Neostigmine and physostigmine inhibit AChE (indirect).','Direct agonists mimic ACh at receptors; indirect agents prevent ACh breakdown.','Indirect agents need ACh release; direct do not.','Direct = receptor agonists.','bethanechol,pilocarpine,methacholine/');
SB('Cholinergic','Toxicology','Overdose of bethanechol is treated with:',['Pralidoxime','Atropine','Neostigmine','Physostigmine'],1,'Atropine competitively blocks muscarinic receptors; pralidoxime only helps with organophosphates.','Competitive antagonism at M receptors.','Support airway, treat bronchospasm.','Muscarinic toxicity → atropine.','bethanechol,atropine/M3');
/* --- Cholinergic indirect --- */
CS('Cholinergic','Patient case','A 34-year-old woman has ptosis and diplopia worsening in the evening. Edrophonium test improves symptoms. Which is the best oral symptomatic therapy?',['Bethanechol','Pyridostigmine','Atropine','Succinylcholine'],1,'Pyridostigmine (quaternary AChE inhibitor) increases ACh at the NMJ.','AChE inhibition → ↑ ACh → greater Nm receptor activation.','Not disease-modifying; add immunosuppressants.','MG: pyridostigmine; avoid fluoroquinolones, aminoglycosides.','pyridostigmine/Nm');
SB('Cholinergic','Drug therapy selection','Which AChE inhibitor crosses the blood–brain barrier and reverses severe anticholinergic delirium?',['Neostigmine','Pyridostigmine','Physostigmine','Edrophonium'],2,'Physostigmine is a tertiary amine; neostigmine/pyridostigmine/edrophonium are quaternary and stay peripheral.','Tertiary amines cross the BBB.','Avoid in TCA overdose (seizures, asystole).','“Physo = Psycho (CNS).”','physostigmine/M1');
SB('Cholinergic','Adverse effect recognition','Which adverse effect is most characteristic of donepezil in Alzheimer disease?',['Hypertension','Bradycardia and syncope','Urinary retention','Mydriasis'],1,'Increased vagal tone leads to bradycardia, syncope and GI adverse effects (nausea, diarrhea, vivid dreams).','Cholinergic excess on M2 and GI M3.','Use caution in sick sinus syndrome/AV block.','AChE inhibitors: slow HR.','donepezil/M2');
SB('Cholinergic','Clinical reasoning','During evaluation of a patient on pyridostigmine with worsening weakness, edrophonium makes symptoms WORSE. The diagnosis is:',['Myasthenic crisis','Cholinergic crisis','Lambert–Eaton syndrome','Botulism'],1,'Excess ACh causes depolarization block at the NMJ: edrophonium worsens weakness in cholinergic crisis.','Persistent Nm stimulation → depolarizing block.','Treat by holding AChE inhibitor and supporting ventilation.','Better = myasthenic crisis; worse = cholinergic crisis.','edrophonium/Nm');
CS('Toxicology','Toxicology','A farmer has pinpoint pupils, bronchorrhea, bradycardia and fasciculations after spraying parathion. Which treatment pair is correct?',['Atropine and pralidoxime','Physostigmine and atropine','Neostigmine and glycopyrrolate','Naloxone and flumazenil'],0,'Atropine counters muscarinic effects; pralidoxime regenerates phosphorylated AChE and helps nicotinic weakness.','OP phosphorylates AChE serine; oximes remove the phosphate before aging.','Titrate atropine to dry secretions.','OP poisoning: ATROPINE + 2-PAM + benzodiazepines for seizures.','atropine,pralidoxime/M3,Nn');
SB('Toxicology','Knowledge','Pralidoxime is NOT effective when:',['Given within hours of organophosphate exposure','The enzyme has “aged” or the toxin is a carbamate','Nicotinic weakness is present','Combined with atropine'],1,'After aging the phosphorylated enzyme is resistant to reactivation; carbamates are reversible and do not need oximes.','Aging = dealkylation of the phosphate-enzyme bond.','Give early, especially with soman.','Pralidoxime: early, OP only.','pralidoxime/');
MS('Toxicology','Adverse effect recognition','Select ALL features of cholinergic (DUMBBELSS) toxicity.',['Miosis','Bradycardia','Diarrhea','Lacrimation','Mydriasis','Anhidrosis'],[0,1,2,3],'Cholinergic excess causes miosis, bradycardia, diarrhea, urination, lacrimation, sweating (diaphoresis), salivation, bronchospasm and emesis. Mydriasis and anhidrosis suggest anticholinergic toxicity.','M3 and M2 over-stimulation.','Nicotinic effects: fasciculations, weakness.','DUMBBELSS vs hot-dry-red.','/M3,M2');
SQ('Toxicology','Clinical reasoning','Order the initial management of severe organophosphate poisoning.',['Secure airway and decontaminate','Give atropine titrated to dry secretions','Give pralidoxime','Treat seizures with benzodiazepines and monitor'],'Airway/breathing and decontamination come first; then atropine until secretions are dry, then pralidoxime before aging, with benzodiazepines for seizures.','Muscarinic crisis kills via bronchorrhea and bronchospasm.','Atropine endpoint: clear chest, not pupils.','ABCs → atropine → oxime → benzodiazepine.','atropine,pralidoxime/');
SQ('Cholinergic','Knowledge','Order the steps in cholinergic transmission, from synthesis to termination.',['Choline uptake and acetylation by ChAT','Storage in vesicles (VAChT)','Ca²⁺-dependent exocytosis','Binding to postsynaptic receptor','Hydrolysis by AChE'],'ACh is made by ChAT from choline + acetyl-CoA, stored, released by Ca²⁺-triggered exocytosis, binds receptors, and is hydrolyzed by AChE.','Choline is recycled by CHT.','Hemicholinium blocks choline uptake; botulinum blocks release.','Make → store → release → bind → destroy.','/');
SB('Cholinergic','Drug therapy selection','Which agent is combined with glycopyrrolate to reverse non-depolarizing neuromuscular blockade?',['Pralidoxime','Neostigmine','Bethanechol','Atropine alone'],1,'Neostigmine increases ACh at the NMJ; glycopyrrolate prevents bradycardia, bronchospasm and secretions.','AChE inhibition + muscarinic blockade.','Does not reverse succinylcholine. Sugammadex is an alternative for rocuronium/vecuronium.','Neostigmine + glycopyrrolate.','neostigmine,glycopyrrolate/Nm');
SB('Cholinergic','Drug therapy selection','Which cholinesterase inhibitor is available as a transdermal patch for Alzheimer and Parkinson disease dementia?',['Donepezil','Rivastigmine','Galantamine','Physostigmine'],1,'Rivastigmine (AChE + BuChE inhibitor) is available as a patch, which improves GI tolerability.','Pseudo-irreversible carbamylation of cholinesterases.','Memantine is an NMDA antagonist (add-on).','Rivastigmine patch.','rivastigmine/');
/* --- Anticholinergic --- */
SB('Anticholinergic','Adverse effect recognition','Which finding explains “hot as a hare” in anticholinergic toxicity?',['Cutaneous vasoconstriction','Anhidrosis from blocked muscarinic sweat glands','Increased metabolic rate from α1 blockade','Hypersalivation'],1,'Sweat glands are muscarinic; blockade stops sweating, impairing heat dissipation.','M3 blockade on eccrine glands.','Children and elderly are at highest risk.','Hot = no sweat.','atropine/M3');
CS('Toxicology','Toxicology','A 24-year-old arrives agitated after a diphenhydramine overdose: HR 140, temperature 39 °C, dry flushed skin, 8-mm pupils, absent bowel sounds. QRS is normal. Which antidote is appropriate for severe delirium?',['Neostigmine','Physostigmine','Pralidoxime','Atropine'],1,'Physostigmine crosses the BBB and reverses central and peripheral antimuscarinic toxicity when the ECG is normal.','AChE inhibition raises ACh to overcome muscarinic blockade.','Avoid if QRS widened (TCA) or bradycardia; use benzodiazepines for agitation.','Physostigmine for pure anticholinergic delirium.','physostigmine,diphenhydramine/M1,M3');
SB('Anticholinergic','Drug therapy selection','Which drug is a long-acting antimuscarinic for COPD maintenance?',['Albuterol','Ipratropium','Tiotropium','Montelukast'],2,'Tiotropium (LAMA) blocks M3 receptors for ~24 h; ipratropium is short-acting (SAMA).','M3 blockade → bronchodilation.','Use caution in BPH/narrow-angle glaucoma.','LAMA = maintenance; SAMA = PRN.','tiotropium/M3');
SB('Anticholinergic','Drug therapy selection','A patient with antipsychotic-induced acute dystonia needs rapid treatment. Which is most appropriate?',['Benztropine IM/IV','Propranolol','Bethanechol','Pyridostigmine'],0,'Anticholinergics restore the dopamine–ACh balance in the striatum.','M1 blockade in the basal ganglia.','Also used for parkinsonism; avoid in dementia.','EPS → benztropine/diphenhydramine.','benztropine/M1');

MS('Anticholinergic','Adverse effect recognition','Select ALL expected effects of systemic muscarinic antagonism.',['Dry mouth','Urinary retention','Mydriasis','Diarrhea','Miosis','Constipation'],[0,1,2,5],'Antimuscarinics reduce secretions and smooth-muscle tone: dry mouth, retention, mydriasis, constipation. Diarrhea and miosis are cholinergic effects.','M3 blockade in glands, detrusor, iris, gut.','Also tachycardia and hyperthermia.','Dry, dilated, stuck, constipated.','atropine/M3');
MT('Anticholinergic','Drug therapy selection','Match each antimuscarinic with its main indication.',[['Ipratropium','COPD / acute asthma'],['Oxybutynin','Overactive bladder'],['Benztropine','Parkinsonism / EPS'],['Scopolamine','Motion sickness'],['Glycopyrrolate','Drooling / preoperative secretions']],'Each agent is matched to the site of the relevant M3/M1 effect.','Quaternary agents (ipratropium, glycopyrrolate, trospium) stay peripheral.','Know central vs peripheral distinction.','Match drug to clinic.','ipratropium,oxybutynin,benztropine,scopolamine,glycopyrrolate/M3,M1');

CS('Adrenergic','Patient case','A 28-year-old develops hives, wheeze and hypotension after a bee sting. What is the first-line treatment?',['IV diphenhydramine','Epinephrine IM','Albuterol nebulizer','IV hydrocortisone'],1,'IM epinephrine (anterolateral thigh) reverses airway edema, bronchospasm and hypotension via α1, β1, β2 and mast-cell stabilization.','α1 vasoconstriction, β1 inotropy, β2 bronchodilation.','Antihistamines/steroids are adjuncts. Repeat q5–15 min.','Anaphylaxis = epinephrine IM, immediately.','epinephrine/a1,b1,b2');
CS('Adrenergic','Drug therapy selection','A patient with septic shock remains hypotensive after 30 mL/kg of crystalloid. Which vasopressor is first line?',['Dopamine','Norepinephrine','Dobutamine','Phenylephrine'],1,'Norepinephrine restores MAP via α1 with fewer arrhythmias than dopamine.','α1 ↑ SVR; β1 modest inotropy.','Vasopressin is the usual add-on.','Septic shock: norepinephrine.','norepinephrine/a1,b1');

SB('Adrenergic','Adverse effect recognition','A patient using albuterol frequently develops tremor and palpitations. Which laboratory abnormality is most likely?',['Hyperkalemia','Hypokalemia','Hypernatremia','Hypocalcemia'],1,'β2 stimulation drives K⁺ into cells via Na⁺/K⁺-ATPase.','β2 → cAMP → Na⁺/K⁺-ATPase.','Used therapeutically for hyperkalemia.','Albuterol: ↓ K⁺, ↑ glucose.','albuterol/b2');
SB('Adrenergic','Adverse effect recognition','Abrupt discontinuation of clonidine can cause:',['Hypotension','Rebound hypertension','Hyperkalemia','Bradycardia only'],1,'Withdrawal removes central α2 sympatholysis → surge in sympathetic outflow and catecholamines.','Loss of α2 feedback; NE release ↑.','Taper over days; stop β-blocker first if on both.','Clonidine → taper!','clonidine/a2');

SB('Adrenergic','Physiology','Phenylephrine raises BP but HR falls. The best explanation is:',['Direct M2 stimulation','Baroreceptor-mediated reflex bradycardia','β1 blockade','Central α2 stimulation'],1,'Pure α1 vasoconstriction raises BP; baroreceptors trigger vagal slowing.','No β1 stimulation to counter the reflex.','Same for norepinephrine (partial).','Phenylephrine = pressure up, rate down.','phenylephrine/a1');
SB('Adrenergic','Knowledge','Low-dose dopamine primarily stimulates which receptor?',['α1','β2','D1','M3'],2,'D1 receptors in renal/mesenteric vessels cause vasodilation; β1 at intermediate and α1 at high doses.','D1 → Gs → cAMP ↑.','“Renal-dose dopamine” does not protect the kidneys.','D → B → A.','dopamine/d1');
SB('Adrenergic','Clinical reasoning','After phenoxybenzamine pretreatment, a patient receives epinephrine. Which response is expected?',['Marked hypertension','Hypotension (epinephrine reversal)','No change','Bradycardia only'],1,'α1 blockade unmasks β2-mediated vasodilation, so BP falls.','β2 vasodilation unopposed.','Conversely, β-blockers + epinephrine → hypertension.','Epinephrine reversal = hypotension.','epinephrine/a1,b2');
SB('Adrenergic','Adverse effect recognition','Pseudoephedrine should be used cautiously in which patient?',['Allergic rhinitis in a child','A man with BPH and hypertension','A pregnant woman with cough','A patient with osteoporosis'],1,'α1 agonism contracts the bladder neck (retention) and raises BP.','Indirect NE release + α1.','Also avoid with MAOIs.','Decongestants: BPH/HTN caution.','pseudoephedrine/a1');
SB('Adrenergic','Knowledge','Amphetamine increases sympathetic activity mainly by:',['Directly stimulating α1 receptors','Reverse transport (release) of NE and DA and blocking reuptake','Blocking MAO-B irreversibly only','Inhibiting tyrosine hydroxylase'],1,'Amphetamines enter terminals via NET/DAT and cause vesicular release of NE/DA through reverse transport.','VMAT2 and DAT/NET reversal; weak MAO inhibition.','Tachyphylaxis due to store depletion.','Amphetamine = indirect.','amphetamine/');

SB('Adrenergic','Adverse effect recognition','Which warning applies to prolonged terbutaline for tocolysis?',['Boxed warning: serious maternal cardiac events and death','Boxed warning: hepatic failure','No warnings','Contraindicated only in asthma'],0,'FDA boxed warning against prolonged (&gt;48–72 h) tocolysis because of maternal tachyarrhythmia, MI and pulmonary edema.','β1/β2 stimulation.','Terbutaline SC may be used for acute asthma.','Terbutaline: not for tocolysis.','terbutaline/b2');
MT('Adrenergic','Knowledge','Match each drug with its principal receptor activity.',[['Phenylephrine','α1'],['Albuterol','β2'],['Dobutamine','β1'],['Clonidine','α2']],'Selective agonists: phenylephrine (α1), albuterol (β2), dobutamine (β1), clonidine (central α2).','Receptor selectivity predicts effect.','Epinephrine and norepinephrine are non-selective.','Know selective agonists.','phenylephrine,albuterol,dobutamine,clonidine/a1,b2,b1,a2');
HT('Adrenergic','Physiology','Mirabegron (β3 agonist) treats overactive bladder by relaxing which organ? Tap it.','bladder','β3 stimulation relaxes the detrusor and increases bladder capacity.','β3 → Gs → cAMP ↑.','Can raise BP; check BP.','β3 = bladder (and fat).','/b3');
HT('Adrenergic','Physiology','Tap the structure where α1 stimulation produces vasoconstriction and raises blood pressure.','vessel','α1 activation of vascular smooth muscle causes contraction, ↑ SVR and ↑ BP.','Gq → IP3 → Ca²⁺.','Phenylephrine, norepinephrine, midodrine.','Alpha-1 = “pinch”.','phenylephrine/a1');
SQ('Adrenergic','Clinical reasoning','Order the management of anaphylaxis.',['Epinephrine IM','Call for help, position supine, oxygen, IV access','IV fluid bolus and repeat epinephrine if needed','Adjuncts: antihistamine, albuterol, corticosteroid'],'Epinephrine IM is first, together with supportive resuscitation; then fluids/repeat dosing; adjuncts last.','Epinephrine reverses α1/β1/β2 pathophysiology.','Glucagon if on β-blocker.','Epi first, adjuncts later.','epinephrine/a1,b1,b2');

CS('Adrenergic','Drug therapy selection','A 58-year-old with ischemic cardiomyopathy (EF 28%, euvolemic) needs a β-blocker with proven mortality benefit. Which is appropriate?',['Propranolol','Atenolol','Carvedilol','Metoprolol tartrate'],2,'Carvedilol, metoprolol succinate and bisoprolol reduce mortality in HFrEF.','β1 blockade reduces remodeling; carvedilol also blocks α1.','Start low, titrate slowly, avoid in decompensation.','HFrEF: “Bisoprolol, Carvedilol, Metoprolol succ.”','carvedilol/b1,b2,a1');
CS('Adrenergic','Drug therapy selection','A patient with a catecholamine-secreting adrenal tumor is being prepared for surgery. Which should be started first?',['Propranolol','Phenoxybenzamine','Metoprolol','Epinephrine'],1,'α-blockade first prevents unopposed α stimulation and hypertensive crisis; β-blockers are added later.','Irreversible non-selective α antagonism.','Phenoxybenzamine or doxazosin 7–14 days preoperatively.','Alpha before beta.','phenoxybenzamine/a1');

CS('Adrenergic','Patient case','A 52-year-old with cirrhosis has large esophageal varices on screening endoscopy and no prior bleed. Which drug reduces the risk of first variceal bleeding?',['Propranolol','Metoprolol','Prazosin','Clonidine'],0,'Non-selective β-blockers (propranolol, nadolol, carvedilol) reduce portal pressure by ↓ CO (β1) and splanchnic vasoconstriction (β2 blockade → unopposed α1).','β1 + β2 blockade.','Titrate to HR 55–60; hold in refractory ascites/hypotension.','Portal HTN: NSBB or carvedilol.','propranolol/b1,b2');
SB('Adrenergic','Adverse effect recognition','Which adverse effect is classically associated with reserpine?',['Depression','Orthostasis only','Hyperkalemia','Tachycardia'],0,'Depletion of CNS monoamines causes depression, sedation and nightmares.','VMAT2 inhibition.','Also diarrhea and nasal stuffiness.','Reserpine → depression.','reserpine/');
SB('Adrenergic','Knowledge','Guanethidine’s action is blocked by which drugs because they inhibit its neuronal uptake?',['TCAs and cocaine','β-blockers','ACE inhibitors','Loop diuretics'],0,'Guanethidine enters via NET; TCAs and cocaine block NET.','Uptake-1 inhibition.','Similar issue with indirect sympathomimetics.','NET blockers antagonize guanethidine.','guanethidine/');
CS('Adrenergic','Patient case','A 68-year-old with a history of chest pain after cocaine use presents with HR 126 and BP 178/100. Which should be avoided?',['IV benzodiazepine','Nitroglycerin','Non-selective β-blocker','Aspirin'],2,'Unopposed α stimulation from β-blockade may worsen hypertension and coronary vasospasm.','β-blockers leave α1 unopposed.','Benzodiazepines first line.','Cocaine chest pain: avoid β-blockers.','propranolol/b2,a1');
SB('Adrenergic','Adverse effect recognition','Why must diabetic patients on insulin be counseled about β-blockers?',['They cause hyperglycemia only','They mask tachycardia and tremor of hypoglycemia','They increase insulin secretion','They cause ketoacidosis'],1,'β blockade blunts adrenergic warning signs; sweating is preserved.','β1/β2 blockade.','Non-selective agents also delay glucose recovery.','β-blocker masks hypoglycemia.','propranolol/b1,b2');
MS('Adrenergic','Knowledge','Select ALL β1-selective (cardioselective) blockers.',['Atenolol','Metoprolol','Propranolol','Bisoprolol','Carvedilol'],[0,1,3],'Atenolol, metoprolol and bisoprolol (also esmolol, nebivolol) are β1-selective. Propranolol is non-selective; carvedilol blocks β1, β2 and α1.','Selectivity is dose-dependent.','A–M rule.','Cardioselective = A, B, E, M.','atenolol,metoprolol/b1');

/* ---------- engine ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickExam(n,topic){let pool=topic?QB.filter(q=>q.t===topic):QB.slice();const ns=shuffle(pool.filter(q=>q.ty!=='sba'&&q.ty!=='case')),sg2=shuffle(pool.filter(q=>q.ty==='sba'||q.ty==='case'));
  const nsN=Math.min(ns.length,Math.round(n*.3));let sel=ns.slice(0,nsN).concat(sg2.slice(0,n-nsN));if(sel.length<n)sel=sel.concat(shuffle(pool.filter(q=>!sel.includes(q))).slice(0,n-sel.length));return shuffle(sel).slice(0,n)}
const TYL={sba:'Single best answer',case:'Case-based scenario',multi:'Multiple select',seq:'Drag-and-drop sequence',hot:'Hotspot identification',match:'Matching'};
MODS.naplex=function(r){
  let ex=null,timer=null,topicSel='Physiology';
  function start(){r.innerHTML=modHead(10,'NAPLEX Challenge Center','50 randomized board-style questions · '+QB.length+' in the bank')+
   `<div class="card"><h2>Choose a mode</h2><div class="grid g3"><button class="card tilecard" id="mFull"><h3>Full exam · 50 questions</h3><span class="small muted">Randomized mix of all types. Feeds the readiness score.</span></button><button class="card tilecard" id="mQuick"><h3>Quick practice · 10 questions</h3><span class="small muted">Fast warm-up.</span></button><div class="card"><h3>Topic drill · 10 questions</h3>${pills('tsel',QT,topicSel)}<button class="btn pri" id="mTopic">Start drill</button></div></div>
   <p class="small muted">Question types: ${Object.values(TYL).join(' · ')}. Previous attempts: <b>${S.exams.length}</b>${S.exams.length?' · best '+Math.max(...S.exams.map(e=>e.pct))+'%':''}.</p></div>`+
   edu({obj:['Practice autonomic pharmacology in NAPLEX style','Apply knowledge to patient cases and sequences','Review mechanism, pearls and NAPLEX tips for every item'],clin:['Read the stem for the receptor clue (organ + symptom), then choose the agent.'],board:['Tie every drug to receptor, organ effect, adverse effect and antidote.'],nap:['Eliminate options with opposing mechanisms; look for contraindications hidden in the vignette.'],pit:['Choosing a drug that worsens the stated comorbidity (asthma, BPH, glaucoma).'],mem:['Receptor → organ → drug → adverse effect → antidote.']});
   $('#mFull',r).onclick=()=>run(50,null,'Full exam');$('#mQuick',r).onclick=()=>run(10,null,'Quick practice');$('#mTopic',r).onclick=()=>run(10,topicSel,'Topic drill: '+topicSel);onPills(r,'tsel',v=>topicSel=v)}
  function run(n,topic,label){const qs=pickExam(n,topic);ex={qs,i:0,res:[],t0:Date.now(),label,n:qs.length};clearInterval(timer);show()}
  function show(){const q=ex.qs[ex.i];let sel=q.ty==='multi'?[]:null,order=q.ty==='seq'?shuffle(q.o.map((_,i)=>i)):null,pairs=null,matchSel={},organ=null,done=false;
    const tl=Math.round((Date.now()-ex.t0)/1000);
    r.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span class="tag">${ex.label}</span><span class="tag">Question ${ex.i+1} / ${ex.n}</span><span class="tag" id="clock">⏱ ${Math.floor(tl/60)}:${String(tl%60).padStart(2,'0')}</span></div><div class="prog" style="margin:10px 0" role="progressbar" aria-valuenow="${ex.i}" aria-valuemax="${ex.n}"><i style="width:${ex.i/ex.n*100}%"></i></div>
     <span class="tag">${TYL[q.ty]}</span> <span class="tag">${q.t}</span> <span class="tag">${q.c}</span><p class="bigq" style="margin-top:12px">${q.q}</p><div id="qb"></div><div id="qfb" aria-live="polite"></div><div style="margin-top:10px"><button class="btn pri" id="sub">Submit answer</button> <button class="btn" id="quit">Quit exam</button></div></div>`;
    clearInterval(timer);timer=setInterval(()=>{const c=$('#clock',r);if(!c){clearInterval(timer);return}const s=Math.round((Date.now()-ex.t0)/1000);c.textContent='⏱ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},1000);
    const qb=$('#qb',r);
    const key=i=>'ABCDEFG'[i];
    function draw(){
      if(q.ty==='sba'||q.ty==='case')qb.innerHTML=`<div role="radiogroup" aria-label="Answer choices">${q.o.map((o,i)=>`<button class="opt ${sel===i?'sel':''}" role="radio" aria-checked="${sel===i}" data-i="${i}"><span class="k">${key(i)}</span><span>${o}</span></button>`).join('')}</div>`;
      if(q.ty==='multi')qb.innerHTML=`<p class="small muted">Select all that apply.</p>`+q.o.map((o,i)=>`<button class="opt ${sel.includes(i)?'sel':''}" role="checkbox" aria-checked="${sel.includes(i)}" data-i="${i}"><span class="k">${sel.includes(i)?'☑':'☐'}</span><span>${o}</span></button>`).join('');
      if(q.ty==='seq')qb.innerHTML=`<p class="small muted">Arrange in the correct order (drag, or use the arrow buttons).</p>`+order.map((oi,p)=>`<div class="seqitem" draggable="true" data-p="${p}"><b>${p+1}.</b><span style="flex:1">${q.o[oi]}</span><button class="btn sm" data-up="${p}" aria-label="Move up">▲</button><button class="btn sm" data-dn="${p}" aria-label="Move down">▼</button></div>`).join('');
      if(q.ty==='hot')qb.innerHTML=`<div class="svgbox" style="max-width:340px;margin:auto">${bodySVG(organ,organ?{[organ]:'var(--warn)'}:{})}</div><p class="small" id="hotsel">${organ?'Selected: <b>'+ORGLAB[organ]+'</b>':'Tap an organ'}</p>`;
      if(q.ty==='match'){if(!pairs)pairs=shuffle(q.o.map(p=>p[1]));qb.innerHTML=`<div class="grid g2">${q.o.map((p,i)=>`<label class="seqitem" style="cursor:default"><b style="flex:1">${p[0]}</b><select data-m="${i}" aria-label="Match for ${p[0]}"><option value="">Select…</option>${pairs.map(x=>`<option value="${x}" ${matchSel[i]===x?'selected':''}>${x}</option>`).join('')}</select></label>`).join('')}</div>`}
      bindQ()}
    function bindQ(){
      $$('.opt',qb).forEach(b=>b.onclick=()=>{if(done)return;const i=+b.dataset.i;if(q.ty==='multi'){sel=sel.includes(i)?sel.filter(x=>x!==i):sel.concat(i)}else sel=i;draw()});
      $$('[data-up]',qb).forEach(b=>b.onclick=()=>{if(done)return;const p=+b.dataset.up;if(p>0){[order[p-1],order[p]]=[order[p],order[p-1]];draw()}});
      $$('[data-dn]',qb).forEach(b=>b.onclick=()=>{if(done)return;const p=+b.dataset.dn;if(p<order.length-1){[order[p+1],order[p]]=[order[p],order[p+1]];draw()}});
      let dragP=null;$$('.seqitem[draggable]',qb).forEach(it=>{it.ondragstart=e=>{dragP=+it.dataset.p;it.classList.add('drag');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',String(dragP))}catch(x){}};it.ondragend=()=>it.classList.remove('drag');it.ondragover=e=>e.preventDefault();it.ondrop=e=>{e.preventDefault();if(done||dragP==null)return;const to=+it.dataset.p;const m=order.splice(dragP,1)[0];order.splice(to,0,m);dragP=null;draw()}});
      $$('[data-organ]',qb).forEach(n=>{const f=()=>{if(done)return;organ=n.dataset.organ;draw()};n.addEventListener('click',f);n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}})});
      $$('select[data-m]',qb).forEach(s=>s.onchange=()=>{matchSel[+s.dataset.m]=s.value})}
    draw();
    $('#quit',r).onclick=()=>{if(confirm('Quit this exam? Progress for this attempt will be lost.')){clearInterval(timer);start()}};
    $('#sub',r).onclick=function(){
      if(!done){let ok=false,has=true;
        if(q.ty==='sba'||q.ty==='case'){has=sel!==null;ok=sel===q.a}
        if(q.ty==='multi'){has=sel.length>0;ok=sel.length===q.a.length&&q.a.every(x=>sel.includes(x))}
        if(q.ty==='seq'){ok=order.every((oi,p)=>oi===p)}
        if(q.ty==='hot'){has=!!organ;ok=organ===q.a}
        if(q.ty==='match'){has=q.o.every((_,i)=>matchSel[i]);ok=q.o.every((p,i)=>matchSel[i]===p[1])}
        if(!has){toast('Please choose an answer first');return}
        done=true;
        if(q.ty==='sba'||q.ty==='case')$$('.opt',qb).forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('right');else if(i===sel)b.classList.add('wrong')});

        if(q.ty==='seq')qb.innerHTML=`<p class="small muted">Correct order:</p>`+q.o.map((t,i)=>`<div class="seqitem" style="cursor:default"><b>${i+1}.</b><span>${t}</span></div>`).join('');

   <h3>How to earn XP</h3><ul class="small"><li>Visit each section: +10 · engage with a module: +2 per interaction, +25 on completion</li><li>Explore receptors/organs, mechanisms and antidotes: +5 to +25</li><li>Correct quiz answer: +10 · finishing an exam: +15 plus score bonus</li><li>Solve patient cases: +40 · earn badges: +50</li></ul></div>
   <div class="card"><h2>Levels 1–20</h2><div style="max-height:360px;overflow:auto" tabindex="0" role="region" aria-label="Level list">${Array.from({length:20},(_,i)=>{const n=i+1,u=ADV.find(a=>a.lv===n);return `<div class="lvlrow ${n===L?'cur':n>L?'locked':''}"><b>${n}</b><span style="flex:1">${LVL_TITLES[i]}</span><span class="small muted">${lvlNeed(n)} XP</span>${u?'<span class="tag">🔓 '+u.t+'</span>':''}</div>`}).join('')}</div></div></div>
  <div class="card"><h2>Badges</h2><div class="grid g2">${BADGES.map(b=>{const got=S.badges[b.id];return `<div class="badge ${got?'':'lock'}"><div class="ic" aria-hidden="true">${got?b.i:'🔒'}</div><div><b>${b.n}</b> ${got?'<span class="tag t-ok">Earned</span>':'<span class="tag">Locked</span>'}<div class="small muted">${b.d}</div></div></div>`}).join('')}</div></div>
  <div class="card"><h2>Advanced patient cases</h2><p class="small muted">Unlock by reaching the required level.</p><div class="pills" id="advp">${ADV.map(a=>`<button class="pill" data-v="${a.id}" ${L<a.lv?'disabled style="opacity:.5"':''} aria-pressed="false">${L<a.lv?'🔒 ':'🔓 '}${a.t} (Lv ${a.lv})</button>`).join('')}</div><div id="advcase"></div></div>`+
  edu({obj:['Stay motivated with measurable goals','Unlock advanced integrative cases as you progress'],clin:['Advanced cases blend toxicology, interactions and autonomic physiology.'],board:['Integrative questions test multi-step reasoning: mechanism → consequence → rescue.'],nap:['Interaction and toxicity questions are common in NAPLEX competency areas.'],pit:['Memorizing lists without understanding receptor logic.'],mem:['Level up by teaching the pathway back to yourself.']});
  $('#advp',r).addEventListener('click',e=>{const b=e.target.closest('.pill');if(!b||b.disabled)return;$$('#advp .pill',r).forEach(x=>x.setAttribute('aria-pressed',x===b));const c=ADV.find(a=>a.id===b.dataset.v);caseEngine($('#advcase',r),'adv_'+c.id,c,()=>{act('game')})});
  checkBadges();
};
/* ===================== INIT ===================== */
(function init(){
  document.documentElement.setAttribute('data-theme',S.theme||'dark');
  $('#btnTheme').textContent=S.theme==='light'?'🌙 Dark':'☀ Light';
  $('#btnTheme').onclick=()=>{S.theme=S.theme==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',S.theme);$('#btnTheme').textContent=S.theme==='light'?'🌙 Dark':'☀ Light';save()};
  $('#btnAnim').onclick=()=>{S.anim=!S.anim;applyAnim();save()};
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches&&S.anim===true&&!S.visited.home)S.anim=false;
  buildTabs();
  setInterval(()=>{if(document.hidden)return;S.time[cur]=(S.time[cur]||0)+5;save()},5000);
  const h=(location.hash||'').replace('#','');cur=TABS.some(t=>t.id===h)?h:'home';
  $$('#tabs button').forEach(b=>{const on=b.dataset.id===cur;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1});
  addEventListener('hashchange',()=>{const x=(location.hash||'').replace('#','');if(x!==cur&&TABS.some(t=>t.id===x))go(x)});
  go(cur,true);hdr();applyAnim();
})();
</script>
