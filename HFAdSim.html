<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeuroLab AD — Alzheimer's Disease Pathophysiology & Pharmacology Simulator</title>
<meta name="description" content="Interactive, offline simulator for Alzheimer's disease pathophysiology, pharmacology, biomarkers, clinical cases and assessment (PharmD, medical, PA, nursing, neuroscience).">
<style>
/* ===================== THEMES (Okabe-Ito colour-blind-safe semantic palette) ===================== */
:root,[data-theme=light]{
 --bg:#eef2f7;--panel:#ffffff;--panel2:#f3f6fb;--ink:#0f1c2e;--ink2:#41536b;--line:#cdd6e3;
 --brand:#0a5c99;--brand-ink:#ffffff;--focus:#0a5c99;
 --amy:#D55E00;--tau:#0072B2;--ach:#009E73;--glu:#C98600;--inf:#B5528A;--ca:#2E9BD6;--ros:#A39100;
 --good:#00875A;--warn:#B45309;--bad:#C0392B;--stage:#f8fbff;--tissue:#f6e9e4;
 --brain:#EBC3BA;--brain2:#C98F86;--shadow:0 1px 2px rgba(10,30,60,.08),0 6px 20px rgba(10,30,60,.07);
}
[data-theme=dark]{
 --bg:#0b1320;--panel:#131f33;--panel2:#18273f;--ink:#e9f0fa;--ink2:#a9b9cf;--line:#2b3d5a;
 --brand:#5bb2ff;--brand-ink:#04121f;--focus:#8fd0ff;
 --amy:#FF8A3D;--tau:#4DB3FF;--ach:#2FD6A0;--glu:#FFC247;--inf:#E58CBF;--ca:#6CCBFF;--ros:#F0E442;
 --good:#38d39f;--warn:#ffb454;--bad:#ff7b6b;--stage:#0e192b;--tissue:#1b2436;
 --brain:#9C6670;--brain2:#6e4048;--shadow:none;
}
[data-theme=hc]{
 --bg:#000000;--panel:#000000;--panel2:#0c0c0c;--ink:#ffffff;--ink2:#ffffff;--line:#ffffff;
 --brand:#ffee00;--brand-ink:#000000;--focus:#00ffff;
 --amy:#ff9a3c;--tau:#4dc3ff;--ach:#3dffb5;--glu:#ffd23f;--inf:#ff8ad8;--ca:#7fe0ff;--ros:#ffff66;
 --good:#4dff9d;--warn:#ffcc00;--bad:#ff6b5e;--stage:#000000;--tissue:#000000;
 --brain:#3a3a3a;--brain2:#777777;--shadow:none;
}
html[data-fs="1"]{font-size:17.5px}html[data-fs="2"]{font-size:19.5px}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.skip{position:absolute;left:8px;top:-60px;background:var(--brand);color:var(--brand-ink);padding:8px 14px;border-radius:8px;z-index:100;font-weight:700}
.skip:focus{top:8px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
[data-theme=hc] *{border-color:#fff}
[data-theme=hc] .card,[data-theme=hc] .stage,[data-theme=hc] .btn,[data-theme=hc] input,[data-theme=hc] select{border-width:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ===================== APP LAYOUT ===================== */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100vh}
.top{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:1.08rem;margin:0;letter-spacing:.2px}
.brand h1 .byline{font-weight:600;color:var(--ink2);font-size:.92rem;white-space:nowrap}
.brand p{margin:0;font-size:.74rem;color:var(--ink2)}
.tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:.8rem}
.tools label{display:flex;align-items:center;gap:6px;color:var(--ink2)}
.pts{font-weight:700;color:var(--brand);padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel2)}
nav#nav{background:var(--panel);border-right:1px solid var(--line);padding:12px 10px;overflow:auto;position:sticky;top:57px;height:calc(100vh - 57px);align-self:start}
nav h3{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin:14px 8px 4px}
nav h3:first-child{margin-top:2px}
.nb{display:flex;gap:9px;align-items:center;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--ink);padding:7px 9px;border-radius:9px;cursor:pointer;font:inherit;font-size:.86rem}
.nb:hover{background:var(--panel2)}
.nb[aria-current=page]{background:var(--brand);color:var(--brand-ink);font-weight:700}
.nb .n{min-width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;font-size:.72rem;font-weight:700;background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.nb[aria-current=page] .n{background:rgba(255,255,255,.22);color:inherit;border-color:transparent}
.nb .v{margin-left:auto;font-size:.7rem;color:var(--good)}
main{padding:16px 20px 60px;min-width:0}
.mod{max-width:1380px;margin:0 auto}
.mod-head h2{margin:2px 0 4px;font-size:1.45rem}
.mod-head .sub{color:var(--ink2);margin:0 0 8px;max-width:90ch}
details.obj{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin:0 0 12px;font-size:.88rem}
details.obj summary{cursor:pointer;font-weight:700;color:var(--brand)}
details.obj ul{margin:6px 0 4px;padding-left:20px}
.grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(290px,1fr);gap:14px;align-items:start}
.grid.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:13px 15px;min-width:0}
.card h3{margin:0 0 6px;font-size:.98rem}
.card h4{margin:8px 0 3px;font-size:.88rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.card p{margin:.3em 0}
.card ul{margin:.3em 0;padding-left:1.15em}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:12px;overflow-x:auto;overflow-y:hidden;position:relative}
.stage canvas{display:block;width:100%;min-width:640px;touch-action:manipulation}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ctrl{margin:9px 0}
.ctrl label{display:flex;justify-content:space-between;gap:10px;font-weight:650;font-size:.84rem;margin-bottom:2px}
.ctrl output{font-variant-numeric:tabular-nums;color:var(--brand);font-weight:700}
.ctrl input[type=range]{width:100%;height:26px;accent-color:var(--brand);margin:0}
.ctrl .help,.help{display:block;color:var(--ink2);font-size:.74rem;line-height:1.35}
select,input[type=text],input[type=number]{font:inherit;font-size:.84rem;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.btnrow{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.btn{font:inherit;font-size:.84rem;font-weight:650;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer;transition:background .15s,transform .05s}
.btn:hover{border-color:var(--brand)}
.btn:active{transform:translateY(1px)}
.btn.primary,.btn[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seglabel{font-size:.8rem;font-weight:650;margin:8px 0 3px;display:block}
.meter{display:grid;grid-template-columns:124px 1fr 100px;gap:8px;align-items:center;font-size:.8rem;margin:5px 0}
.meter .bar{height:11px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .2s}
.meter b{font-variant-numeric:tabular-nums;text-align:right}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;border:1px solid var(--line);background:var(--panel2)}
.pill.good{color:var(--good);border-color:var(--good)}.pill.warn{color:var(--warn);border-color:var(--warn)}.pill.bad{color:var(--bad);border-color:var(--bad)}
.info h3{color:var(--brand)}
.info .body{font-size:.88rem}
.tbl{width:100%;border-collapse:collapse;font-size:.8rem}
.tbl th,.tbl td{padding:5px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.84rem}.kv dt{color:var(--ink2);font-weight:650}.kv dd{margin:0}
.warnbox{border-left:4px solid var(--warn);background:var(--panel2);padding:7px 11px;border-radius:6px;font-size:.82rem;margin:8px 0}
.okbox{border-left:4px solid var(--good);background:var(--panel2);padding:7px 11px;border-radius:6px;font-size:.82rem;margin:8px 0}
.badbox{border-left:4px solid var(--bad);background:var(--panel2);padding:7px 11px;border-radius:6px;font-size:.82rem;margin:8px 0}
.disc{font-size:.74rem;color:var(--ink2)}
.toast{position:fixed;right:16px;bottom:16px;background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:12px;font-weight:700;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:80vw}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tabs .btn{border-radius:999px}

/* assessment */
.q{font-size:1rem}.q .stem{font-size:1.02rem;margin:6px 0 10px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;text-align:left;width:100%;font:inherit;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--brand)}
.opt b{min-width:20px;color:var(--brand)}
.opt.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--panel))}
label.opt{align-items:flex-start;line-height:1.4}.opt input{margin:4px 2px 0 0;accent-color:var(--brand)}
.opt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel))}
.opt .mk{margin-left:auto;font-weight:800}
.rat{margin-top:10px;font-size:.88rem}
.prog{height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--brand)}
.mastery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mcell{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel2);font-size:.8rem}
.mcell .bar{height:7px;border-radius:99px;background:var(--panel);border:1px solid var(--line);margin-top:5px;overflow:hidden}.mcell .bar i{display:block;height:100%}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.bdg{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.8rem;background:var(--panel2);opacity:.55}
.bdg.on{opacity:1;border-color:var(--brand)}.bdg b{display:block}
.hyp{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin:0 0 10px}
.hyp>summary{cursor:pointer;padding:10px 14px;font-weight:700;list-style:none;display:flex;gap:10px;align-items:center}
.hyp>summary::before{content:"▸";color:var(--brand)}.hyp[open]>summary::before{content:"▾"}
.hyp .hb{padding:0 14px 12px;font-size:.88rem}
.bigstat{font-size:1.9rem;font-weight:800;color:var(--brand);line-height:1.1}
.hero{background:linear-gradient(120deg,var(--brand),#1c8f8a);color:#fff;border-radius:16px;padding:20px 22px;margin-bottom:14px}
[data-theme=hc] .hero{background:#000;border:2px solid #fff}
.hero h2{margin:0 0 6px;font-size:1.6rem}.hero p{margin:4px 0;max-width:80ch;opacity:.95}
.modcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mc{text-align:left;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer}
.mc:hover{border-color:var(--brand);transform:translateY(-1px)}
.mc b{display:block;font-size:.9rem}.mc span{font-size:.76rem;color:var(--ink2)}.mc .tick{float:right;color:var(--good);font-weight:800}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;max-width:640px;width:92vw;padding:18px 22px}
dialog::backdrop{background:rgba(0,0,0,.55)}
@media (max-width:1020px){.grid,.grid.even{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
 .app{grid-template-columns:minmax(0,1fr)}
 nav#nav{position:static;height:auto;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;border-right:0;border-bottom:1px solid var(--line);padding:8px}
 nav h3{display:none}.nb{width:auto;white-space:nowrap;flex:0 0 auto}
 main{padding:12px}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<div class="app">
 <header class="top" role="banner">
  <div class="brand">
   <svg width="38" height="38" viewBox="0 0 40 40" role="img" aria-label="NeuroLab AD logo"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a5c99"/><stop offset="1" stop-color="#14a38b"/></linearGradient></defs><rect width="40" height="40" rx="10" fill="url(#lg)"/><path d="M9 22c0-6 4-11 10-11 3 0 5 1 7 3 3 0 6 3 6 7 0 5-4 8-8 8h-2l-1 4h-5l-1-4c-4-1-6-3-6-7z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle cx="17" cy="20" r="2" fill="#fff"/><circle cx="25" cy="22" r="2" fill="#fff"/><path d="M17 20l8 2" stroke="#fff" stroke-width="1.5"/></svg>
   <div><h1>NeuroLab AD <span class="byline">· Hafeez Faridi, Ph.D.</span></h1><p>Alzheimer's Disease Pathophysiology &amp; Pharmacology Simulator</p></div>
  </div>
  <div class="tools" role="toolbar" aria-label="Display and animation settings">
   <label>Theme <select id="selTheme" aria-label="Colour theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option><option value="hc">High contrast</option></select></label>
   <label>Text <select id="selFs" aria-label="Text size"><option value="0">100%</option><option value="1">110%</option><option value="2">120%</option></select></label>
   <label>Animation <input id="rngSpeed" type="range" min="0" max="2" step="0.25" value="1" aria-label="Animation speed (0 = paused)" style="width:90px"><output id="outSpeed">1×</output></label>
   <button class="btn" id="btnPause" aria-pressed="false" title="Pause or resume animations (P)">⏸ Pause</button>
   <button class="btn" id="btnHelp" title="Keyboard shortcuts and about (?)">? Help</button>
   <span class="pts" id="pts" title="Points earned" aria-label="Points">0 pts</span>
  </div>
 </header>
 <nav id="nav" aria-label="Simulator modules"></nav>
 <main id="main" tabindex="-1"></main>
</div>
<div id="live" class="sr" aria-live="polite" role="status"></div>
<dialog id="dlg" aria-labelledby="dlgT"></dialog>
<noscript><p style="padding:20px">This simulator requires JavaScript. It runs fully offline with no external dependencies.</p></noscript>
<script>
/* ===== CORE ===== */
'use strict';
(function(){
/* =====================================================================================
   NeuroLab AD — core engine: utilities, state, UI kit, charts, brain renderer, router
   ===================================================================================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const TAU=Math.PI*2, sig=x=>1/(1+Math.exp(-x)), fmt=(v,d=0)=>Number(v).toFixed(d);
const seg01=(t,a,b)=>clamp((t-a)/(b-a),0,1);
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(a,r=Math.random)=>a[Math.floor(r()*a.length)];
function shuffle(a,r=Math.random){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function add(el,kids){for(const k of kids){if(k==null||k===false)continue;if(Array.isArray(k))add(el,k);else if(typeof k==='string'&&/<\/?(b|i|sub|sup|br|strong|em)[\s>\/]/.test(k)){const t=document.createElement('template');t.innerHTML=k;el.append(t.content)}else el.append(k.nodeType?k:document.createTextNode(String(k)))}}
function h(tag,attrs,...kids){const el=document.createElement(tag);
 if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
  if(k==='class')el.className=v;else if(k==='text')el.textContent=v;else if(k==='html')el.innerHTML=v;
  else if(k==='style'&&typeof v==='object')Object.assign(el.style,v);
  else if(k.startsWith('on')&&typeof v==='function')el.addEventListener(k.slice(2),v);
  else if(v===true)el.setAttribute(k,'');else el.setAttribute(k,v)}
 add(el,kids);return el}
function rgba(hex,a){hex=String(hex||'#888888').trim();if(hex[0]!=='#')return hex;hex=hex.slice(1);if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');if(!/^[0-9a-f]{6}$/i.test(hex))return '#888';const n=parseInt(hex,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function mix(a,b,t){const p=x=>{x=String(x||'#888888').replace('#','');if(x.length===3)x=x.split('').map(c=>c+c).join('');const n=parseInt(/^[0-9a-f]{6}$/i.test(x)?x:'888888',16);return[n>>16&255,n>>8&255,n&255]};const A=p(a),B=p(b);return `rgb(${Math.round(lerp(A[0],B[0],t))},${Math.round(lerp(A[1],B[1],t))},${Math.round(lerp(A[2],B[2],t))})`}

/* ---------- persistent store (progress) ---------- */
const Store={key:'neurolab-ad-v1',d:null,
 def(){return{set:{theme:'auto',speed:1,paused:false,fs:'0'},visited:{},drugs:{},quiz:{},topic:{},badges:{},pts:0,cases:{n:0,ok:0,streak:0,best:0,perfect:0},chal:{best:0,runs:0},flags:{}}},
 load(){let d=null;try{d=JSON.parse(localStorage.getItem(this.key)||'null')}catch(e){}const f=this.def();this.d=Object.assign(f,d||{});this.d.set=Object.assign(f.set,(d&&d.set)||{})},
 save(){try{localStorage.setItem(this.key,JSON.stringify(this.d))}catch(e){}},
 reset(){try{localStorage.removeItem(this.key)}catch(e){}this.d=this.def()}};
const Bus={m:{},on(n,f){(this.m[n]=this.m[n]||[]).push(f)},emit(n,a){(this.m[n]||[]).forEach(f=>{try{f(a)}catch(e){console.error(e)}})}};

/* ---------- app object ---------- */
const CVARS=['bg','panel','panel2','ink','ink2','line','brand','amy','tau','ach','glu','inf','ca','ros','good','warn','bad','stage','tissue','brain','brain2'];
const REG={hip:'#CC79A7',tem:'#E69F00',par:'#56B4E9',fro:'#009E73',occ:'#9AA5B1'};
const REGN={hip:'Hippocampus',tem:'Temporal cortex',par:'Parietal cortex',fro:'Prefrontal / frontal cortex',occ:'Occipital cortex',nbm:'Basal forebrain (nucleus basalis)'};
const App={mods:[],byId:{},cur:null,dirty:true,C:{},stages:[],last:0,
 touch(){this.dirty=true},
 get speed(){return Store.d.set.speed},get paused(){return Store.d.set.paused||Store.d.set.speed===0},
 say(msg){const l=$('#live');if(l){l.textContent='';setTimeout(()=>{l.textContent=msg},30)}},
 toast(msg){const t=h('div',{class:'toast',role:'status',text:msg});document.body.append(t);setTimeout(()=>t.remove(),3800)},
 addPts(n){Store.d.pts=(Store.d.pts||0)+n;Store.save();Bus.emit('pts')},
 award(id){if(!Store.d.badges)Store.d.badges={};if(Store.d.badges[id])return;const b=(window.__BADGES||[]).find(x=>x.id===id);if(!b)return;Store.d.badges[id]=Date.now();Store.save();this.toast('🏅 Badge unlocked: '+b.name);this.addPts(25);Bus.emit('badge',id)},
 fitAll(){this.stages.forEach(s=>s.fit())}};
function readColors(){const cs=getComputedStyle(document.documentElement);CVARS.forEach(k=>{App.C[k]=(cs.getPropertyValue('--'+k)||'').trim()||'#888888'})}
function applyTheme(){const s=Store.d.set.theme;let t=s;if(s==='auto')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.dataset.theme=t;document.documentElement.dataset.fs=Store.d.set.fs||'0';readColors();App.touch()}
const C=App.C;

/* ---------- canvas stage ---------- */
function makeStage(parent,W,H,label){W=W||800;H=H||450;

Q('amyloid',1,'α-Secretase cleavage of APP is considered non-amyloidogenic because it:',['Cleaves within the Aβ sequence, so intact Aβ cannot be formed','Occurs only in astrocytes','Produces mostly Aβ42','Requires presenilin to be inactive','Generates the C99 fragment'],0,'ADAM10 cuts between residues 16 and 17 of Aβ, yielding neuroprotective sAPPα and C83; γ-secretase then yields harmless p3. Intact Aβ is therefore never produced.',R_SH);
Q('amyloid',1,'A 46-year-old man with trisomy 21 develops progressive memory loss. The most likely mechanistic explanation for his early Alzheimer pathology is:',['An extra copy of the APP gene on chromosome 21','A PSEN1 point mutation','APOE ε4 homozygosity','A MAPT mutation','Prion protein misfolding'],0,'APP is on chromosome 21; trisomy 21 → 3 copies → Aβ overproduction, with near-universal AD neuropathology by age 40 and dementia in most by the 50s–60s.',R_HAR);
Q('amyloid',2,'The most common cause of autosomal-dominant early-onset Alzheimer disease is a mutation in:',['PSEN1','APP','PSEN2','MAPT','APOE'],0,'PSEN1 (catalytic subunit of γ-secretase) mutations account for most autosomal-dominant AD; they raise the Aβ42:Aβ40 ratio. APP and PSEN2 are rarer; MAPT causes FTD; APOE ε4 is a risk, not a deterministic, gene.',R_SH);
Q('amyloid',2,'Which Aβ assembly is regarded as the most synaptotoxic?',['Soluble Aβ oligomers','Mature fibrils in plaque cores','Aβ40 monomers','p3 fragment','sAPPα'],0,'Soluble oligomers bind synaptic receptors, impair LTP, and drive synapse loss; dense-core plaques correlate poorly with cognition.',R_SH);
Q('amyloid',2,'Compared with Aβ40, Aβ42 is:',['More hydrophobic and aggregation-prone, and CSF levels fall as it is deposited in plaques','Less aggregation-prone and rises in CSF in AD','Produced only by α-secretase','Unaffected by presenilin mutations','Cleared faster by neprilysin'],0,'Aβ42 nucleates and aggregates; its sequestration in plaques lowers CSF Aβ42 (and the Aβ42/40 ratio) years before symptoms.',R_JA);
Q('tau',1,'In a healthy neuron, tau protein primarily:',['Stabilises axonal microtubules and supports axonal transport','Cleaves APP','Synthesises acetylcholine','Forms the NMDA receptor pore','Phagocytoses Aβ'],0,'Tau binds and stabilises microtubules, enabling kinesin/dynein-mediated transport of mitochondria and vesicles.',R_HAR);
Q('tau',2,'Which combination best promotes pathological tau hyperphosphorylation?',['↑ GSK-3β and CDK5 activity with ↓ PP2A activity','↓ GSK-3β with ↑ PP2A','↑ ChAT with ↓ AChE','↑ BACE1 with ↓ neprilysin','↑ ADAM10 with ↓ γ-secretase'],0,'Hyperactive kinases (GSK-3β, CDK5/p25) and reduced phosphatase (PP2A) → tau detaches from microtubules, misfolds and forms paired helical filaments.',R_SH);
Q('tau',2,'According to Braak staging, neurofibrillary tangles first appear in the:',['Transentorhinal / entorhinal cortex','Primary visual cortex','Frontal pole','Cerebellum','Primary motor cortex'],0,'Braak I–II: entorhinal cortex; III–IV: limbic/temporal neocortex; V–VI: widespread neocortex including primary sensory areas last.',R_HAR);
Q('tau',2,'Which pathological measure correlates best with the degree of cognitive impairment in AD?',['Neurofibrillary tangle burden and synapse loss','Total number of diffuse plaques','Plasma Aβ40 level','Brain weight at birth','Number of Lewy bodies'],0,'Tangle burden (and synapse loss) tracks symptoms and regional atrophy better than amyloid plaque load, which plateaus early.',R_HAR);
Q('inflam',2,'The TREM2 R47H variant increases AD risk. TREM2 is expressed primarily on:',['Microglia','Cholinergic neurons','Oligodendrocytes','Endothelial pericytes only','Astrocytic end-feet only'],0,'TREM2 supports microglial phagocytosis and plaque-barrier function; loss-of-function variants impair the protective microglial response.',R_HAR);
Q('inflam',2,'Microglia contribute to early synapse loss in AD by:',['Complement (C1q/C3)-tagged synapse pruning','Releasing acetylcholine','Cleaving tau','Blocking NMDA receptors','Producing Aβ via ADAM10'],0,'Aβ oligomers induce C1q/C3 tagging; microglial CR3 receptors engulf tagged synapses. Complement inhibition protects synapses in animal models.',R_HAR);
Q('inflam',3,'The glymphatic system is relevant to AD pathophysiology because it:',['Clears interstitial solutes including Aβ via perivascular AQP4-dependent flow, mostly during sleep','Synthesises glutamate','Transports acetylcholine to the cortex','Produces cerebrospinal fluid Aβ42','Is active only in the hippocampus'],0,'Perivascular CSF–interstitial exchange is enhanced during slow-wave sleep; sleep loss and AQP4 mislocalisation may impair Aβ clearance.',R_HAR);
Q('emerg',2,'In the EVOKE/EVOKE+ phase 3 trials (2025), oral semaglutide in early symptomatic AD:',['Did not slow CDR-SB progression versus placebo, despite biomarker changes','Slowed decline by about 30% on CDR-SB','Was approved for AD by the FDA','Caused ARIA in a third of patients','Reduced amyloid PET to normal'],0,'Both trials were negative on the primary CDR-SB endpoint at 104 weeks, tempering the GLP-1/insulin-resistance hypothesis for established AD.','Cummings JL, et al. EVOKE/EVOKE+ (CTAD 2025)');
Q('neuro',1,'Which neuronal population shows the earliest and most prominent loss underlying the “cholinergic hypothesis” of AD?',['Basal forebrain (nucleus basalis of Meynert) cholinergic neurons','Locus coeruleus noradrenergic neurons','Dorsal raphe serotonergic neurons','Substantia nigra dopaminergic neurons','Cerebellar Purkinje cells'],0,'Nucleus basalis neurons project to cortex and are lost early; cortical ChAT activity falls markedly in AD (Davies & Maloney 1976).',R_KZ);
Q('neuro',1,'Acetylcholine in the presynaptic terminal is synthesised by:',['Choline acetyltransferase (ChAT) from choline and acetyl-CoA','Acetylcholinesterase','Tyrosine hydroxylase','Glutamic acid decarboxylase','Monoamine oxidase'],0,'ChAT combines choline and acetyl-CoA; VAChT loads vesicles; AChE hydrolyses ACh in the cleft; CHT recaptures choline.',R_KZ);
Q('neuro',2,'Excitotoxicity in AD results chiefly from:',['Sustained NMDA-receptor activation → excess Ca²⁺ influx, ROS and mitochondrial injury','Excess GABA-A activation','Loss of AMPA receptors causing hyperexcitability','Acetylcholine overflow','Inhibition of voltage-gated Na⁺ channels'],0,'Chronic low-level glutamate (relieved Mg²⁺ block, impaired uptake) causes tonic Ca²⁺ entry, activating calpains, nNOS and the mitochondrial permeability transition.',R_GG);
Q('anat',1,'The earliest typical clinical manifestation of Alzheimer disease reflects dysfunction of the:',['Medial temporal lobe / hippocampus — anterograde episodic memory loss','Occipital lobe — visual agnosia','Cerebellum — ataxia','Primary motor cortex — hemiparesis','Basal ganglia — chorea'],0,'Entorhinal–hippocampal tau pathology produces impaired encoding of new memories with relative preservation of remote memory early on.',R_HAR);
Q('anat',2,'A patient with AD cannot calculate change, dress properly, or copy a figure. Which region is most implicated?',['Parietal association cortex','Primary visual cortex','Cerebellar vermis','Hypothalamus','Brainstem tegmentum'],0,'Parietal involvement causes visuospatial deficits, apraxia and acalculia, typically at the mild–moderate stage (Braak V).',R_HAR);
Q('anat',2,'Which MRI finding is characteristic of early typical AD?',['Medial temporal (hippocampal) atrophy','Midbrain “hummingbird” atrophy','Caudate head atrophy','Bilateral thalamic infarcts','Knife-edge frontotemporal atrophy'],0,'Hippocampal/medial temporal atrophy (MTA score) is typical. Hummingbird sign = PSP; caudate atrophy = Huntington disease; knife-edge = bvFTD.',R_HAR);
Q('chei',1,'Donepezil improves cognition in AD primarily by:',['Reversibly inhibiting acetylcholinesterase, increasing synaptic acetylcholine','Blocking NMDA receptors','Removing amyloid plaques','Inhibiting BACE1','Activating nicotinic receptors directly'],0,'Increased ACh at surviving cholinergic synapses enhances nicotinic/muscarinic signalling — symptomatic, not disease modifying.',R_KZ);
Q('chei',1,'The most common adverse effects of cholinesterase inhibitors are:',['Nausea, vomiting and diarrhoea','Dry mouth and urinary retention','Hypertensive crisis','Tardive dyskinesia','Hyperglycaemia'],0,'Peripheral cholinergic (muscarinic) effects: GI upset, anorexia/weight loss, bradycardia, syncope. Dry mouth/urinary retention are anticholinergic effects.',R_KZ);
Q('chei',3,'A 78-year-old man with moderate AD has HR 44 bpm and second-degree (Mobitz I) AV block, and is not on AV-nodal drugs. Which is the most appropriate dementia pharmacotherapy?',['Donepezil 10 mg daily','Rivastigmine patch 9.5 mg/24 h','Galantamine ER 16 mg','Memantine titrated to 10 mg BID','Lecanemab 10 mg/kg IV every 2 weeks'],3,'All cholinesterase inhibitors are vagotonic and can worsen bradycardia/heart block. Memantine is labelled for moderate–severe AD and lacks cholinergic cardiac effects. Anti-amyloid antibodies are not indicated beyond mild dementia.',R_KZ);
Q('chei',2,'Which statement about rivastigmine is correct?',['It inhibits both AChE and BuChE (pseudo-irreversibly), has no CYP450 metabolism, and the patch has fewer GI effects','It is selective for BuChE only','It is a competitive NMDA antagonist','It requires CYP2D6 activation','It is approved only for severe AD'],0,'Rivastigmine carbamylates AChE and BuChE, is hydrolysed by the cholinesterases themselves, and is also approved for Parkinson disease dementia. Transdermal delivery lowers peak levels and GI toxicity.',R_KZ);
Q('chei',2,'Galantamine differs from donepezil in that it:',['Also acts as an allosteric potentiator of nicotinic receptors and is a CYP2D6/3A4 substrate','Is irreversible','Blocks NMDA receptors','Is approved for severe AD only','Has no GI adverse effects'],0,'Galantamine is a competitive reversible AChE inhibitor plus a nicotinic allosteric modulator; CYP2D6 inhibitors (e.g., paroxetine) raise exposure.',R_KZ);
Q('chei',2,'A patient with moderate AD taking donepezil also takes oxybutynin for overactive bladder. The best action is to:',['Replace oxybutynin with a non-anticholinergic option (e.g., mirabegron) or deprescribe it','Increase the donepezil dose','Add a second cholinesterase inhibitor','Continue both; there is no interaction','Add benztropine'],0,'Anticholinergics directly oppose ChEI therapy and worsen cognition/delirium (AGS Beers criteria). Choose a β3 agonist or non-drug measures.','AGS Beers Criteria 2023');
Q('mem',1,'Memantine’s mechanism of action is best described as:',['Uncompetitive, low-affinity NMDA-receptor channel blocker with a fast off-rate','Competitive AChE inhibitor','AMPA-receptor potentiator','BACE1 inhibitor','Selective serotonin reuptake inhibitor'],0,'Open-channel block that is voltage-dependent and rapidly reversible: blocks pathological tonic activation but spares phasic synaptic signalling.',R_GG);
Q('mem',1,'Memantine is FDA-approved for AD at which severity?',['Moderate to severe','Preclinical','MCI only','Mild only','Only in combination with an antibody'],0,'Memantine has modest benefit in moderate–severe AD; trials in mild AD/MCI showed no benefit.',R_KZ);
Q('mem',2,'A patient with moderate AD and CrCl 22 mL/min develops dizziness and confusion on memantine 10 mg BID. The next best step is to:',['Reduce to the renally adjusted target (5 mg BID) and monitor','Increase to 20 mg BID','Add meclizine','Switch to galantamine without evaluation','Stop all treatment forever'],0,'Memantine is renally eliminated; in severe renal impairment (CrCl 5–29) the target dose is 5 mg BID (XR 14 mg/day).','Namenda (memantine) prescribing information');
Q('mem',1,'Which statement about memantine is TRUE?',['It provides symptomatic benefit but does not alter amyloid or tau pathology','It clears amyloid plaque','It cures AD when started early','It is a cholinesterase inhibitor','It causes ARIA'],0,'Memantine is not disease modifying; it reduces excitotoxic noise and modestly stabilises cognition and function.',R_GG);
Q('mab',1,'Donanemab differs from lecanemab in that it targets:',['N3pG pyroglutamate-modified Aβ within established plaque','Soluble Aβ protofibrils','Tau','BACE1','APOE'],0,'Donanemab binds a modified Aβ epitope present only in deposited plaque, giving rapid plaque clearance and allowing limited-duration therapy. Lecanemab preferentially binds soluble protofibrils.','Sims JR, et al. JAMA 2023;330:512–27');
Q('mab',2,'ARIA-E refers to:',['Amyloid-related imaging abnormality with edema/effusion; risk is highest in APOE ε4 homozygotes','Hemosiderin deposition only','Cerebral atrophy','Embolic infarction','Aspiration pneumonia'],0,'ARIA-E = vasogenic edema/sulcal effusion; ARIA-H = microhemorrhage/superficial siderosis. Both occur more often with APOE ε4 and early in treatment (first ~6 months).','Cummings J, et al. Alzheimers Dement 2023 (AUC for lecanemab)');
Q('mab',2,'Before starting an anti-amyloid antibody, which is required or strongly recommended?',['Confirmation of amyloid pathology, baseline MRI, and APOE ε4 genotyping with counselling','A lumbar puncture only in all patients','Tau PET','Cardiac stress test','Serum drug level'],0,'Confirm amyloid (PET, CSF or validated blood test), baseline MRI to exclude microhemorrhage burden/siderosis, and counsel on ARIA risk using APOE genotype.','Leqembi/Kisunla prescribing information');
Q('mab',2,'Which combination presents the greatest concern for a patient being considered for lecanemab?',['Therapeutic anticoagulation and multiple microhemorrhages on MRI','Hypertension controlled on amlodipine','Mild GERD','Type 2 diabetes on metformin','Seasonal allergies'],0,'Anticoagulation and microhemorrhage burden increase the risk of ARIA-H and intracerebral hemorrhage; thrombolytics must be avoided in treated patients.','Leqembi prescribing information');
Q('mab',3,'The 2025 FDA label update for donanemab changed the recommended titration so that it:',['Starts at 350 mg, then 700 mg, 1,050 mg and 1,400 mg every 4 weeks, lowering ARIA-E versus the original schedule','Uses oral dosing','Doubles the first dose','Eliminates MRI monitoring','Allows use in moderate dementia'],0,'TRAILBLAZER-ALZ 6: shifting one vial from dose 1 to dose 3 reduced ARIA-E at 24 weeks (≈14% vs 24%) with similar amyloid and p-tau217 lowering.','Wang H, et al. Alzheimers Dement 2025; Kisunla prescribing information');
Q('mab',2,'In the Clarity AD trial, lecanemab produced which result at 18 months?',['A 0.45-point smaller CDR-SB increase (≈ 27% slowing) versus placebo','Complete halt of decline','Reversal to normal cognition','No difference from placebo','A 90% reduction in ARIA'],0,'Primary endpoint: CDR-SB difference −0.45 (27% slowing), with substantial amyloid PET reduction; ARIA-E ≈ 12.6%, ARIA-H ≈ 17.3%.','van Dyck CH, et al. N Engl J Med 2023;388:9–21');
Q('mab',2,'Leqembi Iqlik (FDA, 2025) is approved as:',['A once-weekly 360 mg subcutaneous autoinjector for maintenance after the initial 18 months of IV therapy','An oral tablet','A replacement for MRI monitoring','A treatment for moderate dementia','A first-line initiation regimen from day 1'],0,'Subcutaneous maintenance maintains biomarker/clinical effect with far fewer systemic infusion reactions; an SC initiation dose was under review.','Eisai/Biogen; FDA approval August 2025');
Q('mab',3,'Aducanumab’s FDA approval in 2021 was controversial because it:',['Was an accelerated approval based on amyloid PET reduction as a surrogate while pivotal trials gave conflicting clinical results','Showed >50% slowing in both phase 3 trials','Was approved for moderate AD','Had no ARIA','Targeted tau'],0,'EMERGE was positive at high dose, ENGAGE negative. Aduhelm was later discontinued by Biogen.','Alexander GC, et al. JAMA 2021');
Q('bio',1,'The typical CSF biomarker pattern in Alzheimer disease is:',['↓ Aβ42 (↓ Aβ42/40), ↑ p-tau, ↑ total tau','↑ Aβ42, ↓ p-tau','Normal Aβ42 with ↑ 14-3-3 only','↓ Aβ42 with ↓ p-tau','↑ Aβ42 and ↑ NfL only'],0,'Aβ42 falls because it is sequestered in plaques; p-tau and t-tau rise with tangle pathology and neuronal injury.',R_JA);
Q('bio',2,'Which statement about PET imaging in AD is correct?',['Amyloid PET becomes positive early and plateaus, whereas tau PET uptake tracks clinical severity','Tau PET becomes positive before amyloid in typical AD','Amyloid PET tracks symptom severity linearly','Neither is useful for diagnosis','FDG-PET shows hypermetabolism in AD'],0,'Amyloid positivity precedes symptoms by ~15–20 years and plateaus; tau PET follows Braak staging and correlates with cognition. FDG shows temporoparietal hypometabolism.',R_JA);
Q('bio',3,'The Lumipulse plasma p-tau217/Aβ42 ratio, FDA-cleared in 2025, is intended for:',['Adults ≥ 55 with signs/symptoms of cognitive decline in specialised care, to aid detection of amyloid plaques — not as a screening or stand-alone test','Screening all asymptomatic adults','Replacing neuropsychological testing','Staging tau burden','Monitoring ARIA'],0,'The FDA noted high agreement with PET/CSF (≈ 92% PPV, 97% NPV in the study) with < 20% indeterminate results; false positives/negatives remain possible.','FDA press release, 16 May 2025');
Q('bio',2,'Elevated plasma neurofilament light (NfL) indicates:',['Non-specific axonal injury/neurodegeneration that is not specific for AD','Amyloid plaques specifically','Tau tangles specifically','Cholinergic loss','Microglial activation only'],0,'NfL rises in many neurodegenerative and other conditions (also with age and kidney disease); it is the “N” marker, not diagnostic of AD by itself.',R_JA);
Q('bio',2,'A patient has normal amyloid PET and CSF Aβ42/40 but a markedly atrophic hippocampus and elevated NfL (A−T−N+). The best interpretation is:',['Neurodegeneration from a non-AD pathology (e.g., vascular, Lewy body, TDP-43)','Preclinical AD','Typical AD that does not need amyloid testing','Normal ageing','Contraindication to all drugs'],0,'The absence of amyloid argues against AD biology; N+ indicates neuronal injury from other causes, so amyloid-targeted therapy is not appropriate.',R_JA);
Q('bio',1,'Preclinical Alzheimer disease is defined as:',['Cognitively unimpaired individuals with biomarker evidence of AD pathology','MCI with positive amyloid PET','Mild dementia with normal biomarkers','Any person with APOE ε4','Dementia with plaques only'],0,'Biomarker-positive (amyloid ± tau) cognitively normal individuals; no approved therapy outside trials.',R_JA);
Q('case',3,'A 72-year-old woman with amyloid-positive MCI takes apixaban for atrial fibrillation; MRI shows 8 cerebral microhemorrhages. The best management is:',['Do not start an anti-amyloid antibody; optimise vascular risk, safety and supportive care and monitor','Lecanemab with monthly MRI','Donanemab with alteplase on standby','Donepezil to slow conversion from MCI','Memantine 20 mg daily'],0,'Anticoagulation plus > 4 microhemorrhages is an exclusion/high-risk situation for ARIA-H. ChEIs and memantine have no proven benefit in MCI.','Leqembi/Kisunla prescribing information; AUC');
Q('case',2,'A patient on lecanemab for 3 months develops headache and confusion; MRI shows ARIA-E. The best next step is to:',['Hold dosing, repeat MRI to follow resolution and manage supportively; never give thrombolytics','Continue infusion; ARIA is benign','Give IV alteplase for presumed stroke','Double the dose','Start high-dose donepezil'],0,'Symptomatic or moderate–severe ARIA requires suspending antibody dosing and MRI follow-up; steroids are reserved for severe/persistent cases. ARIA can mimic stroke — thrombolysis has caused fatal hemorrhage.','Cummings J, et al. 2023 AUC');
Q('case',3,'A 68-year-old man with amyloid-positive MCI is APOE ε4/ε4 and takes no anticoagulants. Which counselling is most appropriate?',['He is eligible but has the highest ARIA risk; discuss risks/benefits, intensive MRI surveillance and shared decision-making','Eligibility is denied because of APOE','APOE status does not affect risk','ARIA occurs only after 3 years','Take aspirin 325 mg daily to prevent ARIA'],0,'ε4 homozygotes have ARIA-E ≈ 33% (lecanemab) and ≈ 41% (donanemab, original schedule); treatment remains possible after informed discussion.','Leqembi/Kisunla prescribing information');
Q('case',2,'A patient with moderate AD becomes agitated in the evening. The best first-line approach is:',['Identify triggers (pain, infection, constipation, drugs) and use non-pharmacological strategies first','Start haloperidol','Add diphenhydramine at night','Give lorazepam three times daily','Increase donepezil to 23 mg immediately'],0,'Antipsychotics carry a boxed warning for increased mortality in dementia; benzodiazepines and antihistamines worsen cognition and falls.','APA Practice Guideline on antipsychotics in dementia, 2016');
Q('emerg',2,'Why did BACE inhibitors (e.g., verubecestat) fail in clinical trials despite robustly lowering CSF Aβ?',['Cognition worsened or did not improve, likely from inhibiting other BACE1 substrates and treating too late','They caused hyperglycaemia','They increased amyloid plaque','They could not cross the blood–brain barrier','They were never tested in humans'],0,'Multiple BACE inhibitor trials stopped for futility or cognitive/behavioural worsening, revealing the importance of timing and off-target effects.','Egan MF, et al. N Engl J Med 2019;380:1408–20');
Q('case',2,'An 81-year-old woman with severe AD (MMSE 6) has been stable on donepezil 10 mg daily for a year; her caregiver asks whether anything can be added. Which addition has supporting evidence?',['Memantine (ChEI + memantine combination)','A second cholinesterase inhibitor (rivastigmine patch)','Lecanemab 10 mg/kg IV every 2 weeks','Haloperidol 1 mg nightly for sleep','Diphenhydramine 25 mg nightly'],0,'Memantine is labelled for moderate–severe AD and acts on a different target (NMDA); ChEI + memantine is a rational, widely used combination. Two ChEIs duplicate therapy; antibodies are not indicated beyond mild dementia; antipsychotics and anticholinergics are harmful in dementia.','Tariot PN, et al. JAMA 2004;291:317–24; Namzaric prescribing information');

(function(){
 let root,body,timer=null,run=null;
 const lt=['A','B','C','D','E'];
 function stat(t,ok){const s=Store.d.topic[t]||(Store.d.topic[t]={n:0,c:0});s.n++;if(ok)s.c++;Store.save()}
 function clearTimer(){if(timer){clearInterval(timer);timer=null}}
 function menu(){clearTimer();run=null;body.textContent='';const Q0=Store.d.quiz,sc=k=>Q0[k]?`best ${Q0[k].best}% · last ${Q0[k].last}% · ${Q0[k].n} attempt${Q0[k].n>1?'s':''}`:'not attempted';
  const card=(t,d,sub,fn,cls)=>h('button',{class:'mc',type:'button',onclick:fn},h('b',null,t),h('span',null,d),h('br'),h('span',{style:{color:'var(--brand)'},text:sub}));
  const g=h('div',{class:'modcards'},card('Pretest · 15 questions','Baseline knowledge check before the modules.',sc('pre'),()=>start('pre','Pretest',PRE)),card('Posttest · 25 questions','Measure learning after the modules.',sc('post'),()=>start('post','Posttest',POST)),card('Advanced board exam · 50 questions','NAPLEX/USMLE-style, vignette-based, with rationales and references.',sc('board'),()=>start('board','Advanced board exam',BANK.map(q=>q.id))),card('⏱ Cognitive Challenge','60-second rapid-fire with streak multiplier.',Q0.chal?`best score ${Store.d.chal.best}`:'not attempted',challenge),card('🩺 Clinical Decision Mode','Five patients — choose the best regimen each time.',Q0.dec?`best ${Q0.dec.best}/20`:'not attempted',decision));
  body.append(h('div',{class:'card'},h('h3',{text:'Choose an assessment'}),g),h('p',{class:'disc',text:'Questions are written to NAPLEX/USMLE style with immediate feedback, rationale and a reference. Option order is shuffled each attempt.'}));
  const pre=Q0.pre,post=Q0.post;if(pre&&post)body.append(h('div',{class:'okbox',html:`<b>Learning gain:</b> pretest ${pre.last}% → posttest ${post.last}% (${post.last-pre.last>=0?'+':''}${post.last-pre.last} points).`}))}
 function shuf(ids){return shuffle(ids.map(id=>BANK.find(q=>q.id===id)))}
 function start(key,title,ids){clearTimer();run={key,title,list:shuf(ids),i:0,ok:0,streak:0,topic:{},wrong:[]};show()}
 function show(){const r=run,q=r.list[r.i];body.textContent='';const order=shuffle(q.o.map((t,i)=>({t,ok:i===q.a})));let done=false;
  const card=h('div',{class:'card q'},h('div',{class:'prog'},h('i',{style:{width:(r.i/r.list.length*100)+'%'}})),h('p',{class:'disc',text:`${r.title} · question ${r.i+1} of ${r.list.length} · ${TOPICS[q.t]} · ${['','Foundation','Application','Advanced'][q.d]}`}),h('div',{class:'stem',text:q.q,role:'heading','aria-level':'3'}));
  const box=h('div',{class:'opts',role:'group','aria-label':'Answer choices'}),fb=h('div');
  order.forEach((o,i)=>{const b=h('button',{class:'opt',type:'button',onclick:()=>{if(done)return;done=true;const ok=o.ok;stat(q.t,ok);r.topic[q.t]=r.topic[q.t]||{n:0,c:0};r.topic[q.t].n++;if(ok){r.ok++;r.streak++;r.topic[q.t].c++;App.addPts(2);if(r.streak>=5)App.award('streak5')}else{r.streak=0;r.wrong.push(q)}
   $$('.opt',box).forEach((x,j)=>{x.disabled=true;if(order[j].ok){x.classList.add('correct');x.append(h('span',{class:'mk',text:'✔'}))}else if(x===b){x.classList.add('wrong');x.append(h('span',{class:'mk',text:'✘'}))}});
   fb.append(h('div',{class:ok?'okbox':'badbox'},h('b',{text:ok?'Correct. ':'Incorrect. '}),h('span',{text:q.r})),h('p',{class:'disc',text:'Reference: '+q.ref}));
