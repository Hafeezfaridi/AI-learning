<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Advanced Antibiotics Pharmacology &amp; Antimicrobial Stewardship Simulator</title>
<meta name="description" content="Offline PharmD simulator: antibiotic classes, mechanisms, resistance, PK/PD, stewardship, cases and NAPLEX-style quizzes.">
<style>
:root{--bg:#f4f1ea;--bg2:#ebe7dc;--surface:#fffdf8;--surface2:#f3efe5;--ink:#1b2430;--muted:#566273;--line:#d9d3c4;--accent:#0b7a75;--accent-ink:#fff;--accent-soft:#d5ece9;--good:#18794e;--good-soft:#dcf1e5;--bad:#b42318;--bad-soft:#fbe0dc;--warn:#9a5700;--warn-soft:#fbebcf;--drug:#2354d6;--bug:#c2410c;--shadow:0 1px 2px rgba(20,30,40,.06),0 8px 24px rgba(20,30,40,.08);--r:14px;--h0:#ece8dd;--h1:#c4e6df;--h2:#6cc2b4;--h3:#0b7a75;--h3ink:#fff;--h2ink:#06211e;
--font:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
[data-theme=dark]{--bg:#0d1520;--bg2:#101c2a;--surface:#15212f;--surface2:#1b2a3b;--ink:#e7eef6;--muted:#9bacbf;--line:#2a3b50;--accent:#3ed6c4;--accent-ink:#06211e;--accent-soft:#12403d;--good:#4ade80;--good-soft:#123826;--bad:#ff8579;--bad-soft:#47211d;--warn:#fbbf5c;--warn-soft:#3d2d10;--drug:#7aa2ff;--bug:#ff9a62;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--h0:#1b2a3b;--h1:#16504b;--h2:#1f8f84;--h3:#3ed6c4;--h3ink:#06211e;--h2ink:#fff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);background-image:radial-gradient(900px 400px at 85% -10%,var(--accent-soft),transparent 70%);background-repeat:no-repeat;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,h4{font-family:var(--serif);line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
h2{font-size:1.7rem}h3{font-size:1.2rem}h4{font-size:1rem;font-family:var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
p{margin:.4em 0 .8em}
a{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--drug);outline-offset:2px;border-radius:6px}
.top{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;padding:10px clamp(12px,3vw,28px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center;font-family:var(--serif);font-weight:700;cursor:pointer;background:none;border:0;color:var(--ink);font-size:1rem;text-align:left;padding:0}
.brand svg{flex:none}
.brand small{display:block;font-family:var(--font);font-weight:500;color:var(--muted);font-size:.72rem;letter-spacing:.04em}
.brand .au{display:block;font-family:var(--font);font-weight:600;font-size:.8rem;color:var(--accent);letter-spacing:.01em}
.spacer{flex:1}
.lvl{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.lvl b{color:var(--ink)}
.xpbar{width:90px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--drug));transition:width .6s}
.ib{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 10px;cursor:pointer;font:inherit;font-size:.85rem;display:inline-flex;gap:6px;align-items:center}
.ib:hover{border-color:var(--accent)}
.ib[aria-pressed=true]{background:var(--accent-soft)}
main{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:clamp(14px,3vw,30px)}
main:focus{outline:none}
footer{padding:18px;text-align:center;color:var(--muted);font-size:.78rem;border-top:1px solid var(--line)}
.view{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes swell{0%,100%{transform:scale(1)}60%{transform:scale(1.07)}85%{transform:scale(1.1) skewX(3deg);opacity:.6}}
@keyframes dash{to{stroke-dashoffset:-24}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* hero & dashboard */
.hero{display:grid;gap:18px;grid-template-columns:1.4fr 1fr;align-items:center;margin-bottom:26px}
.hero h1{font-size:clamp(1.7rem,4.2vw,2.8rem)}
.hero p{color:var(--muted);max-width:60ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--serif);font-size:1.6rem}
.stat span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.dcard{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;color:var(--ink);font:inherit;box-shadow:var(--shadow);transition:transform .25s,border-color .25s;overflow:hidden;animation:rise .55s both}
.dcard:hover{transform:translateY(-4px);border-color:var(--accent)}
.dcard .n{position:absolute;right:14px;top:6px;font-family:var(--serif);font-size:3.2rem;font-weight:700;color:var(--line);line-height:1}
.dcard .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;background:var(--accent-soft);margin-bottom:12px}
.dcard h3{margin-bottom:.3em}
.dcard p{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.dcard .pg{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.dcard .pg i{display:block;height:100%;background:var(--accent);transition:width .8s}
/* components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(14px,2.2vw,22px);box-shadow:var(--shadow);margin-bottom:16px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.col{flex:1 1 320px;min-width:0}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:5px 11px;border-radius:99px;font:inherit;font-size:.82rem;cursor:pointer}
.chip[aria-pressed=true],.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:700;letter-spacing:.03em}
.tag.good{background:var(--good-soft);color:var(--good)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.info{background:var(--accent-soft);color:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{border:0;background:none;padding:9px 14px;font:inherit;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.callout{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0}
.callout.bad{border-color:var(--bad);background:var(--bad-soft)}.callout.warn{border-color:var(--warn);background:var(--warn-soft)}.callout.good{border-color:var(--good);background:var(--good-soft)}
.mhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.mhead h2{margin:0}
.crumb{color:var(--muted);font-size:.85rem}
select,input[type=text]{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
label{font-size:.85rem;color:var(--muted);display:block;margin-bottom:3px}
.sl{margin:10px 0}
.sl .lab{display:flex;justify-content:space-between;font-size:.88rem}
.sl .lab b{font-family:var(--mono)}
input[type=range]{width:100%;accent-color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.scroll{overflow-x:auto}
ul.tight{margin:.3em 0 .8em;padding-left:1.1em}ul.tight li{margin:.15em 0}
/* quiz */
.q{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface2);margin:10px 0}
.q p.stem{font-weight:600;margin-top:0}
.opt{display:block;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;transition:border-color .2s,background .2s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.opt:disabled{cursor:default}
.exp{margin-top:8px;font-size:.9rem;animation:rise .3s both}
.prog{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .4s}
/* SVG themes */
svg text{font-family:var(--font);fill:var(--ink)}
.svgbox{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:6px}
.svgbox svg{width:100%;height:auto;display:block}
.cwall{fill:none;stroke:#8a6d3b;stroke-width:9}
.cmemb{fill:var(--accent-soft);stroke:var(--accent);stroke-width:4}
.cdna{fill:none;stroke:var(--drug);stroke-width:3;stroke-linecap:round}
.cr50{fill:#b98a2e}.cr30{fill:#d9b45e}
.crna{fill:#7c3aed}.cfol{fill:#0f9d77}
.dp{fill:var(--drug);stroke:var(--surface);stroke-width:1}
svg[data-k=wall] .cwall{stroke:var(--bad);animation:pulse 1s infinite}
svg[data-k=memb] .cmemb,svg[data-k=memb] .cmemb2{stroke:var(--bad);stroke-dasharray:6 6;animation:dash 1s linear infinite}
svg[data-k=dna] .cdna{stroke:var(--bad);stroke-dasharray:5 7;animation:dash 1s linear infinite}
svg[data-k=p30] .cr30,svg[data-k=p50] .cr50,svg[data-k=rna] .crna,svg[data-k=fol] .cfol{fill:var(--bad);animation:pulse .9s infinite}
svg[data-k=wall] .cellbody{transform-box:fill-box;transform-origin:center;animation:swell 3s ease-in-out infinite}
svg[data-k=memb] .cellbody{opacity:.85}
.noanim *{animation:none!important;transition:none!important}
/* heat */
.heat{display:grid;gap:4px;align-items:stretch}
.hc{padding:8px 6px;border-radius:8px;text-align:center;font-size:.8rem;font-weight:700;transition:background .5s,color .5s,transform .3s;min-height:38px;display:flex;align-items:center;justify-content:center}
.hc.l0{background:var(--h0);color:var(--muted)}.hc.l1{background:var(--h1);color:var(--ink)}.hc.l2{background:var(--h2);color:var(--h2ink)}.hc.l3{background:var(--h3);color:var(--h3ink)}
.hl{font-size:.78rem;color:var(--muted);display:flex;align-items:center;font-weight:600}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.78rem;margin-top:8px}
.legend span{display:inline-flex;gap:5px;align-items:center}.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
/* battle */
.bugs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.bugb{background:var(--surface2);border:1.5px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;text-align:center;font:inherit;color:var(--ink)}
.bugb[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.bugb svg{width:54px;height:40px}
.bugb b{display:block;font-size:.8rem;line-height:1.2}
.druglist{display:flex;flex-wrap:wrap;gap:6px;max-height:190px;overflow:auto;padding:4px}
.score{font-family:var(--serif);font-size:3rem;font-weight:700;line-height:1}
.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;max-width:330px}
.dots i{aspect-ratio:1;border-radius:50%;background:var(--bug);transition:opacity .4s,background .4s}
.dots i.r{background:#7c3aed}
/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcell{padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font:inherit;color:var(--ink);cursor:pointer;min-height:48px}
.mcell.sel{border-color:var(--drug);background:var(--accent-soft)}
.mcell.done{border-color:var(--good);background:var(--good-soft);opacity:.65;cursor:default}
.mcell.wrong{animation:shake .35s;border-color:var(--bad)}
/* tree */
.node{animation:pop .4s both}
.path{display:flex;gap:6px;flex-wrap:wrap;font-size:.8rem;margin-bottom:10px}
.path span{background:var(--surface2);border:1px solid var(--line);padding:3px 9px;border-radius:99px}
/* metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.metric{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.metric span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block}
.metric b{font-family:var(--serif);font-size:1.5rem}
.metric small{display:block;font-size:.75rem}
.up{color:var(--bad)}.dn{color:var(--good)}
canvas{width:100%;height:auto;display:block;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.pol{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1.5px solid var(--line);border-radius:12px;margin:8px 0;background:var(--surface);cursor:pointer;width:100%;text-align:left;font:inherit;color:var(--ink)}
.pol[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.pol .cost{margin-left:auto;font-family:var(--mono);font-size:.8rem;white-space:nowrap}
.badge{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:4px;background:var(--surface2)}
.badge.locked{opacity:.4;filter:grayscale(1)}
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;box-shadow:var(--shadow);animation:rise .3s both;font-size:.88rem}
.bar2{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:.85rem}
.bar2 .lbl{width:120px;flex:none}
.bar2 .prog{flex:1}
@media(max-width:760px){.hero{grid-template-columns:1fr}.lvl .xpbar{display:none}.brand small{display:none}.mgrid{grid-template-columns:1fr}.bar2 .lbl{width:90px}}
@media(max-width:560px){.lvl{display:none}.ib span{display:none}.brand{font-size:.88rem}.top{gap:8px}.brand svg{width:28px;height:28px}.grid{grid-template-columns:1fr}.bugs{grid-template-columns:repeat(2,1fr)}.dots{max-width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{.top,footer,#toasts{display:none}}
</style>
</head>
<body>
<a class="skip" href="#app">Skip to main content</a>
<header class="top" role="banner">
  <button class="brand" id="homeBtn" aria-label="Go to dashboard">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="var(--accent)"/><ellipse cx="17" cy="17" rx="10" ry="6" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" transform="rotate(-35 17 17)"/><circle cx="23" cy="11" r="2.6" fill="var(--accent-ink)"/></svg>
    <span>Antibiotics &amp; Stewardship Simulator<b class="au">Hafeez Faridi, Ph.D.</b><small>PharmD · Infectious Diseases</small></span>
  </button>
  <div class="spacer"></div>
  <div class="lvl" id="lvl" aria-label="Learner level"></div>
  <button class="ib" id="animBtn" aria-pressed="true" title="Toggle animations">✨ <span>Motion</span></button>
  <button class="ib" id="themeBtn" aria-label="Toggle dark and light mode" title="Toggle theme">🌓 <span id="themeLbl">Dark</span></button>
</header>
<main id="app" tabindex="-1"></main>
<div id="live" class="sr" aria-live="polite" role="status"></div>
<div id="toasts"></div>
<footer>Educational simulator for PharmD learners. Doses and recommendations are simplified for teaching; always verify against current local guidelines (IDSA, ATS, ASHP, institutional antibiograms) and product labeling before clinical use.</footer>
<script>
'use strict';
/* ============ CORE ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const KEY='abxsim.v1';
const defaults=()=>({theme:null,anim:true,xp:0,visited:{},quiz:{},wrong:[],cases:{},battle:{runs:0,wins:0,fails:0,resist:0,seen:{}},match:{best:{},rounds:0},stew:{best:0,consults:{},runs:0},classQ:{},tree:{},pkpd:{moves:0},badges:{},answered:0,correct:0,res:{}});
let S=(()=>{try{return Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return defaults()}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const fmt=(x,d=1)=>Number.isFinite(x)?x.toFixed(d):'–';
const live=m=>{$('#live').textContent='';setTimeout(()=>$('#live').textContent=m,40)};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),3200)}
const level=()=>Math.floor(Math.sqrt(S.xp/40))+1;
const lvlBase=l=>(l-1)*(l-1)*40;
function renderLvl(){const l=level(),a=lvlBase(l),b=lvlBase(l+1);$('#lvl').innerHTML=`Level <b>${l}</b> <span class="xpbar" title="${S.xp} XP"><i style="width:${clamp((S.xp-a)/(b-a)*100,0,100)}%"></i></span> <b>${S.xp}</b> XP`}
const BADGES=[
 ['first','🔬','First Steps','Open any module',s=>Object.keys(s.visited).length>=1],
 ['explorer','🧭','Explorer','Visit all 12 modules',s=>Object.keys(s.visited).length>=12],
 ['classy','🧪','Class Act','Answer 8 class practice questions correctly',s=>Object.values(s.classQ).filter(Boolean).length>=8],
 ['quiz20','🎯','Sharp Shooter','Answer 20 quiz questions correctly',s=>s.correct>=20],
 ['quiz80','🏅','Board Ready','Answer 80 quiz questions correctly',s=>s.correct>=80],
 ['battle','⚔️','Bug Slayer','Win 5 battles',s=>s.battle.wins>=5],
 ['cre','🛡️','CRE Crusher','Defeat CRE with an active agent',s=>s.battle.seen.cre_win],
 ['cases','🩺','Clinician','Complete 4 cases',s=>Object.keys(s.cases).length>=4],
 ['steward','🌿','Steward','Score 80+ in Stewardship Command Center',s=>s.stew.best>=80],
 ['match','🧩','Matchmaker','Finish 3 matching rounds',s=>s.match.rounds>=3],
 ['pkpd','📈','PK/PD Tinkerer','Adjust PK/PD controls 25 times',s=>s.pkpd.moves>=25],
 ['tree','🌳','Pathfinder','Complete 3 decision trees',s=>Object.keys(s.tree).length>=3]];
function addXP(n){const l0=level();S.xp+=n;const l1=level();BADGES.forEach(b=>{if(!S.badges[b[0]]&&b[4](S)){S.badges[b[0]]=Date.now();toast(`${b[1]} Badge unlocked: ${b[2]}`)}});if(l1>l0)toast(`⬆️ Level ${l1}!`);save();renderLvl()}
/* theme + motion */
function applyTheme(){const t=S.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;$('#themeLbl').textContent=t==='dark'?'Light':'Dark'}
function applyAnim(){const on=S.anim&&!matchMedia('(prefers-reduced-motion:reduce)').matches;document.body.classList.toggle('noanim',!on);$('#animBtn').setAttribute('aria-pressed',S.anim);$$('svg').forEach(s=>{try{on?s.unpauseAnimations():s.pauseAnimations()}catch(e){}})}
/* ============ QUESTION ENGINE ============ */
const Q=(c,q,o,a,e)=>({c,q,o:o.split('|'),a,e});
function renderQ(box,q,cb,opts={}){
  const order=shuffle(q.o.map((t,i)=>i));let done=false;
  box.innerHTML=`<div class="q"><p class="stem">${q.q}</p><div role="group" aria-label="Answer choices">${order.map((i,k)=>`<button class="opt" data-i="${i}"><b>${'ABCDE'[k]}.</b> ${q.o[i]}</button>`).join('')}</div><div class="exp" hidden></div></div>`;
  $$('.opt',box).forEach(b=>b.onclick=()=>{if(done)return;done=true;const ok=+b.dataset.i===q.a;
    $$('.opt',box).forEach(x=>{x.disabled=true;if(+x.dataset.i===q.a)x.classList.add('ok')});if(!ok)b.classList.add('no');
    const e=$('.exp',box);e.hidden=false;e.innerHTML=`<span class="tag ${ok?'good':'bad'}">${ok?'Correct':'Incorrect'}</span> ${q.e}`;live(ok?'Correct':'Incorrect');cb&&cb(ok)})
}

function pkSim(p,crcl,vdm){
  const vd=p.vd*vdm,cl=p.cl*((1-p.fr)+p.fr*crcl/100),ke=cl/vd,tinf=Math.min(p.tinf,p.tau),R=p.dose/tinf,th=Math.LN2/ke;
  const N=clamp(Math.ceil(5*th/p.tau)+1,3,10),T=N*p.tau,dt=Math.max(T/1200,.02);
  const conc=t=>{let c=0;for(let i=0;i<N;i++){const s=t-i*p.tau;if(s<0)continue;c+=s<=tinf?R/cl*(1-Math.exp(-ke*s)):R/cl*(1-Math.exp(-ke*tinf))*Math.exp(-ke*(s-tinf))}return c};
  const pts=[];for(let t=0;t<=T+1e-9;t+=dt)pts.push([t,conc(t)]);
  const t0=(N-1)*p.tau;let cmax=0,auc=0,above=0,n=0,prev=null;
  for(let t=t0;t<=T;t+=dt){const c=conc(t);cmax=Math.max(cmax,c);if(prev!==null)auc+=(c+prev)/2*dt;prev=c;n++;if(p.fu*c>p.mic)above++}
  const cmin=conc(T-1e-6),auc24=auc*24/p.tau;
  return {pts,T,N,th,cl,ke,cmax,cmin,auc24,ft:above/n*100,cmaxMic:p.fu*cmax/p.mic,aucMic:p.fu*auc24/p.mic,ss:5*th/p.tau<=N-1};
}

  const cv=$('#sc'),ctx=cv.getContext('2d'),col=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  function chart(m){const W=cv.width,H=cv.height,L=40,B=26;ctx.clearRect(0,0,W,H);ctx.font='11px sans-serif';ctx.fillStyle=col('--muted');ctx.strokeStyle=col('--line');
    for(let i=0;i<=4;i++){const y=14+i*(H-B-14)/4;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(W-8,y);ctx.stroke();ctx.fillText((120-i*10)+'%',2,y+4)}

    chart(m);score(m)}
  function score(m){const p=pscore(m),c=cscore(),tot=Math.round(.6*p+.4*c);$('#fs').textContent=tot;$('#fsd').textContent=`Policy impact ${p}/100 · Consults ${c}/100`;if(tot>S.stew.best){S.stew.best=tot;save();addXP(0)}}
  function consults(){$('#cons').innerHTML=CONSULT.map((c,i)=>{const a=S.stew.consults[i];return `<div class="q"><p class="stem">Consult ${i+1}: ${c.t}</p>${c.o.map((o,j)=>`<button class="opt ${a?(j===a.j?(o[1]===2?'ok':'no'):(o[1]===2?'ok':'')):''}" data-i="${i}" data-j="${j}" ${a?'disabled':''}>${o[0]}</button>`).join('')}${a?`<div class="exp"><span class="tag ${a.pts===2?'good':'bad'}">${a.pts===2?'Best answer':'Not ideal'}</span> ${c.o[a.j][2]}</div>`:''}</div>`}).join('');
    $$('#cons .opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,j=+b.dataset.j;S.stew.consults[i]={j,pts:CONSULT[i].o[j][1]};S.stew.runs++;save();addXP(CONSULT[i].o[j][1]?4:1);touch('steward','c'+i);consults();score(calc())})}
  $('#rc').onclick=()=>{S.stew.consults={};save();consults();score(calc())};
  upd();consults();
}
/* ============ MODULE 8 ============ */
function mCases(el){
  const home=()=>{el.innerHTML=`<p>Work through each case: empiric choice → culture interpretation → targeted therapy & duration.</p><div class="grid">${CASES.map(c=>{const r=S.cases[c.id];return `<button class="dcard" data-id="${c.id}" style="animation-delay:0s"><h3>${c.t}</h3><p>${c.v.slice(0,110)}…</p>${r?`<span class="tag ${r.score===r.max?'good':'warn'}">Best ${r.score}/${r.max}</span>`:'<span class="tag info">Not started</span>'}</button>`}).join('')}</div>`;$$('.dcard',el).forEach(b=>b.onclick=()=>play(CASES.find(c=>c.id===b.dataset.id)))};
  function play(c){let i=0,score=0;
    const show=()=>{const s=c.s[i];el.innerHTML=`<div class="card"><button class="btn ghost sm" id="bk">← Cases</button><h3 style="margin-top:10px">${c.t}</h3><div class="callout"><b>Patient:</b> ${c.v}</div>${c.cult&&i>=1?`<div class="callout warn"><b>Microbiology / data:</b> ${c.cult}</div>`:''}
      <div class="prog" style="margin:10px 0"><i style="width:${i/c.s.length*100}%"></i></div><h4>Step ${i+1} of ${c.s.length}</h4><div id="qq"></div><div id="nx"></div></div>`;
      $('#bk').onclick=home;renderQ($('#qq'),s,ok=>{if(ok)score++;S.answered++;if(ok)S.correct++;recordCat('Clinical cases',ok);save();addXP(ok?4:1);
        $('#nx').innerHTML=`<button class="btn" id="nb">${i<c.s.length-1?'Next step →':'Finish case'}</button>`;$('#nb').onclick=()=>{i++;i<c.s.length?show():fin()}})};
    const fin=()=>{const prev=S.cases[c.id];if(!prev||score>prev.score)S.cases[c.id]={score,max:c.s.length};save();touch('cases',c.id);addXP(score*3);
      el.innerHTML=`<div class="card"><h3>Case complete: ${c.t}</h3><div class="score">${score}/${c.s.length}</div><p>${score===c.s.length?'Excellent decision-making.':'Review explanations and retry to improve your best score.'}</p><button class="btn" id="rt">Retry</button> <button class="btn ghost" id="hm">All cases</button></div>`;$('#rt').onclick=()=>play(c);$('#hm').onclick=home};
    show()}
  home();
}
/* ============ MODULE 9 ============ */
function mMatch(el){
  let mode=Object.keys(MATCH)[0],timer=null;onLeave(()=>clearInterval(timer));
  el.innerHTML=`<p>Select a left item, then its matching right item. Six pairs per round. Faster and cleaner rounds earn more XP.</p><div id="mm" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px"></div><div class="card" id="mg"></div>`;
  const chips=()=>{$('#mm').innerHTML=Object.keys(MATCH).map(m=>`<button class="chip" aria-pressed="${m===mode}" data-m="${m}">${m}${S.match.best[m]?` · best ${S.match.best[m]}s`:''}</button>`).join('');$$('#mm .chip').forEach(b=>b.onclick=()=>{mode=b.dataset.m;chips();round()})};
  function round(){clearInterval(timer);touch('match',mode);const pairs=shuffle(MATCH[mode]).slice(0,6);let sel=null,done=0,miss=0,t=0;
    const L=shuffle(pairs.map((p,i)=>({i,t:p[0]}))),Rr=shuffle(pairs.map((p,i)=>({i,t:p[1]})));
    $('#mg').innerHTML=`<div class="mhead"><b id="tm">0s</b><span class="crumb" id="ms">Matched 0/6 · Mistakes 0</span></div><div class="mgrid"><div style="display:grid;gap:8px">${L.map(x=>`<button class="mcell" data-s="l" data-i="${x.i}">${x.t}</button>`).join('')}</div><div style="display:grid;gap:8px">${Rr.map(x=>`<button class="mcell" data-s="r" data-i="${x.i}">${x.t}</button>`).join('')}</div></div><div id="mf"></div>`;
    timer=setInterval(()=>{t++;$('#tm').textContent=t+'s'},1000);
    $$('#mg .mcell').forEach(b=>b.onclick=()=>{if(b.classList.contains('done'))return;
      if(b.dataset.s==='l'){$$('#mg .mcell[data-s=l]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;return}
      if(!sel){live('Select a left item first');return}
      if(sel.dataset.i===b.dataset.i){sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');sel=null;done++;
        $('#ms').textContent=`Matched ${done}/6 · Mistakes ${miss}`;
        if(done===6){clearInterval(timer);const xp=Math.max(3,12-miss*2-Math.floor(t/20));S.match.rounds++;if(!S.match.best[mode]||t<S.match.best[mode])S.match.best[mode]=t;save();addXP(xp);chips();
          $('#mf').innerHTML=`<div class="callout good"><b>Round complete in ${t}s with ${miss} mistake(s).</b> +${xp} XP <button class="btn sm" id="again" style="margin-left:10px">New round</button></div>`;$('#again').onclick=round}}
      else{miss++;b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),400);$('#ms').textContent=`Matched ${done}/6 · Mistakes ${miss}`}})}
  chips();round();
}
/* ============ MODULE 10 ============ */
function mTree(el){
  let key='sepsis',cur,path=[];
  el.innerHTML=`<p>Make stepwise decisions. Each pathway ends with a recommendation, rationale and a stewardship pearl.</p><div id="tc" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px"></div><div class="card" id="tb"></div>`;
  const chips=()=>{$('#tc').innerHTML=Object.keys(TREES).map(k=>`<button class="chip" aria-pressed="${k===key}" data-k="${k}">${TREES[k].t}${S.tree[k]?' ✓':''}</button>`).join('');$$('#tc .chip').forEach(b=>b.onclick=()=>{key=b.dataset.k;start();chips()})};
  function start(){cur=TREES[key].start;path=[];draw()}
  function draw(){const T=TREES[key],n=T.nodes[cur];touch('tree',key);
    const crumbs=path.length?`<div class="path">${path.map(p=>`<span>${p}</span>`).join('')}</div>`:'';
    if(n.end){if(!S.tree[key]){S.tree[key]=1;save();addXP(8)}$('#tb').innerHTML=`<h3>${T.t}</h3>${crumbs}<div class="node"><div class="callout good"><b>Recommendation:</b> ${n.rec}</div><p><b>Rationale:</b> ${n.why}</p><div class="callout warn"><b>Stewardship pearl:</b> ${n.pearl}</div><button class="btn" id="rs">Restart pathway</button></div>`;$('#rs').onclick=start;chips();return}
    $('#tb').innerHTML=`<h3>${T.t}</h3>${crumbs}<div class="node"><p style="font-size:1.1rem"><b>${n.q}</b></p>${n.o.map((o,i)=>`<button class="opt" data-i="${i}">${o[0]}</button>`).join('')}${path.length?'<button class="btn ghost sm" id="ub">← Back</button>':''}</div>`;
    $$('#tb .opt').forEach(b=>b.onclick=()=>{const o=n.o[+b.dataset.i];path.push(o[0]);hist.push(cur);cur=o[1];draw()});
    const ub=$('#ub');if(ub)ub.onclick=()=>{path.pop();cur=hist.pop();draw()};applyAnim()}
  const hist=[];const origStart=start;start=function(){hist.length=0;origStart()};
  chips();start();
}
/* ============ MODULE 11 ============ */
function mQuiz(el){
  const cats=['All',...new Set(BANK.map(q=>q.c))];let timer=null;onLeave(()=>clearInterval(timer));
  const setup=()=>{el.innerHTML=`<div class="card"><h3>Build a quiz</h3><div class="row"><div><label for="qc">Category</label><select id="qc">${cats.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label for="qn">Questions</label><select id="qn"><option>10</option><option>20</option><option>40</option></select></div><div><label for="qm">Mode</label><select id="qm"><option value="p">Practice (instant feedback)</option><option value="e">NAPLEX exam (timed, review at end)</option></select></div></div>
    <p style="margin-top:14px"><button class="btn" id="st">Start quiz</button> <button class="btn ghost" id="sw" ${S.wrong.length?'':'disabled'}>Review missed (${S.wrong.length})</button></p></div>
    <div class="card"><h3>Bank</h3><p>${BANK.length} questions across ${cats.length-1} categories: ${cats.slice(1).map(c=>`${c} (${BANK.filter(q=>q.c===c).length})`).join(' · ')}</p></div>`;
    $('#st').onclick=()=>{let pool=BANK.filter(q=>$('#qc').value==='All'||q.c===$('#qc').value);run(shuffle(pool).slice(0,+$('#qn').value),$('#qm').value==='e')};
    $('#sw').onclick=()=>run(shuffle(BANK.filter(q=>S.wrong.includes(q.id))),false)};
  function record(q,ok){S.answered++;if(ok){S.correct++;S.wrong=S.wrong.filter(x=>x!==q.id)}else if(!S.wrong.includes(q.id))S.wrong.push(q.id);recordCat(q.c,ok);touch('quiz',q.id);save();addXP(ok?2:0)}
  function run(qs,exam){if(!qs.length){setup();return}let i=0,right=0,miss=[],left=Math.round(qs.length*72);
    const done=()=>{clearInterval(timer);const pct=Math.round(right/qs.length*100);addXP(Math.round(pct/10));
      el.innerHTML=`<div class="card"><h3>Quiz complete</h3><div class="score">${right}/${qs.length}</div><p>${pct}% ${pct>=75?'· passing range (NAPLEX scaled ≥ 75).':'· keep practising: review the explanations below.'}</p>${miss.length?`<h4>Missed questions</h4>${miss.map(q=>`<div class="q"><p class="stem">${q.q}</p><p><span class="tag good">Answer</span> ${q.o[q.a]}</p><p class="exp">${q.e}</p></div>`).join('')}`:'<div class="callout good">Perfect score!</div>'}<button class="btn" id="ag">Back to builder</button></div>`;$('#ag').onclick=setup};
    const show=()=>{const q=qs[i];el.innerHTML=`<div class="card"><div class="mhead"><span class="tag info">${q.c}</span><span class="crumb">Question ${i+1}/${qs.length}</span>${exam?'<b id="tl" style="margin-left:auto"></b>':''}</div><div class="prog"><i style="width:${i/qs.length*100}%"></i></div><div id="qb"></div><div id="qn2"></div></div>`;
      if(exam){const tl=()=>{const m=Math.floor(left/60),s=left%60;const e=$('#tl');if(e)e.textContent=`⏱ ${m}:${String(s).padStart(2,'0')}`};tl();clearInterval(timer);timer=setInterval(()=>{left--;tl();if(left<=0)done()},1000)}
      if(exam){const order=shuffle(q.o.map((t,k)=>k));$('#qb').innerHTML=`<div class="q"><p class="stem">${q.q}</p>${order.map((k,j)=>`<button class="opt" data-i="${k}"><b>${'ABCDE'[j]}.</b> ${q.o[k]}</button>`).join('')}</div>`;
        $$('#qb .opt').forEach(b=>b.onclick=()=>{const ok=+b.dataset.i===q.a;if(ok)right++;else miss.push(q);record(q,ok);i++;i<qs.length?show():done()})}
      else renderQ($('#qb'),q,ok=>{if(ok)right++;else miss.push(q);record(q,ok);$('#qn2').innerHTML=`<button class="btn" id="nx">${i<qs.length-1?'Next →':'Finish'}</button>`;$('#nx').onclick=()=>{i++;i<qs.length?show():done()}})};
    show()}
  setup();
}
/* ============ MODULE 12 ============ */
function mStats(el){
  const acc=S.answered?Math.round(S.correct/S.answered*100):0,L=level();
  const cats=Object.entries(S.quiz).map(([k,v])=>({k,p:Math.round(v.c/v.t*100),t:v.t}));const weak=cats.filter(c=>c.t>=2).sort((a,b)=>a.p-b.p).slice(0,3);
  const untested=[...new Set(BANK.map(q=>q.c))].filter(c=>!S.quiz[c]);
  el.innerHTML=`<div class="metrics"><div class="metric"><span>Level</span><b>${L}</b><small>${S.xp} XP</small></div><div class="metric"><span>Questions answered</span><b>${S.answered}</b><small>${acc}% correct</small></div><div class="metric"><span>Battles won</span><b>${S.battle.wins}/${S.battle.runs}</b><small>${S.battle.resist} resistance events</small></div><div class="metric"><span>Cases completed</span><b>${Object.keys(S.cases).length}/${CASES.length}</b></div><div class="metric"><span>Stewardship best</span><b>${S.stew.best}</b></div><div class="metric"><span>Matching rounds</span><b>${S.match.rounds}</b></div></div>
  <div class="row" style="margin-top:16px"><div class="col card"><h3>Accuracy by topic</h3>${cats.length?cats.sort((a,b)=>a.k.localeCompare(b.k)).map(c=>`<div class="bar2"><span class="lbl">${c.k}</span><div class="prog"><i style="width:${c.p}%;background:${c.p>=75?'var(--good)':c.p>=50?'var(--warn)':'var(--bad)'}"></i></div><b style="width:78px">${c.p}% <small>(${c.t})</small></b></div>`).join(''):'<p>No quiz data yet. Try the Mega Quiz Bank.</p>'}</div>
  <div class="col card"><h3>Recommended focus</h3>${weak.length?weak.map(w=>`<div class="callout bad"><b>${w.k}</b> accuracy ${w.p}%. Review related modules.</div>`).join(''):'<p>Answer more questions to see weak areas.</p>'}${untested.length?`<div class="callout"><b>Not yet tested:</b> ${untested.join(', ')}</div>`:''}${S.wrong.length?`<p>${S.wrong.length} missed question(s) are queued for review in the Quiz Bank.</p>`:''}</div></div>
  <div class="card"><h3>Module progress</h3>${MODS.map(m=>`<div class="bar2"><span class="lbl" style="width:230px">${m.ic} ${m.n}</span><div class="prog"><i style="width:${prog(m)*100}%"></i></div><b style="width:42px">${Math.round(prog(m)*100)}%</b></div>`).join('')}</div>
  <div class="card"><h3>Case results</h3>${Object.keys(S.cases).length?`<table><tr><th>Case</th><th>Best</th></tr>${CASES.filter(c=>S.cases[c.id]).map(c=>`<tr><td>${c.t}</td><td>${S.cases[c.id].score}/${S.cases[c.id].max}</td></tr>`).join('')}</table>`:'<p>No cases completed yet.</p>'}</div>
  <div class="card"><h3>Badges</h3>${BADGES.map(b=>`<span class="badge ${S.badges[b[0]]?'':'locked'}" title="${b[3]}"><span style="font-size:1.4rem">${b[1]}</span><span><b>${b[2]}</b><br><small>${b[3]}</small></span></span>`).join('')}</div>
  <div class="card"><h3>Your data</h3><button class="btn ghost" id="ex">Download progress (JSON)</button> <button class="btn ghost" id="rs" style="color:var(--bad);border-color:var(--bad)">Reset all progress</button><p class="crumb">Progress is stored only in this browser (localStorage).</p></div>`;
  $('#ex').onclick=()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='abx-sim-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
  $('#rs').onclick=()=>{if(confirm('Reset all progress? This cannot be undone.')){const t=S.theme;S=Object.assign(defaults(),{theme:t});save();renderLvl();route()}};
}
/* ============ INIT ============ */
function init(){
  applyTheme();applyAnim();renderLvl();
  $('#themeBtn').onclick=()=>{S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();applyTheme();route()};
  $('#animBtn').onclick=()=>{S.anim=!S.anim;save();applyAnim()};
  $('#homeBtn').onclick=()=>{location.hash='#/'};
  addEventListener('hashchange',route);route();
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
