<style>
/* Layout: sticky header, two-column workspace (body map + organ zoom | detail card), fixed pharmacology bar, quiz as second tab. Sympathetic = amber/red, parasympathetic = teal/blue. */
:root{
  --bg:#f2f5f8; --surface:#ffffff; --surface2:#e8edf2; --fg:#13202c; --muted:#506271; --line:#d3dbe3;
  --sym:#c2410c; --sym-soft:#fde9dc; --sym-line:#f2b896;
  --para:#0b7285; --para-soft:#d9f0f4; --para-line:#8fd0db;
  --good:#15803d; --good-soft:#dcf5e4; --bad:#b91c1c; --bad-soft:#fde3e3;
  --font-display:'Space Grotesk',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d141b; --surface:#141e28; --surface2:#1b2835; --fg:#e7edf2; --muted:#9aaab8; --line:#283645;
  --sym:#fb923c; --sym-soft:#3a2314; --sym-line:#7a4220;
  --para:#38c7d8; --para-soft:#0f3037; --para-line:#1f6672;
  --good:#4ade80; --good-soft:#12301d; --bad:#f87171; --bad-soft:#3a1717; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d141b; --surface:#141e28; --surface2:#1b2835; --fg:#e7edf2; --muted:#9aaab8; --line:#283645;
  --sym:#fb923c; --sym-soft:#3a2314; --sym-line:#7a4220;
  --para:#38c7d8; --para-soft:#0f3037; --para-line:#1f6672;
  --good:#4ade80; --good-soft:#12301d; --bad:#f87171; --bad-soft:#3a1717; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-block:0 190px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,.disp{font-family:var(--font-display);letter-spacing:-0.01em;text-wrap:balance}
.wrap{max-width:1180px;margin:0 auto}
.surface{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.muted{color:var(--muted)} .sym{color:var(--sym)} .para{color:var(--para)}
.label{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:7px 12px;font-weight:500;font-size:13px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface2)}
button:focus-visible,[role=tab]:focus-visible,.hot:focus-visible{outline:3px solid var(--para);outline-offset:2px}
.tab{padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;border:1px solid transparent;background:none}
.tab[aria-selected=true]{background:var(--surface);color:var(--fg);border-color:var(--line)}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.pill.s[aria-pressed=true]{background:var(--sym);border-color:var(--sym);color:#fff}
.pill.p[aria-pressed=true]{background:var(--para);border-color:var(--para);color:#fff}
.dark-on-accent{color:#0d141b}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.chip{display:inline-block;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:600}
.chip.s{background:var(--sym-soft);color:var(--sym)} .chip.p{background:var(--para-soft);color:var(--para)}
.hot{cursor:pointer} .hot .ring{fill:var(--surface);stroke:var(--line);stroke-width:2;transition:all .2s}
.hot:hover .ring{stroke:var(--para)} .hot[aria-pressed=true] .ring{stroke:var(--fg);stroke-width:3;fill:var(--surface2)}
.card-s{background:var(--sym-soft);border:1px solid var(--sym-line);border-radius:12px}
.card-p{background:var(--para-soft);border:1px solid var(--para-line);border-radius:12px}
.fade{animation:fade .35s ease both} @keyframes fade{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
.opt{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--fg);transition:all .15s}
.opt:hover:not(:disabled){background:var(--surface2)}
.opt.sel{background:var(--surface2);border-color:var(--fg)}
.opt.ok{background:var(--good-soft);border-color:var(--good)} .opt.no{background:var(--bad-soft);border-color:var(--bad)}
.meter{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:99px;transition:width .5s ease,background .4s}
.pop{animation:pop .6s ease both}@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.conf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 2.4s linear forwards;z-index:40;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.09)}30%{transform:scale(.98)}45%{transform:scale(1.05)}}
@keyframes wave{from{stroke-dashoffset:0}to{stroke-dashoffset:-40}}
@keyframes breathe{0%,100%{transform:scale(.96)}50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
svg text{font-family:var(--font-body)}

const MODES = ['normal', 'agonist', 'antagonist'];

const ORGANS = [
  {
    id: 'eyes', name: 'Eyes', sub: 'Pupil and ciliary muscle', metric: 'Pupil diameter', unit: 'mm',

    sEff: { antagonist: -12, normal: 0, agonist: 40 }, pEff: { antagonist: 25, normal: 0, agonist: -28 },

    para: { receptor: 'M₂', nt: 'Acetylcholine (ACh)', effect: 'Lowers heart rate (negative chronotropy) and slows AV node conduction. Little direct effect on ventricular force.' },

    drugs: {
      sagonist: { ex: 'Phenylephrine, norepinephrine (α₁)', out: 'Vasoconstriction and higher blood pressure. Phenylephrine often triggers reflex bradycardia.' },
      santagonist: { ex: 'Prazosin, doxazosin, tamsulosin', out: 'Vasodilation and lower blood pressure. First-dose orthostatic hypotension, reflex tachycardia.' },
      pagonist: { ex: 'Methacholine, cholinesterase inhibitors', out: 'Modest vasodilation and flushing through endothelial NO. Small net effect on vascular tone.' },

const stateValue = (o, s, p) => clamp(o.baseline + o.sEff[s] + o.pEff[p]);

const QUIZ = [
  { q: 'A patient is given an α₁ antagonist such as tamsulosin. How does this change urinary outflow?', o: ['Outflow improves as bladder neck and prostatic smooth muscle relax', 'Outflow worsens as the detrusor relaxes', 'Outflow is unchanged because α₁ is not found in the GU tract', 'Outflow worsens as the external sphincter contracts'], a: 0, why: 'α₁ receptors contract the internal urethral sphincter and prostate. Blocking them lowers outlet resistance, which is why tamsulosin helps BPH.' },
  { q: 'An antimuscarinic drug is given. What happens to the pupil and the bladder?', o: ['Miosis; bladder contracts', 'Mydriasis; detrusor relaxes, risk of retention', 'Mydriasis; bladder contracts', 'No change in pupil; bladder empties faster'], a: 1, why: 'Blocking M₃ relaxes the iris sphincter (mydriasis) and the detrusor (retention risk).' },
  { q: 'Which receptor mediates the vagal slowing of heart rate?', o: ['β₁', 'M₃', 'M₂', 'α₁'], a: 2, why: 'ACh acts on M₂ receptors at the SA and AV nodes. β₁ is the sympathetic accelerator.' },
  { q: 'A postoperative patient has non-obstructive urinary retention. Which drug is the best match?', o: ['Oxybutynin', 'Bethanechol', 'Phenylephrine', 'Atropine'], a: 1, why: 'Bethanechol is a direct muscarinic agonist that contracts the detrusor. Confirm there is no mechanical obstruction first.' },
  { q: 'Pilocarpine is used in open-angle glaucoma. What is its eye effect?', o: ['Mydriasis and cycloplegia', 'Miosis with ciliary muscle contraction, improving aqueous outflow', 'Mydriasis only', 'Relaxation of the ciliary muscle'], a: 1, why: 'Pilocarpine stimulates M₃ on the iris sphincter and ciliary muscle, which opens the trabecular meshwork.' },
  { q: 'Atropine is given for symptomatic bradycardia. What is the mechanism?', o: ['Stimulates β₁ in the SA node', 'Blocks M₂ receptors, removing vagal tone', 'Blocks β₂ in vessels', 'Stimulates M₃ in the ventricle'], a: 1, why: 'Antimuscarinics remove vagal brake on the SA node and speed AV conduction.' },
  { q: 'Phenylephrine eye drops are used for a dilated fundus exam. Why is the pupil dilation different from atropine?', o: ['It acts through M₃, so accommodation is lost', 'It acts through α₁ on the radial muscle without paralyzing accommodation', 'It acts through β₂ on the ciliary muscle', 'It blocks the iris sphincter and ciliary muscle'], a: 1, why: 'α₁ stimulation contracts the radial dilator muscle. The ciliary muscle (M₃) is untouched.' },
  { q: 'A patient with asthma is started on propranolol. What is the main concern?', o: ['Bronchoconstriction from β₂ blockade', 'Bronchodilation from α₁ blockade', 'Excess mucus from M₃ stimulation', 'Bradycardia from M₂ stimulation'], a: 0, why: 'Nonselective β-blockers block bronchial β₂ receptors and can trigger bronchospasm.' },
  { q: 'A man with BPH takes an over-the-counter decongestant containing pseudoephedrine and develops urinary hesitancy. Why?', o: ['It relaxes the detrusor through M₃', 'It stimulates α₁, raising bladder neck and prostate tone', 'It blocks β₂ in the detrusor', 'It stimulates M₂ in the bladder'], a: 1, why: 'Sympathomimetic α₁ activity tightens the outlet, worsening obstruction.' },
  { q: 'Which structure has little or no parasympathetic innervation?', o: ['Bronchial smooth muscle', 'Detrusor muscle', 'Systemic blood vessels', 'Iris sphincter'], a: 2, why: 'Most vascular smooth muscle is controlled by sympathetic vasomotor tone alone.' },
  { q: 'What is the sympathetic effect on the GI tract?', o: ['Increased motility and relaxed sphincters', 'Decreased motility, contracted sphincters, reduced secretions', 'Increased gastric acid secretion', 'Increased salivary flow'], a: 1, why: 'Sympathetic output prioritizes fight or flight, so digestion is suppressed (α₁ and β₂).' },
  { q: 'An older adult on oxybutynin for overactive bladder is brought in. Which complaint fits the drug?', o: ['Diarrhea and drooling', 'Dry mouth, constipation and urinary retention', 'Bradycardia and miosis', 'Bronchospasm'], a: 1, why: 'Oxybutynin blocks muscarinic receptors broadly. Confusion is a further risk in older patients.' },
  { q: 'Which sexual function is mediated by each division?', o: ['Erection: sympathetic; ejaculation: parasympathetic', 'Erection: parasympathetic; ejaculation: sympathetic', 'Both are sympathetic', 'Both are parasympathetic'], a: 1, why: 'Parasympathetic points, sympathetic shoots. Tamsulosin can impair ejaculation through α₁ blockade.' },
  { q: 'Metoprolol lowers heart rate by blocking which receptor?', o: ['M₂', 'α₁', 'β₁', 'β₂ only'], a: 2, why: 'Metoprolol is β₁-selective, so it reduces SA node rate and contractility.' },
  { q: 'After a drug overdose a patient is drooling, tearing, has diarrhea, bradycardia and bronchospasm. Which antidote reverses the muscarinic effects?', o: ['Phenylephrine', 'Atropine', 'Propranolol', 'Albuterol'], a: 1, why: 'Atropine blocks muscarinic receptors. It treats cholinergic excess such as organophosphate poisoning.' },
  { q: 'Prazosin is started at bedtime for hypertension. Which first-dose effect is expected?', o: ['Orthostatic hypotension from α₁ blockade', 'Bronchoconstriction from β₂ blockade', 'Bradycardia from M₂ stimulation', 'Urinary retention'], a: 0, why: 'α₁ blockade dilates arterioles and veins, so standing can drop blood pressure.' },
];
const S = (cat, q, o, a, why) => ({ cat, type: 'single', q, o, a, why });
const M = (cat, q, o, a, why) => ({ cat, type: 'multi', q, o, a, why });
const CATS = ['Receptors & physiology', 'Cholinergic agents', 'Anticholinergics', 'Adrenergic agonists', 'Adrenergic antagonists', 'Toxicology & cases'];
const OLD_CATS = [4, 2, 0, 1, 1, 2, 3, 4, 3, 0, 0, 2, 0, 4, 5, 4];
QUIZ.forEach((q, i) => { q.cat = CATS[OLD_CATS[i]]; q.type = 'single'; });
const R = CATS[0], C = CATS[1], A = CATS[2];
QUIZ.push(
  S(R, 'A patient develops profuse sweating during a panic attack. Which neurotransmitter and receptor mediate eccrine sweating?', ['Norepinephrine at α₁ receptors', 'Acetylcholine at muscarinic receptors, released by sympathetic postganglionic fibers', 'Acetylcholine at nicotinic receptors', 'Epinephrine at β₂ receptors'], 1, 'Eccrine sweat glands are a sympathetic exception: postganglionic fibers release ACh onto muscarinic receptors.'),
  M(R, 'Select all effects produced by sympathetic activation.', ['Mydriasis', 'Bronchodilation', 'Increased GI motility', 'Contraction of the internal urethral sphincter', 'Increased bronchial mucus secretion'], [0, 1, 3], 'Sympathetic output dilates pupils and airways and tightens the urinary sphincter. Motility and mucus are parasympathetic effects.'),
  S(R, 'Preganglionic neurons of both autonomic divisions release which transmitter onto which receptor?', ['ACh onto nicotinic (Nn) receptors in ganglia', 'ACh onto M₁ receptors', 'NE onto α₁ receptors', 'ACh onto neuromuscular (Nm) receptors'], 0, 'Every autonomic ganglion uses ACh at neuronal nicotinic receptors. Nm receptors are at the skeletal neuromuscular junction.'),
  S(R, 'The adrenal medulla is innervated by which fibers, and what does it release mainly?', ['Preganglionic sympathetic fibers; mainly epinephrine', 'Postganglionic sympathetic fibers; mainly norepinephrine', 'Parasympathetic fibers; mainly epinephrine', 'Preganglionic sympathetic fibers; mainly dopamine'], 0, 'Chromaffin cells act like postganglionic neurons. ACh from preganglionic fibers triggers release of mostly epinephrine.'),
  S(R, 'IV acetylcholine lowers blood pressure even though most vessels lack parasympathetic nerves. Which pathway explains this?', ['Endothelial M₃ receptors causing nitric oxide release', 'Smooth-muscle M₂ receptors causing contraction', 'β₁ receptors on the endothelium', 'Nicotinic receptors on vascular smooth muscle'], 0, 'Circulating ACh stimulates endothelial M₃, which makes NO and relaxes smooth muscle.'),

const pairKey = (a, b) => [a, b].sort().join('|');

function flagsFor(vals) {
  const f = [];
  if (vals.heart <= 28) f.push(['Marked bradycardia', 'p']);
  if (vals.heart >= 82) f.push(['Tachycardia', 's']);
  if (vals.vessels >= 80) f.push(['Hypertension risk', 's']);
  if (vals.vessels <= 30) f.push(['Hypotension risk', 'p']);
  if (vals.lungs <= 25) f.push(['Bronchospasm risk', 'p']);
  if (vals.gu <= 25) f.push(['Urinary retention risk', 's']);
  if (vals.gu >= 85) f.push(['Urgency or incontinence', 'p']);
  if (vals.gi <= 25) f.push(['Constipation or ileus risk', 's']);
  if (vals.gi >= 80) f.push(['Cramping or diarrhea', 'p']);
  if (vals.eyes >= 80) f.push(['Marked mydriasis', 's']);
  if (vals.eyes <= 20) f.push(['Marked miosis', 'p']);
  return f;
}

function Interactions() {

    const a = da.d[oid] * fa / 100, b = db.d[oid] * fb / 100;

        </div>

      <div className="grid gap-3 sm:grid-cols-2">
        {pick({ id: ida, set: setIda, f: fa, setF: setFa, label: "Drug A", tag: "a" })}
        {pick({ id: idb, set: setIdb, f: fb, setF: setFb, label: "Drug B", tag: "b" })}

        <div className="flex items-center gap-2 flex-wrap"><span className={'chip ' + kc}>{kind}</span><span className="font-semibold">{da.name} + {db.name}</span></div>
        <p className="text-sm mt-2">{text}</p>

const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const LENGTHS = [8, 15, 25];
function buildRound(cats, n) {
  return shuffle(QUIZ.filter((q) => cats.includes(q.cat))).slice(0, n).map((q) => {
    const order = shuffle(q.o.map((_, i) => i));
    const ans = (Array.isArray(q.a) ? q.a : [q.a]).map((i) => order.indexOf(i)).sort();
    return { cat: q.cat, multi: q.type === 'multi', q: q.q, why: q.why, opts: order.map((i) => q.o[i]), a: ans };
  });
}
function readBest() { try { return parseInt(localStorage.getItem('ans-hub-best-pct') || '0', 10); } catch (e) { return 0; } }
function writeBest(n) { try { localStorage.setItem('ans-hub-best-pct', String(n)); } catch (e) {} }
const sameSet = (x, y) => x.length === y.length && x.every((v, i) => v === y[i]);

function Confetti({ burst }) {

  return <div aria-hidden="true">{Array.from({ length: 26 }).map((_, i) => <span key={burst + '-' + i} className="conf" style={{ left: (i * 3.9 + (i % 5)) + '%', background: colors[i % 4], animationDelay: (i % 7) * 0.08 + 's' }} />)}</div>;
}

function Quiz({ goExplore }) {
  const [phase, setPhase] = useState('setup');

  const pool = QUIZ.filter((q) => cats.includes(q.cat)).length;
  const n = Math.min(len, pool);
  const toggleCat = (c) => setCats(cats.includes(c) ? cats.filter((x) => x !== c) : [...cats, c]);
  const start = () => { setRound(buildRound(cats, n)); setI(0); setSel([]); setLocked(false); setAnswers([]); setStreak(0); setPhase('play'); };
  const finish = (all) => {
    const pct = Math.round((all.filter((x) => x.ok).length / all.length) * 100);
    if (pct > best) { setBest(pct); writeBest(pct); }
    if (pct >= 85) setBurst(Date.now());

        <span className="muted">{exam ? 'Exam mode' : `Streak ${streak}${streak >= 3 ? ' (on fire)' : ''}`}</span>
      </div>
      <div className="meter mb-4" aria-hidden="true"><i style={{ width: (i / round.length) * 100 + '%', background: 'var(--para)' }} /></div>

          <div className="flex gap-2 items-center flex-wrap">
            <div role="tablist" aria-label="Sections" className="flex gap-1">
              <button role="tab" className="tab" aria-selected={tab === 'explore'} onClick={() => setTab('explore')}>Explorer</button>
              <button role="tab" className="tab" aria-selected={tab === 'mix'} onClick={() => setTab('mix')}>Interactions</button>
              <button role="tab" className="tab" aria-selected={tab === 'quiz'} onClick={() => setTab('quiz')}>Quiz</button>
            </div>
            <button className="btn" onClick={reset}>Reset state</button>
            <button className="btn" onClick={toggleTheme} aria-label="Toggle light or dark theme">Theme</button>
          </div>
        </div>
      </header>
      <main className="wrap pt-4">
        {tab === 'explore' && <Explorer sel={sel} setSel={setSel} s={s} p={p} />}
        {tab === 'mix' && <Interactions />}
        {tab === 'quiz' && <Quiz goExplore={() => setTab('explore')} />}
      </main>
      <footer className="wrap mt-8 pt-4 text-xs muted" style={{ borderTop: '1px solid var(--line)' }}>
        © Hafeez Faridi, PhD · Educational use only. Not a substitute for clinical judgment or current prescribing information.
      </footer>
      {tab === 'explore' && <ControlBar s={s} p={p} setS={setS} setP={setP} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body></html>
