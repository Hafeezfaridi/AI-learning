<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADHD Pathophysiology &amp; Pharmacology Simulator</title>
<meta name="description" content="Interactive educational simulator: ADHD neurobiology, genetics, pharmacology, clinical cases, diagnostics, imaging and board-style practice.">
<style>
/* =====================================================================
   ADHD Pathophysiology & Pharmacology Simulator
   Single-file build: CSS tokens -> layout -> components -> modules
   Theming: [data-theme=light|dark|auto], [data-contrast=high], [data-cb=on]
   ===================================================================== */
:root{
  --font-body: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-head: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --scale: 1;
  --r-lg: 18px; --r-md: 12px; --r-sm: 8px;
  /* light palette */
  --bg:#e9f0f3; --bg2:#dde8ed; --glass:rgba(255,255,255,.66); --glass-strong:rgba(255,255,255,.88);
  --line:rgba(20,50,70,.16); --ink:#12232f; --mute:#4a6372; --accent:#0e8a7c; --accent-ink:#ffffff;
  --da:#c26d06; --ne:#4752cf; --glu:#b8337a; --gaba:#1f7fb3;
  --good:#16854f; --bad:#c23b3b; --warn:#a96a00; --info:#1f6fb2;
  --brain-fill:#f3d9d4; --brain-line:#8c5a58; --shadow:0 10px 30px rgba(18,35,47,.12);
  --glow1:rgba(14,138,124,.18); --glow2:rgba(71,82,207,.14);
}
@media (prefers-color-scheme: dark){
  :root[data-theme=auto]{ color-scheme:dark;
    --bg:#0b1721; --bg2:#10202c; --glass:rgba(22,40,54,.62); --glass-strong:rgba(22,40,54,.9);
    --line:rgba(160,205,225,.17); --ink:#e7f0f5; --mute:#9bb2c1; --accent:#38c4b2; --accent-ink:#06211d;
    --da:#f2a83c; --ne:#8f9dff; --glu:#f07aae; --gaba:#62c4f4;
    --good:#41d392; --bad:#ff7070; --warn:#f0b24a; --info:#6cb4f2;
    --brain-fill:#2c3f4c; --brain-line:#7fa1b4; --shadow:0 14px 36px rgba(0,0,0,.4);
    --glow1:rgba(56,196,178,.16); --glow2:rgba(143,157,255,.12); }
}
:root[data-theme=dark]{ color-scheme:dark;
  --bg:#0b1721; --bg2:#10202c; --glass:rgba(22,40,54,.62); --glass-strong:rgba(22,40,54,.9);
  --line:rgba(160,205,225,.17); --ink:#e7f0f5; --mute:#9bb2c1; --accent:#38c4b2; --accent-ink:#06211d;
  --da:#f2a83c; --ne:#8f9dff; --glu:#f07aae; --gaba:#62c4f4;
  --good:#41d392; --bad:#ff7070; --warn:#f0b24a; --info:#6cb4f2;
  --brain-fill:#2c3f4c; --brain-line:#7fa1b4; --shadow:0 14px 36px rgba(0,0,0,.4);
  --glow1:rgba(56,196,178,.16); --glow2:rgba(143,157,255,.12); }
/* colour-blind safe: blue (healthy) / orange (impaired); dopamine moves to magenta so it never collides with "impaired" */
:root[data-cb=on]{ --good:#2f7fe8; --bad:#e07b00; --da:#c94fb8; --ne:#14a3a3; --warn:#d9a400; }
:root[data-cb=on][data-theme=dark]{ --good:#5aa2ff; --bad:#ffa133; --da:#ee7fdc; --ne:#46d3d3; }
@media (prefers-color-scheme: dark){ :root[data-cb=on][data-theme=auto]{ --good:#5aa2ff; --bad:#ffa133; --da:#ee7fdc; --ne:#46d3d3; } }
/* high contrast */
:root[data-contrast=high]{ color-scheme:dark; --bg:#000; --bg2:#000; --glass:#000; --glass-strong:#000; --line:#fff; --ink:#fff; --mute:#e8e8e8;
  --accent:#ffe600; --accent-ink:#000; --good:#4dff88; --bad:#ff6a6a; --da:#ffb000; --ne:#8ab4ff; --glu:#ff7fd0; --gaba:#7fe0ff; --warn:#ffd24d; --info:#8ac8ff;
  --brain-fill:#111; --brain-line:#fff; --glow1:transparent; --glow2:transparent; --shadow:none; }
:root[data-contrast=high][data-cb=on]{ --good:#66b3ff; --bad:#ffa500; --da:#ff8cf0; --ne:#5df0f0; }
:root[data-contrast=high] .glass, :root[data-contrast=high] .card{ border:2px solid #fff; backdrop-filter:none; }

*{ box-sizing:border-box; }
html{ font-size:calc(16px * var(--scale)); }
body{ margin:0; font-family:var(--font-body); color:var(--ink); background:var(--bg); line-height:1.5; min-height:100vh;
  background-image: radial-gradient(900px 600px at 8% -10%, var(--glow1), transparent 60%), radial-gradient(800px 600px at 100% 10%, var(--glow2), transparent 60%);
  background-attachment: fixed; -webkit-font-smoothing:antialiased; }
h1,h2,h3,h4{ font-family:var(--font-head); font-weight:600; line-height:1.2; margin:0 0 .5em; letter-spacing:.005em; }
h1{ font-size:1.9rem; } h2{ font-size:1.4rem; } h3{ font-size:1.12rem; } h4{ font-size:1rem; }
p{ margin:.4em 0 .8em; } ul{ margin:.3em 0 .8em; padding-left:1.2em; }
small,.small{ font-size:.82rem; color:var(--mute); }
a{ color:var(--accent); }
button,input,select,textarea{ font:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; border-radius:6px; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.skip{ position:absolute; left:-999px; top:8px; background:var(--accent); color:var(--accent-ink); padding:8px 14px; border-radius:8px; z-index:200; }
.skip:focus{ left:8px; }

/* ---------- layout ---------- */
.app{ display:grid; grid-template-columns:268px 1fr; min-height:100vh; }
.side{ position:sticky; top:0; height:100vh; overflow:auto; padding:18px 14px; border-right:1px solid var(--line);
  background:var(--glass); backdrop-filter:blur(18px) saturate(1.3); -webkit-backdrop-filter:blur(18px) saturate(1.3); z-index:50; }
.brand{ display:flex; gap:10px; align-items:center; padding:4px 8px 16px; }
.brand svg{ flex:none; }
.brand b{ font-family:var(--font-head); font-size:1.02rem; line-height:1.15; display:block; }
.brand span{ font-size:.74rem; color:var(--mute); }
.nav{ display:flex; flex-direction:column; gap:2px; }
.nav button{ display:flex; gap:10px; align-items:center; text-align:left; background:none; border:0; padding:8px 10px; border-radius:10px; cursor:pointer; color:var(--ink); font-size:.92rem; }
.nav button:hover{ background:color-mix(in srgb, var(--accent) 12%, transparent); }
.nav button[aria-current=page]{ background:color-mix(in srgb, var(--accent) 22%, transparent); font-weight:600; box-shadow:inset 3px 0 0 var(--accent); }
.nav .num{ flex:none; width:26px; height:22px; border-radius:6px; display:grid; place-items:center; font-size:.72rem; font-weight:700; border:1px solid var(--line); color:var(--mute); font-family:var(--font-mono); }
.nav button[aria-current=page] .num{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.nav .done::after{ content:"\2713"; margin-left:auto; color:var(--good); font-weight:700; }
.nav h6{ margin:14px 10px 4px; font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); font-weight:600; }
.mainwrap{ min-width:0; display:flex; flex-direction:column; }
.top{ position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:14px; padding:10px 22px; border-bottom:1px solid var(--line);
  background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
.top h1{ font-size:1.15rem; margin:0; flex:0 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.byline{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:var(--font-head); font-style:italic; color:var(--mute); font-size:.95rem; padding-left:10px; border-left:1px solid var(--line); margin-left:2px; }
.menu-btn{ display:none; }
.xpbox{ display:flex; align-items:center; gap:10px; font-size:.8rem; }
.xpbar{ width:120px; height:8px; border-radius:99px; background:var(--line); overflow:hidden; }
.xpbar i{ display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--ne)); border-radius:99px; transition:width .6s ease; }
main{ padding:22px; max-width:1240px; width:100%; margin:0 auto; outline:none; }
.mod[hidden]{ display:none; }
.mod > header{ margin-bottom:16px; }
.mod > header p{ color:var(--mute); max-width:78ch; }
.objectives{ font-size:.86rem; color:var(--mute); }
.grid{ display:grid; gap:16px; }
.g2{ grid-template-columns:repeat(2,minmax(0,1fr)); } .g3{ grid-template-columns:repeat(3,minmax(0,1fr)); } .g4{ grid-template-columns:repeat(4,minmax(0,1fr)); }
.g-side{ grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); }
.row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.spacer{ flex:1; }

/* ---------- components ---------- */
.glass,.card{ background:var(--glass); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow);
  backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px) saturate(1.2); }
.card{ padding:16px 18px; min-width:0; }
.card > h3:first-child, .card > h4:first-child{ margin-top:0; }
.btn{ border:1px solid var(--line); background:var(--glass-strong); padding:8px 14px; border-radius:10px; cursor:pointer; font-weight:600; font-size:.9rem; transition:transform .15s, background .2s; }
.btn:hover{ transform:translateY(-1px); border-color:var(--accent); }
.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.btn.sm{ padding:4px 10px; font-size:.8rem; border-radius:8px; }
.btn[disabled]{ opacity:.45; cursor:not-allowed; transform:none; }
.chip{ display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border-radius:99px; font-size:.76rem; font-weight:600; border:1px solid var(--line); background:var(--glass-strong); }
.chip.da{ color:var(--da); border-color:var(--da); } .chip.ne{ color:var(--ne); border-color:var(--ne); }
.chip.glu{ color:var(--glu); border-color:var(--glu); } .chip.gaba{ color:var(--gaba); border-color:var(--gaba); }
.chip.good{ color:var(--good); border-color:var(--good); } .chip.bad{ color:var(--bad); border-color:var(--bad); } .chip.warn{ color:var(--warn); border-color:var(--warn); }
.tabs{ display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:14px; }
.tabs [role=tab]{ background:none; border:0; border-bottom:3px solid transparent; padding:8px 14px; cursor:pointer; font-weight:600; color:var(--mute); border-radius:8px 8px 0 0; }
.tabs [role=tab][aria-selected=true]{ color:var(--ink); border-bottom-color:var(--accent); }
.tabs [role=tab]:hover{ color:var(--ink); }
.field{ display:grid; gap:4px; margin:10px 0; }
.field label{ display:flex; justify-content:space-between; font-weight:600; font-size:.88rem; }
.field output{ font-family:var(--font-mono); color:var(--accent); }
input[type=range]{ width:100%; accent-color:var(--accent); height:28px; }
select,input[type=text]{ background:var(--glass-strong); border:1px solid var(--line); border-radius:8px; padding:7px 10px; }
.bar{ height:10px; border-radius:99px; background:var(--line); overflow:hidden; }
.bar > i{ display:block; height:100%; border-radius:99px; transition:width .5s cubic-bezier(.2,.8,.2,1); background:var(--accent); }
.barrow{ display:grid; grid-template-columns:150px 1fr 54px; gap:10px; align-items:center; font-size:.86rem; margin:7px 0; }
.barrow span:last-child{ text-align:right; font-family:var(--font-mono); font-size:.8rem; }
.callout{ border-left:4px solid var(--info); background:color-mix(in srgb, var(--info) 10%, transparent); padding:10px 14px; border-radius:0 10px 10px 0; font-size:.9rem; margin:10px 0; }
.callout.warn{ border-color:var(--warn); background:color-mix(in srgb, var(--warn) 12%, transparent); }
.callout.good{ border-color:var(--good); background:color-mix(in srgb, var(--good) 11%, transparent); }
.callout.bad{ border-color:var(--bad); background:color-mix(in srgb, var(--bad) 11%, transparent); }
canvas.sim{ width:100%; height:auto; display:block; border-radius:var(--r-md); background:color-mix(in srgb, var(--bg2) 85%, transparent); border:1px solid var(--line); }
svg.fig{ width:100%; height:auto; display:block; }
table.data{ width:100%; border-collapse:collapse; font-size:.82rem; }
table.data th,table.data td{ padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
table.data th{ position:sticky; top:0; background:var(--glass-strong); cursor:pointer; white-space:nowrap; user-select:none; }
table.data th[aria-sort=ascending]::after{ content:" \25B2"; } table.data th[aria-sort=descending]::after{ content:" \25BC"; }
table.data tr:hover td{ background:color-mix(in srgb, var(--accent) 7%, transparent); }
.tablewrap{ overflow:auto; max-height:70vh; border-radius:var(--r-md); border:1px solid var(--line); }
.opt{ display:block; width:100%; text-align:left; padding:10px 14px; margin:6px 0; border-radius:10px; border:1px solid var(--line); background:var(--glass-strong); cursor:pointer; }
.opt:hover:not([disabled]){ border-color:var(--accent); }
.opt[aria-pressed=true]{ border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
.opt.right{ border-color:var(--good); background:color-mix(in srgb, var(--good) 14%, transparent); }
.opt.wrong{ border-color:var(--bad); background:color-mix(in srgb, var(--bad) 14%, transparent); }
.opt[disabled]{ cursor:default; }
.kv{ display:grid; grid-template-columns:130px 1fr; gap:6px 12px; font-size:.9rem; }
.kv dt{ color:var(--mute); font-weight:600; } .kv dd{ margin:0; }
.legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:.8rem; color:var(--mute); }
.legend i{ display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
.metric{ display:grid; gap:2px; }
.metric b{ font-size:1.5rem; font-family:var(--font-head); }
.badge-tile{ display:flex; gap:10px; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:12px; opacity:.45; }
.badge-tile.on{ opacity:1; border-color:var(--accent); }
.badge-tile .ico{ width:38px; height:38px; border-radius:50%; display:grid; place-items:center; background:var(--line); font-weight:700; }
.badge-tile.on .ico{ background:var(--accent); color:var(--accent-ink); }
#toasts{ position:fixed; right:16px; bottom:16px; display:grid; gap:8px; z-index:300; }
.toast{ background:var(--glass-strong); border:1px solid var(--accent); padding:10px 14px; border-radius:12px; box-shadow:var(--shadow); max-width:320px; font-size:.88rem; animation:pop .35s ease; backdrop-filter:blur(10px); }
@keyframes pop{ from{ transform:translateY(12px); opacity:0; } to{ transform:none; opacity:1; } }
dialog{ border:1px solid var(--line); border-radius:var(--r-lg); background:var(--glass-strong); color:var(--ink); padding:20px 22px; max-width:440px; width:92vw; backdrop-filter:blur(16px); }
dialog::backdrop{ background:rgba(0,0,0,.45); }
.region{ cursor:pointer; transition:filter .2s, opacity .2s; }
.region:hover,.region:focus-visible{ filter:brightness(1.2); outline:none; }
.region.sel{ stroke:var(--ink); stroke-width:3; }
.tag-red{ color:var(--bad); } .tag-green{ color:var(--good); }
.pulse-dot{ display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--good); margin-right:6px; animation:pulse 1.4s infinite; }
@keyframes pulse{ 50%{ opacity:.25; transform:scale(.7); } }
.cert{ background:#fffdf6; color:#1b2a33; border:6px double #b38b2e; border-radius:10px; padding:34px 28px; text-align:center; font-family:var(--font-head); }
.cert h2{ font-size:1.8rem; } .cert .nm{ font-size:1.7rem; border-bottom:1px solid #999; display:inline-block; padding:0 28px; margin:10px 0; }
.disclaimer{ font-size:.78rem; color:var(--mute); border-top:1px solid var(--line); margin-top:26px; padding-top:12px; }
@media (max-width:1000px){
  .g3,.g4{ grid-template-columns:repeat(2,minmax(0,1fr)); } .g-side{ grid-template-columns:1fr; }
}
@media (max-width:860px){
  .app{ grid-template-columns:1fr; }
  .side{ position:fixed; left:0; top:0; bottom:0; width:280px; transform:translateX(-102%); transition:transform .25s; }
  .side.open{ transform:none; }
  .menu-btn{ display:inline-block; }
  main{ padding:14px; } .g2,.g3,.g4{ grid-template-columns:1fr; }
  .byline{ display:none; }
  .xpbar{ width:60px; } .barrow{ grid-template-columns:110px 1fr 46px; } .top{ padding:8px 12px; }
}
@media print{
  body *{ visibility:hidden; } .cert, .cert *{ visibility:visible; } .cert{ position:absolute; left:0; top:0; width:100%; }
}
@media (prefers-reduced-motion: reduce){ .toast{ animation:none; } .pulse-dot{ animation:none; } .bar>i,.xpbar i{ transition:none; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<div class="app">
  <aside class="side" id="side" aria-label="Simulator modules">
    <div class="brand">
      <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="var(--accent)" stroke-width="2.5"/><path d="M9 22c2-9 9-12 15-9s8 9 5 14" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/><circle cx="14" cy="25" r="2.6" fill="var(--da)"/><circle cx="25" cy="16" r="2.6" fill="var(--ne)"/><circle cx="27" cy="27" r="2.2" fill="var(--accent)"/></svg>
      <div><b>ADHD Simulator</b><span>Pathophysiology &amp; Pharmacology</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="Modules"></nav>
  </aside>
  <div class="mainwrap">
    <header class="top">
      <button class="btn sm menu-btn" id="menuBtn" aria-label="Open navigation menu" aria-expanded="false" aria-controls="side">Menu</button>
      <h1 id="pageTitle">Home</h1>
      <span class="byline">Hafeez Faridi, Ph.D.</span>
      <div class="xpbox" aria-label="Experience points">
        <span id="lvlTxt">Level 1</span>
        <div class="xpbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="xpbarWrap"><i id="xpFill" style="width:0%"></i></div>
        <span id="xpTxt">0 XP</span>
      </div>
      <button class="btn sm" id="themeBtn" aria-label="Toggle light and dark theme">Theme</button>
      <button class="btn sm" id="setBtn" aria-haspopup="dialog">Settings</button>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>

<dialog id="settings" aria-labelledby="setTitle">
  <h3 id="setTitle">Display and accessibility</h3>
  <div class="field"><label for="setTheme">Theme</label>
    <select id="setTheme"><option value="auto">Match system</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
  <div class="field"><label for="setSpeed">Animation speed <output id="setSpeedOut">1.0x</output></label>
    <input type="range" id="setSpeed" min="0" max="2" step="0.1" value="1" aria-describedby="speedHelp">
    <small id="speedHelp">0 pauses all animations. Your system's reduced-motion setting starts the speed at 0.3x.</small></div>
  <div class="field"><label for="setFont">Text size <output id="setFontOut">100%</output></label>
    <input type="range" id="setFont" min="0.9" max="1.4" step="0.05" value="1"></div>
  <div class="field"><label><span>High-contrast mode</span><input type="checkbox" id="setHC"></label></div>
  <div class="field"><label><span>Colour-blind safe palette (blue/orange)</span><input type="checkbox" id="setCB"></label></div>
  <div class="row"><button class="btn" id="resetData">Reset all progress</button><span class="spacer"></span><button class="btn primary" id="closeSet">Done</button></div>
</dialog>
<div id="toasts" role="status" aria-live="polite"></div>
<div class="sr-only" id="live" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
   CORE ENGINE
   - DOM helpers, persistent store, XP/badges, mastery tracking
   - Animation manager (one rAF loop, speed-scaled, visibility-aware)
   - Router, tabs, shared UI components (slider, bars, gauge)
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const randn = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/** Tiny hyperscript: h('div',{class:'x',onclick:fn},child,...) */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) { if (kid == null || kid === false) continue; e.append(kid.nodeType ? kid : (kid.el && kid.el.nodeType) ? kid.el : document.createTextNode(kid)); }
  return e;
}
const SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, ...kids) {

const Anim = {
  list: new Set(), last: 0, running: false,
  /** fn(dtScaled, dtRaw, tSeconds). Runs only while `el` is visible. Returns a handle for remove(). */

  remove(a) { this.list.delete(a); },
  tick(t) {
    const raw = Math.min(0.05, (t - this.last) / 1000 || 0.016); this.last = t;
    const sp = S.settings.speed;
    for (const a of this.list) { if (a.el && (!a.el.isConnected || !a.el.getClientRects().length)) continue; try { a.fn(raw * sp, raw, t / 1000); } catch (e) { console.error(e); } }

/** HiDPI canvas helper: logical size w x h, CSS scales it */
function makeCanvas(w, h_, label) {
  const c = h('canvas', { class: 'sim', role: 'img', 'aria-label': label || 'Animated simulation' });

  const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, class: 'fig', role: 'img', 'aria-label': label },

    sv('path', { d: arc(.34, .67), stroke: 'var(--warn)', 'stroke-width': 14, fill: 'none' }),

}

/* =====================================================================
   SIMULATION ENGINES (shared by Modules 2, 4 and 12)
   1) SynapseSim  - particle model of a monoaminergic synapse
        release -> diffusion -> reuptake (DAT/NET) -> receptor binding,
        plus VMAT2 loading/leak, transporter reversal and drug blockade
   2) SignalSim   - prefrontal signal-to-noise / arousal oscilloscope
   3) PK curves   - simple one-compartment absorption/elimination shapes
   ===================================================================== */
class SynapseSim {
  static baseline = {};
  constructor(opts = {}) {
    this.W = 720; this.H = 380;
    const cv = makeCanvas(this.W, this.H, opts.label || 'Synapse simulation: transmitter release, reuptake and receptor binding');
    this.el = cv.c; this.ctx = cv.ctx;
    this.PRE = 120; this.CL1 = 190;
    this.p = Object.assign({
      mode: 'striatal', release: 1, vmat2: 1, vmat2On: true, datOn: true, netOn: true, datBlock: 0, netBlock: 0, reverse: 0, clearK: 1,
      d1On: true, d2On: true, a2On: true, drug: 'none', drugLevel: 0, drugRole: 'blocker'
    }, opts.params || {});
    this.parts = []; this.vesicles = []; this.cyt = 0; this.leakAcc = 0; this.t = 0; this.relAcc = 0; this.revAcc = 0;
    this.stats = { cleft: 0, rel: 1, occ: 0, occD1: 0, occD2: 0, occA2: 0, cyt: 0 };
    this.col = {}; this.frame = 0; this.drugAcc = 0;
    this.buildGeometry();
    for (let i = 0; i < 6; i++) this.step(0.1);   // warm start
    this.handle = null;
  }
  /** (re)build transporter / receptor / vesicle layout for the current mode */
  buildGeometry() {
    const m = this.p.mode;
    const tx = [100, 215, 330, 445, 560, 650];
    this.trans = tx.map((x, i) => ({ x, type: m === 'striatal' ? 'DAT' : m === 'ne' ? 'NET' : (i === 2 ? 'DAT' : 'NET'), flash: 0 }));
    const rx = [80, 170, 260, 350, 440, 530, 620];
    this.recs = rx.map((x, i) => ({ x, type: m === 'striatal' ? (i % 2 ? 'D2' : 'D1') : m === 'ne' ? 'A2A' : (i % 2 ? 'A2A' : 'D1'), bound: 0, occ: 0 }));
    const vx = [95, 190, 285, 380, 475, 570, 650];
    if (!this.vesicles.length) this.vesicles = vx.map(x => ({ x, y: 88 + rnd(-8, 8), fill: 1, fuse: 0 }));
    this.parts = this.parts.filter(p => p.sp === 'DRUG');
  }
  set(params) {
    const modeChanged = params.mode && params.mode !== this.p.mode;
    Object.assign(this.p, params);
    if (modeChanged) this.buildGeometry();
  }
  species() { const m = this.p.mode; return m === 'striatal' ? ['DA'] : m === 'ne' ? ['NE'] : ['NE', 'DA']; }
  isBlocked(tr, idx) {
    const same = this.trans.filter(t => t.type === tr.type);
    const k = same.indexOf(tr);
    const b = tr.type === 'DAT' ? this.p.datBlock : this.p.netBlock;
    return (k + 0.5) / same.length <= b;
  }
  present(tr) { return tr.type === 'DAT' ? this.p.datOn : this.p.netOn; }
  recOn(r) { return r.type === 'D1' ? this.p.d1On : r.type === 'D2' ? this.p.d2On : this.p.a2On; }
  bindsSpecies(r, sp) { return r.type === 'A2A' ? sp === 'NE' : sp === 'DA'; }

  step(dtIn) {
    const P = this.p, CL0 = this.PRE, CL1 = this.CL1;
    const n = Math.max(1, Math.ceil(dtIn / 0.025)), dt = dtIn / n;
    for (let s = 0; s < n; s++) {

      const vmat = P.vmat2On ? P.vmat2 : 0;
      for (const v of this.vesicles) {

      }

      /* --- cytosolic clearance: MAO / repackaging --- */
      if (this.cyt > 0 && Math.random() < (0.25 + 0.5 * vmat) * dt * this.cyt * 0.15) this.cyt--;
      /* --- exocytosis (Poisson) --- */
      const rate = 1.5 * P.release * (this.vesicles.length / 7) * 1.3;

        const ready = this.vesicles.filter(v => v.fill > 0.45 && v.fuse <= 0);

        }

      if (P.reverse > 0 && this.cyt > 0) {

        while (this.revAcc >= 1 && this.cyt > 0) {
          this.revAcc -= 1;
          const cand = this.trans.filter(t => this.present(t));
          if (!cand.length) break;
          const tr = cand[Math.floor(Math.random() * cand.length)];
          this.cyt--; tr.flash = 0.25;
          this.parts.push({ x: tr.x + rnd(-4, 4), y: CL0 + 3, vx: rnd(-15, 15), vy: rnd(30, 70), sp: tr.type === 'DAT' ? 'DA' : spList[0], bound: 0 });
        }

      /* --- drug particles (visual) --- */
      if (P.drug !== 'none' && P.drugLevel > 0) {
        this.drugAcc += P.drugLevel * 2.2 * dt;
        while (this.drugAcc >= 1) {

/* ---------------- Module 2 ---------------- */
const SIM = { da: 75, ne: 75, ef: 80, rw: 75, subs: [], on(f) { this.subs.push(f); }, emit() { this.subs.forEach(f => f()); } };
const uDef = (x, opt, w = 40) => 1 - Math.exp(-(((x - opt) / w) ** 2));   // inverted-U deficit
const lowDef = x => 1 - x / 100;
function symptoms() {
  const { da, ne, ef, rw } = SIM;
  const S_ = {
    distract: .45 * uDef(ne, 65) + .30 * uDef(da, 65) + .25 * lowDef(ef),
    hyper: .50 * lowDef(da) + .20 * lowDef(ne) + .30 * lowDef(ef),
    impuls: .30 * lowDef(da) + .40 * lowDef(ef) + .15 * lowDef(rw) + .15 * lowDef(ne),
    organ: .55 * lowDef(ef) + .25 * uDef(da, 65) + .20 * lowDef(ne),
    time: .45 * lowDef(ef) + .30 * lowDef(da) + .25 * lowDef(rw),
    wm: .40 * uDef(da, 65) + .30 * uDef(ne, 65) + .30 * lowDef(ef),
    emo: .40 * lowDef(ef) + .20 * lowDef(ne) + .20 * lowDef(da) + .20 * lowDef(rw)
  };
  for (const k in S_) S_[k] = clamp(S_[k]) * 100;
  return S_;
}
const SYM_LABELS = [['distract', 'Distractibility'], ['hyper', 'Hyperactivity'], ['impuls', 'Impulsivity'], ['organ', 'Poor organization'], ['time', 'Time blindness'], ['wm', 'Poor working memory'], ['emo', 'Emotional dysregulation']];
const sevText = v => v < 20 ? 'minimal' : v < 40 ? 'mild' : v < 60 ? 'moderate' : 'marked';

function renderSymptomSim(host) {
  const g = gauge('Cognitive performance');
  const rows = {}, barsBox = h('div');
  SYM_LABELS.forEach(([k, l]) => { rows[k] = bar(l, 0, 'var(--bad)'); barsBox.append(rows[k]); });
  const summary = h('div', { class: 'callout', 'aria-live': 'polite' });
  const sl = {};
  const mk = (key, label) => { sl[key] = slider(label, 0, 100, SIM[key], v => { SIM[key] = v; SIM.emit(); }); return sl[key].el; };
  const presets = {
    'Typical': { da: 75, ne: 75, ef: 80, rw: 75 }, 'ADHD, untreated': { da: 40, ne: 45, ef: 42, rw: 38 },
    'Stimulant-treated': { da: 70, ne: 68, ef: 62, rw: 55 }, 'Over-treated (supratherapeutic)': { da: 98, ne: 96, ef: 70, rw: 80 }
  };
  const pbtn = Object.keys(presets).map(n => h('button', { class: 'btn sm', onclick: () => { Object.assign(SIM, presets[n]); ['da', 'ne', 'ef', 'rw'].forEach(k => sl[k].set(SIM[k])); SIM.emit(); } }, n));
  const update = () => {
    const s = symptoms(); let tot = 0;
    const wts = { distract: .22, wm: .22, organ: .14, impuls: .16, time: .10, emo: .08, hyper: .08 };
    for (const [k] of SYM_LABELS) { rows[k].set(s[k], s[k] < 33 ? 'var(--good)' : s[k] < 55 ? 'var(--warn)' : 'var(--bad)', Math.round(s[k]) + '% · ' + sevText(s[k])); tot += wts[k] * s[k]; }
    const perf = 100 - tot; g.set(perf);
    const hi = SIM.da > 88 || SIM.ne > 88;
    summary.className = 'callout ' + (hi ? 'warn' : perf > 70 ? 'good' : perf > 45 ? 'warn' : 'bad');
    summary.innerHTML = hi ? '<b>Beyond the optimum.</b> Excess dopamine or norepinephrine does not help: the inverted-U curve means working memory and focus fall again, with jitteriness, anxiety and stereotyped behaviour (think supratherapeutic stimulant dosing).'
      : (SIM.da < 55 && SIM.ne < 55) ? '<b>Combined catecholamine hypofunction.</b> Low dopamine drives motivation, reward and response-inhibition problems; low norepinephrine drives alertness and persistence problems. The result resembles untreated combined-presentation ADHD.'
      : SIM.da < 55 ? '<b>Dopamine-weighted deficit.</b> Expect hyperactivity, impulsivity, weak reward drive and time blindness.'
      : SIM.ne < 55 ? '<b>Norepinephrine-weighted deficit.</b> Expect distractibility, low alertness and poor task persistence.'
      : SIM.ef < 55 ? '<b>Executive-function-weighted deficit.</b> Organization, planning and time management suffer even with intact catecholamine tone.'
      : '<b>Within the typical operating range.</b> Prefrontal circuits receive enough catecholamine tone for stable attention.';
    announce('Cognitive performance ' + Math.round(perf) + ' percent');
  };
  SIM.on(update);
  // Go/No-Go task
  const task = makeGoNoGo();
  const left = h('div', null, card('Neurochemical controls', mk('da', 'Dopamine'), mk('ne', 'Norepinephrine'), mk('ef', 'Executive function'), mk('rw', 'Reward sensitivity'),
    h('div', { class: 'row' }, h('small', null, 'Presets:'), pbtn)),
    h('div', { style: 'height:16px' }), task.card);
  const right = h('div', null, card('Cognitive performance', h('div', { style: 'max-width:300px;margin:0 auto' }, g.el)),
    h('div', { style: 'height:16px' }), card('Emerging symptoms', barsBox, summary),
    h('div', { style: 'height:16px' }), callout('<b>Not just "low dopamine".</b> ADHD is a heterogeneous, highly heritable neurodevelopmental disorder with small group-level effects across many circuits. The sliders model one useful hypothesis (catecholamine hypofunction in frontostriatal circuits); executive function and reward sensitivity are modelled separately because they can be impaired independently.'));
  host.append(h('div', { class: 'grid g2' }, left, right));

}

/** Go/No-Go: 30 trials; omission and commission rates driven by SIM state */
function makeGoNoGo() {
  const box = h('div', { style: 'height:96px;display:grid;place-items:center;font-size:3rem;font-family:var(--font-head);border:1px solid var(--line);border-radius:12px', 'aria-live': 'off' }, '·');
  const res = h('div', { class: 'small', 'aria-live': 'polite' }, 'Press Run to simulate 30 trials. Respond to every letter except "X".');
  const btn = h('button', { class: 'btn primary' }, 'Run Go/No-Go simulation');
  let running = false;
  btn.onclick = () => {
    if (running) return; running = true; btn.disabled = true;
    const s = symptoms(); const pOm = clamp(0.02 + s.distract / 100 * 0.38), pCom = clamp(0.04 + s.impuls / 100 * 0.62), rtBase = 340 + s.wm * 1.6, rtSd = 40 + s.distract * 2.2;
    let i = 0, om = 0, co = 0, rts = []; const letters = 'ABCDEFGHJKLM';
    const trial = () => {
      if (i >= 30) { done(); return; }
      const nogo = Math.random() < 0.25; box.textContent = nogo ? 'X' : letters[Math.floor(Math.random() * letters.length)]; box.style.color = nogo ? 'var(--bad)' : 'var(--ink)';
      if (nogo) { if (Math.random() < pCom) { co++; box.style.background = 'color-mix(in srgb, var(--bad) 25%, transparent)'; } else box.style.background = 'color-mix(in srgb, var(--good) 20%, transparent)'; }
      else { if (Math.random() < pOm) { om++; box.style.background = 'color-mix(in srgb, var(--warn) 25%, transparent)'; } else { rts.push(Math.max(180, rtBase + randn() * rtSd)); box.style.background = 'color-mix(in srgb, var(--good) 20%, transparent)'; } }
      i++; res.textContent = 'Trial ' + i + '/30 · omissions ' + om + ' · commissions ' + co;
      setTimeout(trial, Math.max(25, 330 / Math.max(0.2, S.settings.speed || 0.2)));
    };
    const done = () => {
      box.textContent = '·'; box.style.background = ''; running = false; btn.disabled = false;
      const m = rts.length ? rts.reduce((a, b) => a + b) / rts.length : 0, sd = rts.length ? Math.sqrt(rts.reduce((a, b) => a + (b - m) ** 2, 0) / rts.length) : 0;
      res.innerHTML = `<b>Result:</b> omissions ${om} (inattention), commissions ${co} (impulsivity), mean RT ${Math.round(m)} ms, RT variability (SD) ${Math.round(sd)} ms. Intra-individual RT variability is one of the most consistent cognitive findings in ADHD.`;
      if (!S.flags.gng) { S.flags.gng = 1; award('sliders'); addXP(10, 'task run'); } mastery('neuro', true);
    };
    trial();
  };
  return { card: card('Go/No-Go task', h('p', { class: 'small' }, 'Outcomes use your current slider settings.'), box, h('div', { class: 'row', style: 'margin-top:10px' }, btn), res) };
}

function renderMimicQuiz(host) {

    const fb = h('div'); let answered = false;

        if (answered) return; answered = true; const ok = o === c.a; if (ok) score++; mastery('diag', ok);
        $$('.opt', box).forEach(b => { b.disabled = true; if (b.textContent === c.a) b.classList.add('right'); });
        if (!ok) e.currentTarget.classList.add('wrong');

  }
  host.append(box); ask();
}
